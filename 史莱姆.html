      <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">◈ 系统词条（${s.traits.length}/3）</div>
      <div class="trait-list">
        ${s.traits.length ? s.traits.map(t=>`<span class="trait-chip">${t.n} · ${t.d}</span>`).join('')
                          : '<span class="muted small">暂无词条</span>'}
      </div>
    </div>`);
}

function renameSlime(id){
  const s = getSlime(id); if(!s) return;
  const v = prompt('给这只史莱姆起个名字：', s.name);
  if(v && v.trim()){ s.name = v.trim().slice(0,10); save(); openDetail(id); renderTab(); }
}

function startBallGame(s){
  if(ballGame||!canWrite()||hasExplorePlan(s)||!LivingWorld.reserve(S,[s.id],'play')) return;
  const overlay = document.createElement('div');
  overlay.id = 'gameOverlay';
  overlay.innerHTML = `
    <div class="game-hud">
      <span>⚽ 接住 <b id="gCatch">0</b> 次</span>
      <span>⏱ <b id="gTime">30</b>s</span>
      <button class="hud-close" id="gClose">退出</button>
    </div>
    <div class="game-field" id="gameField">
      ${Array.from({length:14}).map(()=>`<div class="bg-star" style="left:${rnd(2,98)}%;top:${rnd(2,98)}%;"></div>`).join('')}
      <div class="catch-zone"></div>
      <div class="catch-line"></div>
      <div class="out-line"></div>
      <div class="game-slime" id="gameSlime">${slimeHTML(s,{mood:'idle'})}</div>
      <div class="game-ball" id="gameBall"></div>
    </div>
  `;
  $('#app').appendChild(overlay);
  const field = overlay.querySelector('#gameField');
  const slimeEl = overlay.querySelector('#gameSlime');
  const ballEl = overlay.querySelector('#gameBall');
  const G = {
    slime: s, catches: 0, timeLeft: 30, running: true,
    field, slimeEl, ballEl,
    slimeX: 50, ballX: 50, ballY: 75,
    ballState: 'ready', animId: null, timers: []
  };
  ballGame = G;
  slimeEl.style.left = '50%';
  slimeEl.style.top = '30%';
  function placeBall(x, y){
    G.ballX = x; G.ballY = y;
    ballEl.style.left = x + '%';
    ballEl.style.top = y + '%';
  }
  function showBall(v){ ballEl.classList.toggle('hidden', !v); }
  placeBall(50, 75);
  showBall(true);
  const slimeTimer = setInterval(()=>{
    if(!G.running) return;
    if(G.ballState === 'toSlime') return;
    G.slimeX = clamp(G.slimeX + rnd(-18,18), 18, 82);
    slimeEl.style.left = G.slimeX + '%';
    slimeEl.dataset.mood = Math.random()<0.5 ? 'jump' : 'crawl';
    setTimeout(()=>{ if(slimeEl && G.running) slimeEl.dataset.mood = 'idle'; }, 900);
  }, 1300);
  G.timers.push(slimeTimer);
  const clock = setInterval(()=>{
    if(!G.running) return;
    G.timeLeft--;
    overlay.querySelector('#gTime').textContent = Math.max(0, G.timeLeft);
    if(G.timeLeft <= 0) endGame();
  }, 1000);
  G.timers.push(clock);
  field.addEventListener('pointerdown', ev=>{
    if(!G.running) return;
    if(G.ballState !== 'ready' && G.ballState !== 'toPlayer') return;
    const rect = field.getBoundingClientRect();
    const bx = rect.left + (G.ballX/100)*rect.width;
    const by = rect.top + (G.ballY/100)*rect.height;
    const dx = ev.clientX - bx;
    const dy = ev.clientY - by;
    if(Math.sqrt(dx*dx + dy*dy) > 50) return;
    if(G.ballState === 'ready'){
      G.ballState = 'toSlime';
      flyToSlime();
    } else {
      G.catches++;
      overlay.querySelector('#gCatch').textContent = G.catches;
      G.ballState = 'toSlime';
      flyToSlime();
    }
  });
  function flyToSlime(){
    const startX = G.ballX, startY = G.ballY;
    const targetX = G.slimeX, targetY = 30;
    const dur = 420;
    const t0 = performance.now();
    function step(now){
      if(!G.running) return;
      const p = Math.min(1, (now - t0)/dur);
      const x = startX + (targetX-startX)*p;
      const y = startY + (targetY-startY)*p;
      placeBall(x,y);
      if(p < 1){
        G.animId = requestAnimationFrame(step);
      } else {
        slimeEl.dataset.mood = 'happy';
        setTimeout(()=>{ if(slimeEl && G.running) slimeEl.dataset.mood = 'idle'; }, 700);
        G.ballState = 'toPlayer';
        fallDown();
      }
    }
    G.animId = requestAnimationFrame(step);
  }
  function fallDown(){
    const base = 23 + G.catches * 0.015;
    const variation = rnd(0.8, 1.25);
    const speedY = clamp(base * variation, 15, 40);
    const drift = rnd(-7, 7);
    let lastNow = performance.now();
    function step(now){
      if(!G.running) return;
      const dt = Math.min(0.05, (now - lastNow)/1000);
      lastNow = now;
      G.ballY += speedY * dt;
      G.ballX = clamp(G.ballX + drift * dt, 6, 94);
      placeBall(G.ballX, G.ballY);
      if(G.ballY >= 83.33){
        G.ballState = 'gone';
        showBall(false);
        setTimeout(()=>{
          if(!G.running) return;
          placeBall(50, 75);
          showBall(true);
          G.ballState = 'ready';
        }, 420);
        return;
      }
      G.animId = requestAnimationFrame(step);
    }
    G.animId = requestAnimationFrame(step);
  }
  function endGame(){
    LivingWorld.release(S,'play');
    if(!G.running) return;
    G.running = false;
    G.timers.forEach(t=>clearInterval(t));
    if(G.animId) cancelAnimationFrame(G.animId);
    const catches = G.catches;
    const moodGain = catches * 3;
    const intimacyGain = Math.floor(catches / 10);
    s.mood = clamp(s.mood + moodGain, 0, 100);
    s.intimacy = (s.intimacy||0) + intimacyGain;
    save();
    overlay.remove();
    ballGame = null;
    if(activeTab === 'space'||activeTab==='home') renderTab();
    if(catches > 0){
      toast(`⚽ 游戏结束！\n接住 ${catches} 次\n心情 +${moodGain}　亲密度 +${intimacyGain}`, 'good');
    } else {
      toast(`⚽ 游戏结束！\n这次没有接住皮球……\n下次加油～`);
    }
  }
  overlay.querySelector('#gClose').addEventListener('click', endGame);
}

function startStackGame(){
  if(stackGame) return;
  const idleSlimes = S.slimes.filter(s=>!hasExplorePlan(s)&&!LivingWorld.isBusy(S,s.id));
  if(idleSlimes.length < 1){
    toast('空间中没有自由活动的史莱姆，无法进行游戏');
    return;
  }
  if(!canWrite()||!LivingWorld.reserve(S,idleSlimes.map(s=>s.id),'play'))return;
  const overlay = document.createElement('div');
  overlay.id = 'gameOverlay';
  const recordNow = S.stackRecord || 0;
  overlay.innerHTML = `
    <div class="game-hud">
      <span>🧱 最高纪录 <b id="gRecord">${recordNow}</b></span>
      <span style="font-size:11px;color:var(--muted);">点击屏幕让史莱姆落下</span>
      <button class="hud-close" id="gClose">退出</button>
    </div>
    <div class="game-field" id="gameField" style="overflow:hidden;">
      <div id="gCount" style="position:absolute;left:50%;top:14.28%;transform:translate(-50%,-50%);
        font-size:52px;font-weight:900;line-height:1;color:var(--text);opacity:.85;
        pointer-events:none;z-index:60;text-shadow:0 2px 14px rgba(0,0,0,.45);">0</div>
      ${Array.from({length:14}).map(()=>`<div class="bg-star" style="left:${rnd(2,98)}%;top:${rnd(2,98)}%;"></div>`).join('')}
    </div>
  `;
  $('#app').appendChild(overlay);
  const field = overlay.querySelector('#gameField');
  requestAnimationFrame(()=>{
    const W = field.clientWidth;
    const H = field.clientHeight;
    if(!W || !H){ setTimeout(()=>{ overlay.remove(); stackGame=null; }, 100); return; }
    const pool = idleSlimes;
    let usedIndex = 0;
    let activeEl = null;
    let activeObj = null;
    let activeX = 15;
    let activeDir = 1;
    let state = 'moving';
    let dropY = 0;
    const dropSpeed = H * 0.9;
    const stack = [];
    let lastT = 0;
    const G = { running: true };
    stackGame = G;
    const countEl = overlay.querySelector('#gCount');
    function getSize(s){
      const sz = clamp(s.size || 1, 0.6, 1.6);
      const w = 56 * sz;
      const h = w * 118 / 140;
      return {w, h};
    }
    function buildSlimeEl(s){
      const {w, h} = getSize(s);
      const el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.pointerEvents = 'none';
      const inner = document.createElement('div');
      inner.style.position = 'absolute';
      inner.style.left = '50%';
      inner.style.bottom = '0';
      inner.style.transformOrigin = '50% 100%';
      inner.style.transform = `translateX(-50%) scale(${w/140})`;
      inner.innerHTML = slimeHTML(s, {mood:'idle'});
      el.appendChild(inner);
      return {el, w, h};
    }
    function spawnActive(){
      if(!G.running) return;
      const s = pool[usedIndex % pool.length];
      const {el, w, h} = buildSlimeEl(s);
      const lastTop = stack.length ? stack[stack.length - 1].topY : (H * 0.2 - h/2);
      let topY = Math.min(H * 0.2 - h/2, lastTop - h * 1.5);
      topY = Math.max(-h * 1.2, topY);
      el.style.top = topY + 'px';
      activeEl = el;
      activeObj = {slime: s, w, h};
      updateActiveLeft();
      field.appendChild(el);
    }
    function updateActiveLeft(){
      if(!activeEl || !activeObj) return;
      const x = W * activeX / 100 - activeObj.w / 2;
      activeEl.style.left = x + 'px';
    }
    function trimOutOfScreen(){
      stack.forEach(it=>{
        if(it.el && it.topY + it.h < 0){
          it.el.remove();
          it.el = null;
        }
      });
    }
    function placeCurrent(){
      const item = {
        slime: activeObj.slime, w: activeObj.w, h: activeObj.h,
        centerX: activeX, topY: dropY, el: activeEl
      };
      stack.push(item);
      usedIndex++;
      countEl.textContent = stack.length;
      if(stack.length > (S.stackRecord||0)){
        S.stackRecord = stack.length;
        overlay.querySelector('#gRecord').textContent = S.stackRecord;
      }
      const fx = document.createElement('div');
      fx.style.position = 'absolute';
      fx.style.left = (activeX + '%');
      fx.style.top = dropY + 'px';
      fx.style.transform = 'translate(-50%,-100%)';
      fx.style.fontSize = '18px';
      fx.style.color = '#4ade80';
      fx.style.fontWeight = '800';
      fx.style.pointerEvents = 'none';
      fx.style.zIndex = 50;
      fx.textContent = '✓';
      field.appendChild(fx);
      setTimeout(()=>fx.remove(), 600);
      activeEl.style.zIndex = 10 + stack.length;
      activeEl = null;
      activeObj = null;
      const last = stack[stack.length - 1];
      const limitY = H * 0.55;
      if(last.topY < limitY){
        const shift = limitY - last.topY;
        stack.forEach(it=>{
          it.topY += shift;
          if(it.el){
            it.el.style.transition = 'top .18s ease';
            it.el.style.top = it.topY + 'px';
            setTimeout(()=>{ if(it.el) it.el.style.transition = ''; }, 200);
          }
        });
      }
      trimOutOfScreen();
      setTimeout(()=>{
        if(!G.running) return;
        spawnActive();
        state = 'moving';
      }, 280);
    }
    function loop(t){
      if(!G.running) return;
      if(!lastT) lastT = t;
      const dt = Math.min(0.05, (t - lastT)/1000);
      lastT = t;
      if(state === 'moving' && activeEl){
        activeX += activeDir * 32 * dt;
        if(activeX > 90){ activeX = 90; activeDir = -1; }
        if(activeX < 10){ activeX = 10; activeDir = 1; }
        updateActiveLeft();
      } else if(state === 'dropping' && activeEl){
        dropY += dropSpeed * dt;
        activeEl.style.top = dropY + 'px';
        const bottomY = dropY + activeObj.h;
        const prev = stack[stack.length - 1];
        if(!prev){
          if(bottomY >= H){
            dropY = H - activeObj.h;
            activeEl.style.top = dropY + 'px';
            placeCurrent();
          }
        } else {
          if(bottomY >= prev.topY){
            const dxPx = Math.abs(W * (activeX - prev.centerX) / 100);
            const limit = prev.w / 4;
            if(dxPx <= limit){
              const overlap = Math.min(4, Math.round(activeObj.h * 0.08));
              dropY = prev.topY - activeObj.h + overlap;
              activeEl.style.top = dropY + 'px';
              placeCurrent();
            } else {
              if(dropY > H){ endGame(); return; }
            }
          } else if(dropY > H){ endGame(); return; }
        }
      }
      requestAnimationFrame(loop);
    }
    field.addEventListener('click', ()=>{
      if(!G.running) return;
      if(state === 'moving' && activeEl){
        state = 'dropping';
        dropY = parseFloat(activeEl.style.top) || (H*0.2 - activeObj.h/2);
      }
    });
    function endGame(){
    LivingWorld.release(S,'play');
      if(!G.running) return;
      G.running = false;
      const n = stack.length;
      const isNewRecord = n > recordNow;
      const gains = {};
      stack.forEach(item=>{
        const id = item.slime.id;
        gains[id] = (gains[id]||0) + 1;
      });
      Object.keys(gains).forEach(id=>{
        const slime = S.slimes.find(x=>x.id === +id);
        if(slime){
          slime.mood = clamp(slime.mood + gains[id] * 5, 0, 100);
          slime.intimacy = (slime.intimacy||0) + gains[id];
        }
      });
      save();
      overlay.remove();
      stackGame = null;
      if(activeTab === 'space'||activeTab==='home') renderTab();
      if(n > 0){
        if(isNewRecord){
          toast(`🧱 叠叠乐结束！\n成功叠放 ${n} 只史莱姆\n🎉 新纪录！最高 ${n} 只`, 'good');
        } else {
          toast(`🧱 叠叠乐结束！\n成功叠放 ${n} 只史莱姆\n历史最高 ${recordNow} 只\n史莱姆们的心情和亲密度提升了`, 'good');
        }
      } else {
        toast(`🧱 叠叠乐结束！\n没有叠放成功……\n下次加油～`);
      }
    }
    overlay.querySelector('#gClose').addEventListener('click', endGame);
    spawnActive();
    requestAnimationFrame(loop);
  });
}

/* ==================== 战斗特效门面 FX ==================== */
/* 只做 DOM 演出，不参与战斗结算；战斗侧只管调用 */

const FX = {
  field: null, log: [], _txt: 0, _part: 0,
  _merge: null, _shakeRank: 0, _shakeKind: '', _shakeRaf: 0,

  /* 记录演出容器（.battle-field） */
  bindField(el){
    this.field = el || null;
    return this.field;
  },
  /* 高速档压缩演出时长 */
  _ts(){
    const sp = (typeof battleSpeed === 'number' && battleSpeed > 0) ? battleSpeed : 1;
    return 1 / Math.max(1, Math.min(2, sp / 2));
  },
  _host(){
    return this.field || document.querySelector('.battle-field') || document.body;
  },
  _record(type, text, cls, kind){
    this.log.push({ t: performance.now(), type, kind: kind || '', text: String(text == null ? '' : text), cls: cls || '' });
    if(this.log.length > 200) this.log.shift();
  },

  /* 震屏：一帧内多次调用只保留最强档 */
  shake(kind){
    const rank = kind === 'crit' ? 2 : (kind === 'kill' ? 3 : 1);
    const k = kind === 'crit' ? 'crit' : (kind === 'kill' ? 'kill' : 'light');
    if(rank > this._shakeRank){ this._shakeRank = rank; this._shakeKind = k; }
    if(this._shakeRaf) return;
    this._shakeRaf = requestAnimationFrame(()=>{
      this._shakeRaf = 0;
      const key = this._shakeKind || 'light';
      this._shakeRank = 0; this._shakeKind = '';
      const el = this._host();
      if(!el || el === document.body) return;
      el.classList.remove('field-shake');
      void el.offsetWidth;
      el.setAttribute('data-k', key);
      el.classList.add('field-shake');
      this._record('shake', key, '', 'shake');
      setTimeout(()=>el.classList.remove('field-shake'), 220);
    });
  },

  /* 命中闪白：打在 .breath 上，暴击额外放大描边 */
  flash(el, isCrit){
    if(!el) return;
    const tb = (el.querySelector && el.querySelector('.breath')) || el;
    if(!tb || !tb.classList) return;
    tb.classList.remove('hit-flash', 'crit');
    void tb.offsetWidth;
    tb.classList.add('hit-flash');
    if(isCrit) tb.classList.add('crit');
    setTimeout(()=>tb.classList.remove('hit-flash', 'crit'), isCrit ? 280 : 200);
  },

  /* 飘字：同目标 250ms 内同 cls 的纯数字合并累加 */
  float(el, text, opt){
    const o = opt || {};
    if(!el) return null;
    const field = this._host();
    const cls = o.cls || '';
    const icon = o.icon || '';
    const raw = String(text == null ? '' : text);
    const mm = /^(-?\d+)(.*)$/.exec(raw);
    const num = mm ? parseInt(mm[1], 10) : null;
    const suffix = mm ? mm[2] : '';
    const now = performance.now();
    const m = this._merge;
    if(num !== null && m && m.suffix === suffix && m.el === el && m.cls === cls && (now - m.t) < 250 && m.node && m.node.isConnected){
      m.sum += num;
      m.t = now;
      m.count++;
      m.node.textContent = icon + m.sum + suffix;
      this._record('float', icon + m.sum + suffix, cls, 'merge');
      return m.node;
    }
    const node = document.createElement('div');
    node.className = 'fx-float' + (cls ? ' ' + cls : '');
    node.textContent = icon + raw;
    const fr = field.getBoundingClientRect();
    const tr = (el.querySelector ? (el.querySelector('.slime') || el) : el).getBoundingClientRect();
    /* 越界保护：贴近场地顶部时改为从单位下方冒字，保证 24px 上升后仍在场地内 */
    let ty = tr.top - fr.top + 2;
    if(ty < 28) ty = tr.top - fr.top + tr.height + 2;
    /* 同目标连续飘字向上错开 14px（规格 §4.3）：数一下 600ms 内还挂在这个目标身上的飘字 */
    let stack = 0;
    const alive = field.querySelectorAll('.fx-float');
    for(let i = 0; i < alive.length; i++){
      const n = alive[i];
      if(n._owner === el && (now - (n._born || 0)) < 600) stack++;
    }
    const off = Math.min(stack, 3) * 14;
    if(ty - off >= 2) ty -= off;
    else ty = ty + off; /* 顶部放不下就往下错，两个方向都保证仍在场地内 */
    ty = Math.max(2, Math.min(Math.max(2, fr.height - 16), ty));
    node.style.left = (tr.left - fr.left + tr.width / 2) + 'px';
    node.style.top = ty + 'px';
    const dur = Math.round(850 * this._ts());
    node.style.animationDuration = dur + 'ms';
    field.appendChild(node);
    node._owner = el;
    node._born = now;
    setTimeout(()=>node.remove(), dur + 60);
    this._trimFloat(field);
    this._merge = { el, cls, t: now, node, sum: num === null ? 0 : num, suffix, count: 1 };
    this._record('float', icon + raw, cls, 'float');
    return node;
  },
  /* 同屏飘字上限 12 */
  _trimFloat(field){
    const list = field.querySelectorAll('.fx-float');
    for(let i = 0; i < list.length - 12; i++) list[i].remove();
    this._txt = field.querySelectorAll('.fx-float').length;
  },

  /* 击杀演出：本体缩灭 + 元素色爆散（count 由调用方决定：本体 12、迷你 6） */
  die(el, count){
    if(!el) return;
    const slime = (el.querySelector && el.querySelector('.slime')) || el;
    const st = slime.style || {};
    const g = n => (st.getPropertyValue ? String(st.getPropertyValue(n) || '').trim() : '');
    const h = g('--h') || '45';
    let s = g('--s') || '80%';
    let l = g('--l') || '60%';
    if(!s.includes('%')) s += '%';
    if(!l.includes('%')) l += '%';
    if(slime.classList) slime.classList.add('dying');
    this.shake('kill');
    this.burst(slime, 'hsl(' + h + ' ' + s + ' ' + l + ')', count || 12);
    this._record('die', 'dying', 'kill', 'die');
  },

  /* 元素色爆散粒子，同屏上限 60 */
  burst(el, color, count){
    if(!el) return;
    const field = this._host();
    const n = Math.max(1, Math.min(40, count || 10));
    const fr = field.getBoundingClientRect();
    const tr = (el.querySelector ? (el.querySelector('.slime') || el) : el).getBoundingClientRect();
    const cx = tr.left - fr.left + tr.width / 2;
    const cy = tr.top - fr.top + tr.height * 0.55;
    const dur = Math.round(620 * this._ts());
    for(let i = 0; i < n; i++){
      const p = document.createElement('i');
      p.className = 'fx-part';
      const ang = Math.PI * 2 * (i / n) + rnd(-0.25, 0.25);
      const dist = rnd(16, 44) * Math.max(0.6, tr.width / 60);
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = color || '#fff';
      p.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(ang) * dist - rnd(4, 18)) + 'px');
      p.style.setProperty('--sz', rnd(2, 5).toFixed(1) + 'px');
      p.style.animationDuration = dur + 'ms';
      field.appendChild(p);
      setTimeout(()=>p.remove(), dur + 60);
    }
    this._trimParts(field);
    this._record('burst', n + ' particles', '', 'burst');
  },
  _trimParts(field){
    const list = field.querySelectorAll('.fx-part');
    for(let i = 0; i < list.length - 60; i++) list[i].remove();
    this._part = field.querySelectorAll('.fx-part').length;
  }
};

const TRAINING_CHALLENGES = {
  shield:{name:'护盾时机', element:'岩', hp:320, str:35, mag:20, enemyHp:220, enemyElement:'火', hint:'首回合重击 320：先用「磐石落」撑起护盾，再反击。通关需实际挡住重击。'},
  control:{name:'打断重击', element:'幻', hp:300, str:45, mag:20, enemyHp:230, enemyElement:'火', hint:'首回合重击 400：用「魅惑」取消已预告的行动，利用两回合空档反击。'},
  cleanse:{name:'净化危机', element:'光', hp:300, str:25, mag:40, enemyHp:260, enemyElement:'岩', hint:'已有 3 层烧伤与 3 层中毒：先用「圣光」净化，再进攻。通关需真正移除负面。'}
};
function ensureProgress(){
  if(!S.progress || typeof S.progress !== 'object' || Array.isArray(S.progress)) S.progress = {};
  const p = S.progress;
  ['abyssClears','challengeClears','regions','collected','claimed'].forEach(k=>{
    if(!p[k] || typeof p[k] !== 'object' || Array.isArray(p[k])) p[k] = {};
  });
  S.slimes.concat(S.monsters || []).forEach(s=>{ if(ELEMENTS[s.element]) p.collected[s.element] = true; });
  return p;
}
function recordRegionExplore(index){
  const map = MAP_THEMES[index] || MAP_THEMES[0];
  const p = ensureProgress();
  p.regions[map.id] = Math.max(0, Number(p.regions[map.id]) || 0) + 1;
}
function progressionGoals(){
  const p = ensureProgress();
  const goals = [{id:'abyss-first',name:'第一次深渊胜利',now:Object.keys(p.abyssClears).length ? 1 : 0,need:1,coins:400,points:5}];
  Object.keys(TRAINING_CHALLENGES).forEach(id=>goals.push({id:'training-'+id,name:'教学 · '+TRAINING_CHALLENGES[id].name,now:p.challengeClears[id] ? 1 : 0,need:1,coins:300,points:5}));
  goals.push({id:'regions',name:'踏遍三片土地（各完成 3 次派遣）',now:MAP_THEMES.filter(m=>(p.regions[m.id]||0)>=3).length,need:MAP_THEMES.length,coins:600,treasure:2});
  goals.push({id:'collection-six',name:'结识 6 种元素伙伴',now:Object.keys(p.collected).filter(k=>ELEMENTS[k] && p.collected[k]).length,need:6,coins:800,points:10});
  return goals.map(g=>Object.assign(g,{claimed:!!p.claimed[g.id],ready:g.now>=g.need}));
}
function claimProgressGoal(id){
  const g = progressionGoals().find(x=>x.id===id);
  if(!g || !g.ready || g.claimed) return false;
  ensureProgress().claimed[id] = true;
  S.coins += g.coins || 0;
  S.totalEarned += g.coins || 0;
  S.points += g.points || 0;
  S.bag.treasure = (S.bag.treasure || 0) + (g.treasure || 0);
  save(); renderTop(); renderTab();
  toast('目标奖励已领取：'+g.name, 'good');
  return true;
}

}
function challengeCards(){
  const p = ensureProgress();
  return `<div class="panel"><h3>战斗课堂 · 固定挑战</h3><p class="muted small">借用伙伴，零消耗。默认逐回合；首次达标后在旅途目标领取奖励，重复训练无收益。</p>${Object.keys(TRAINING_CHALLENGES).map(id=>{const c=TRAINING_CHALLENGES[id];return `<div class="task-row"><div><div class="task-name">${esc(c.name)}${p.challengeClears[id]?' · 已掌握':''}</div><p class="muted small">${esc(c.hint)}</p></div><button class="btn sm themed" data-act="challengeStart" data-id="${id}">练习</button></div>`;}).join('')}</div>`;
}
function recordBattleProgress(B, win){
  const p = ensureProgress();
  if(B.training){
    const used = B.practiceUsed && B.practiceUsed[B.challengeId];
    if(win && used){ p.challengeClears[B.challengeId] = true; B.progressResult = '教学达标！首次奖励可在旅途目标领取。'; }
    else B.progressResult = win ? '战斗获胜，但尚未完成本课机制；可免费再试。' : '免费练习结束；根据预告调整行动后再试。';
  } else if(win){
    p.abyssClears[String(B.mLevel || 1)] = true;
    B.progressResult = '胜利已记入旅途目标。';
  } else B.progressResult = '';
  return B.progressResult;
}

}

function enemyIntentText(unit){
  if(!unit || unit.hp<=0) return '已倒下';
  const q = unit.intent;
  if(!q) return '正在观察';
  if(q.state==='canceled') return '已取消 · '+q.name;
  if(q.state==='done') return '已行动 · '+q.name;
  const controlled = unit.st && (unit.st.frozen>0 || unit.st.paralysis>0 || unit.st.charm>0);
  const suffix = q.targetName ? ' → '+q.targetName : '';
  const power = q.power ? ' '+q.power : q.mult>1 ? ' '+q.mult+'×' : '';
  return (controlled?'受控待取消 · ':'预告 · ')+q.name+power+suffix;
}

/* Pure reward calculation: snapshot before post-battle healing. */
function calculateBattleRewards(battle,win,level){
  const enemies=battle.rewardMonsters || battle.monsters || [], participants=battle.allies || [];
  const defeated=enemies.filter(m=>m.hp<=0);
  const survivors=participants.filter(a=>a.hp>0);
  const recipients=survivors.length ? survivors.slice() : participants.slice();
  if(battle.training) return {totalExp:0,coinGain:0,defeatedCount:defeated.length,recipients:[],survivorCount:survivors.length};
  const mLevel=clamp(Math.floor(Number(level || battle.mLevel)||1),1,50);
  const levelMul=1+(mLevel-1)*0.25;
  const base=(win ? enemies : defeated).reduce((sum,m)=>sum+Math.round((30+(Number(m.ref.level)||1)*10)*levelMul),0);
  const totalExp=win ? base : Math.floor(base*0.25);
  return {totalExp,coinGain:Math.round(totalExp*2.5),defeatedCount:defeated.length,recipients,survivorCount:survivors.length};
}

function toggleAbyssSel(id){
  const idx = abyssSetupSel.indexOf(id);
  if(idx>=0) abyssSetupSel.splice(idx,1);
  else {
    if(abyssSetupSel.length >= 5) return;
    abyssSetupSel.push(id);
  }
  document.querySelectorAll('.merge-list .minicard').forEach(c=>{
    c.classList.toggle('on', abyssSetupSel.includes(+c.dataset.id));
  });
  const btn = document.querySelector('[data-act="abyssStart"]');
  if(btn) btn.disabled = abyssSetupSel.length === 0;

function startAbyssBattle(options){
  options = options || {};
  if(!canWrite()||document.getElementById('gameOverlay')) return;
  const challenge = TRAINING_CHALLENGES[options.challengeId] || null;
  if(!challenge && !abyssSetupSel.length) return;
  const allies = challenge ? [makeTrainingSlime(-1001, '借用·'+challenge.element+'伙伴', challenge.element, challenge.hp, challenge.str, challenge.mag, false)] : abyssSetupSel.map(id=>getSlime(id)).filter(Boolean).filter(s=>!isDispatched(s)&&!LivingWorld.isBusy(S,s.id));
  if(!allies.length){ toast('出战的史莱姆都在探险中，请先召回'); return; }
  if(!challenge&&!LivingWorld.reserve(S,allies.map(s=>s.id),'battle'))return;
  battleSpeed = clamp(Number(S.battleSpeed)||1, 1, 10);
  const monCount = challenge ? 0 : rndInt(2, 4);
  const monsters = challenge ? [makeTrainingSlime(-2001, '练习·'+challenge.name, challenge.enemyElement, challenge.enemyHp, 25, 15, true)] : [];
  const mLevel = challenge ? 1 : getAbyssLevel();
  for(let i=0;i<monCount;i++){
    const m = createSlime(true);
    m.isMonster = true;
    m.level = mLevel;
    m.str = m.strPotential * mLevel;
    m.agi = m.agiPotential * mLevel;
    m.mag = m.magPotential * mLevel;
    m.size = +(m.size + (mLevel-1)*0.0016).toFixed(3);
    m.hp = hpMax(m);
    m.name = `${m.element}魔物${m.id}`;
    monsters.push(m);
  }

  const overlay = document.createElement('div');
  overlay.id = 'gameOverlay';

  const enemyHTML = monsters.map((m)=>`
    <div class="battle-unit" data-mon-id="${m.id}" data-side="enemy">
      <div class="slime-wrap">
        <div class="hpbar"><i style="width:100%"></i><i class="ghost"></i></div>
        ${slimeHTML(m,{mood:'idle', traitBadge: m.traits.length > 0})}
      </div>
      <div class="uname">${esc(m.name)} Lv.${m.level}</div>
    </div>`).join('');
  const allyHTML = allies.map(a=>`
    <div class="battle-unit" data-ally-id="${a.id}" data-side="ally">
      <div class="slime-wrap">
        <div class="hpbar"><i style="width:100%"></i><i class="ghost"></i></div>
        ${slimeHTML(a,{mood:'idle'})}
      </div>
      <div class="uname">${esc(a.name)}</div>
    </div>`).join('');

  const speeds = [1,2,3,5,10];
  overlay.innerHTML = `
    <div class="game-hud">
      <span class="hud-title">${uiIcon('sword')} 深渊对战</span>
      <div class="hud-speeds">
        ${speeds.map(sp=>`<button class="speed-btn ${battleSpeed===sp?'on':''}" data-speed="${sp}">${sp}x</button>`).join('')}
        <button class="speed-btn" id="bMode">自动</button>
      </div>
      <button class="hud-close" id="bClose">撤退</button>
    </div>
    <div class="battle-field">
      ${Array.from({length:30}).map(()=>`<div class="bg-star" style="left:${rnd(2,98)}%;top:${rnd(2,98)}%;"></div>`).join('')}
      <div class="battle-row enemy">${enemyHTML}</div>
      <div class="battle-log" id="battleLog">战斗开始！</div>
      <div class="battle-row ally">${allyHTML}</div>
      <div class="skill-bar hide" id="skillBar"></div>
    </div>
  `;
  $('#app').appendChild(overlay);

  const logEl = overlay.querySelector('#battleLog');
  const fieldEl = overlay.querySelector('.battle-field');
  FX.bindField(fieldEl);

  function initBattleUnit(ref){
    const st = {
      burn:0, poison:0, frostbite:0, frozen:0, freezeVisual:false,
      paralysis:0, charm:0, weakness:0, intangible:0,
      rockArmor:0, iceArmor:0, timeRevive:false, reviveUsed:false,
      immuneDebuff:false, miniSlime:null
    };
    if(ref.element === '岩' && !ref.isTraining){ st.immuneDebuff = true; st.rockArmor = Math.round(hpMax(ref)*0.5); }
    if(ref.element === '冰'){ st.iceArmor = Math.round(hpMax(ref)*0.5); }
    if(ref.element === '时间'){ st.timeRevive = true; }
    return {ref, hp:ref.hp, maxHp:ref.trainingHp || hpMax(ref), st, minis:[], cd:{}, acted:false, intent:null};
  }

  const B = {
    running:true, ended:false,
    allies: allies.map(initBattleUnit),
    monsters: monsters.map(initBattleUnit),
    turn:0, timer:null, pendingTimers:[],
    paused:false, pauseTimer:null, _pauseResume:null,
    atkBuff: 1, mLevel, training:!!challenge, trainingMode:'step', challengeId:options.challengeId || null, practiceUsed:{}, resolving:false
  };
  B.rewardMonsters = B.monsters.slice();
  function currentBattleMode(){ return B.training ? B.trainingMode : S.battleMode; }
  if(challenge && options.challengeId==='cleanse'){ B.allies[0].st.burn=3; B.allies[0].st.poison=3; }
  if(challenge){
    const title = overlay.querySelector('.hud-title');
    if(title) title.textContent = '战斗课堂 · '+challenge.name;
  }

  /* 自检钩子：?selftest=1 时把本局战斗暴露给 __TEST__，正常游玩不会触发 */
  if(window.__TEST__) window.__TEST__._battle = {
    B, overlay, fieldEl, logEl, later, performAction, performMiniAction,
    getUnitEl, refreshBars, dealDamage, handleUnitDeath, nextTurn,
    playerCast, playerBasic, renderSkillBar, castStrike,
    waitForPlayer, closeBattle, enemyPhase, endBattle, queueEnemyIntents, refreshIntentPanel, turnControl,
    setDodgeRate: fn => { dodgeRate = fn; },
    setCritRate: fn => { critRate = fn; },
    restoreRates: () => { dodgeRate = _rateOrig.dodgeRate; critRate = _rateOrig.critRate; }
  };
  const _rateOrig = { dodgeRate, critRate };

  /* ==================== 手动行动：技能条与施法 ==================== */
  const MODES = ['auto', 'interject', 'step'];
  const MODE_LABEL = { auto:'自动', interject:'插话', step:'逐回合' };
  let afterPlayerAction = null;   /* 逐回合模式接管后续推进（任务 9） */
  let skSel = null;               /* 当前选中的己方单位 */
  let skPick = null;              /* 'basic' | 'skill'：等待选目标 */

  function sideOfUnit(u){
    if(u.isMini) return u.side;
    return B.monsters.indexOf(u) >= 0 ? 'enemy' : 'ally';
  }
  function manualMode(){
    return currentBattleMode() === 'interject' || currentBattleMode() === 'step';
  }
  function lowestAllyUnit(){
    const alive = getAllAliveUnits('ally').filter(u=>u.hp > 0);
    if(!alive.length) return null;
    return alive.reduce((a,b)=> (b.hp/b.maxHp < a.hp/a.maxHp ? b : a));
  }

  /* 手动伤害：与自动战斗同口径（闪避→基础伤害→属性倍率→暴击→护甲） */
  function castStrike(attackerUnit, target, mult, opt){
    opt = opt || {};
    const ref = attackerUnit.ref;
    const atkEl = getUnitEl(attackerUnit, sideOfUnit(attackerUnit));
    const tSide = sideOfUnit(target);
    const tgtEl = getUnitEl(target, tSide);
    if(tgtEl && atkEl) doElementBallEffect(ref, atkEl, tgtEl, opt.name && opt.name!=='普攻');

    const dodge = B.training || target.isMini ? 0 : dodgeRate(target.ref);
    if(Math.random()*100 < dodge){
      FX.float(tgtEl, 'MISS', { cls:'miss' });
      log(`${target.ref.name} 闪避了 ${ref.name} 的${opt.name || '攻击'}`);
      return 0;
    }

    let baseDmg = physAtk(ref) + (B.training ? 0 : rndInt(-3,3));
    baseDmg = Math.round(baseDmg * (B.atkBuff||1));
    if(attackerUnit.st.weakness > 0) baseDmg = Math.round(baseDmg * (1 - attackerUnit.st.weakness*0.05));

    let elemMult = 1;
    if(ELEMENT_CHART[ref.element] && ELEMENT_CHART[ref.element][target.ref.element]) {
      elemMult = ELEMENT_CHART[ref.element][target.ref.element];
    }
    let dmg = Math.round(baseDmg * elemMult * (mult || 1));
    if(ref.element === '光' && target.ref.isMonster) dmg *= 2;

    const critBonus = target.st.frostbite * 5;
    const crit = !B.training && Math.random() < (critRate(ref)+critBonus)/100;
    if(crit) dmg = Math.round(dmg * 1.8);
    dmg = Math.max(1, dmg);

    if(!opt.noElement && !B.training) applyAttackerElement(attackerUnit, target);

    /* 冰甲反伤：与自动路径一致，攻击带冰甲的冰属性目标会被冻伤 */
    if(target.ref.element === '冰' && target.st.iceArmor > 0){
      if(applyStatus(attackerUnit, 'frostbite', 1))
        setTimeout(()=>log(`❄ ${ref.name} 被冰甲冻伤！`), 120);
    }

    const shield0 = shieldOf(target);
    const actual = dealDamage(target, dmg);
    if(tgtEl){
      FX.flash(tgtEl, crit);
      if(crit) FX.shake('crit');
      if(actual === 0){
        FX.float(tgtEl, '护盾', { cls:'small' });
      } else {
        const tag = elemMult > 1.2 ? ' 克制' : '';
        FX.float(tgtEl, '-' + actual + (crit ? '!' : '') + tag,
          { cls: crit ? 'crit' : (elemMult < 0.85 ? 'weak' : (elemMult > 1.2 ? 'strong' : '')) });
      }
    }
    const elemMsg = elemMult > 1 ? '（克制！）' : (elemMult < 1 ? '（微弱）' : '');
    log(damageLogText(target, shield0, actual,
      `${ref.name} 的${opt.name || '攻击'}命中 ${target.ref.name}`, `${crit?'（暴击！）':''}${elemMsg}`));
    /* 与自动战斗对齐的属性后续效果：雷对水溅射 / 草吸血 / 命中水史莱姆召出迷你 */
    if(ref.element === '雷' && actual > 0) doSplash(attackerUnit, target, actual);
    if(ref.element === '草' && actual > 0){
      const heal = Math.round(actual * 0.5);
      attackerUnit.hp = Math.min(attackerUnit.maxHp, attackerUnit.hp + heal);
      FX.float(atkEl, '+' + heal, { cls:'good small' });
      if(tgtEl && atkEl){
        const cc = slimeColor(ref);
        const colGrass = `hsl(${cc.h} ${Math.max(cc.s,40).toFixed(1)}% ${Math.max(cc.l,55).toFixed(1)}%)`;
        later(()=>{ doDrainEffect(tgtEl, atkEl, colGrass); }, Math.round(520 / battleSpeed));
      }
    }
    if(!target.isMini && target.ref.element === '水' && target.hp > 0){
      const mini = spawnMiniSlime(target, tSide);
      if(mini) miniSlimeAttack(mini);
    }
    refreshBars();
    if(target.hp <= 0) handleUnitDeath(target, tSide);
    return actual;
  }

  function doSplash(attackerUnit, target, actual){
    if(!(actual > 0) || target.ref.element !== '水') return;
    const splash = Math.max(1, Math.round(actual * 0.2));
    let hitCount = 0;
    [B.allies, B.monsters].forEach(team=>{
      const s = team === B.allies ? 'ally' : 'enemy';
      team.forEach(u=>{
        const list = [{u, side:s}];
        (u.minis||[]).forEach(m=>{ if(m.hp > 0) list.push({u:m, side:s}); });
        list.forEach(w=>{
          if(w.u === target || w.u.hp <= 0) return;
          if(w.u.ref.element !== '水') return;
          dealDamage(w.u, splash);
          FX.float(getUnitEl(w.u, w.side), '-' + splash, { cls:'small' });
          hitCount++;
          if(w.u.hp <= 0) handleUnitDeath(w.u, w.side);
        });
      });
    });
    if(hitCount){
      log(`⚡ 电流顺着水流扩散，其他水史莱姆受到 ${splash} 点溅射伤害`);
      refreshBars();
    }
  }

  function playerBasic(attackerUnit, targetUnit){
    if(!canWrite())return false;
    const ref = attackerUnit.ref;
    if(!attackerUnit || attackerUnit.hp <= 0) return false;
    if(attackerUnit.acted){ log(`${ref.name} 本回合已经行动过了`); renderSkillBar(); return false; }
    /* 冻结/麻痹/持续伤害/魅惑：手动行动也要先结算，否则玩家可以绕过控制 */
    if(turnControl(attackerUnit, 'ally')){ attackerUnit.acted = true; renderSkillBar(); return false; }
    const enemyMain = getAllAliveMain('enemy');
    const target = targetUnit || pick(getAllAliveUnits('enemy'));
    if(!target || target.hp <= 0){ log('没有可攻击的目标'); renderSkillBar(); return false; }
    if(isUntargetable(target, enemyMain)){
      log(`${target.ref.name} 虚化中，无法选中`);
      renderSkillBar();
      return false;
    }
    castStrike(attackerUnit, target, 1, { name:'普攻' });
    attackerUnit.acted = true;
    renderSkillBar();
    return true;
  }

  function playerCast(attackerUnit, targetUnit){
    if(!canWrite())return false;
    const ref = attackerUnit ? attackerUnit.ref : null;
    if(!ref) return false;
    const sk = skillOf(ref);
    if(!sk) return false;
    if(attackerUnit.hp <= 0) return false;
    if(attackerUnit.acted){ log(`${ref.name} 本回合已经行动过了`); renderSkillBar(); return false; }
    const cd = attackerUnit.cd[ref.element] || 0;
    if(cd > 0){ log(`${sk.name} 冷却中（还剩 ${cd} 回合）`); renderSkillBar(); return false; }
    /* 冻结/麻痹/持续伤害/魅惑：手动施法同样先结算 */
    if(turnControl(attackerUnit, 'ally')){ attackerUnit.acted = true; renderSkillBar(); return false; }

    const enemyMain = getAllAliveMain('enemy');
    let target = targetUnit || null;
    if(sk.target === 'enemy' && sk.kind !== 'revive'){
      if(!target || target.hp <= 0){ log('没有可攻击的目标'); renderSkillBar(); return false; }
      if(isUntargetable(target, enemyMain)){
        log(`${target.ref.name} 虚化中，无法选中`);
        renderSkillBar();
        return false;
      }
    }

    const el = ref.element;
    const unitEl = getUnitEl(attackerUnit, 'ally');

    if(el === '岩'){
      castStrike(attackerUnit, target, 1.6, { name: sk.name, noElement:true });
      const sh = Math.round(attackerUnit.maxHp * 0.3);
      attackerUnit.st.rockArmor = (attackerUnit.st.rockArmor || 0) + sh;
      log(`🪨 ${ref.name} 的${sk.name}落下，获得 ${sh} 点护盾`);
    } else if(el === '火'){
      castStrike(attackerUnit, target, 1.4, { name: sk.name, noElement:true });
      if(applyStatus(target, 'burn', 2)) log(`🔥 ${ref.name} 的${sk.name}点燃了 ${target.ref.name}（2 层烧伤）`);
    } else if(el === '水'){
      const lowest = lowestAllyUnit();
      if(lowest){
        const heal = Math.max(1, Math.round(magAtk(ref) * 1.2));
        lowest.hp = Math.min(lowest.maxHp, lowest.hp + heal);
        const lel = getUnitEl(lowest, sideOfUnit(lowest));
        if(lel && unitEl) doHealEffect(ref, unitEl, lel);
        FX.float(lel, '+' + heal, { cls:'good' });
        log(`💧 ${ref.name} 的${sk.name}治疗 ${lowest.ref.name} ${heal} 点`);
      }
      const mini = spawnMiniSlime(attackerUnit, 'ally');
      if(mini){ refreshMiniBars(); log('💧 涌泉召唤出一只迷你水史莱姆'); }
    } else if(el === '风'){
      const pool = getAllAliveUnits('enemy').filter(u=>u.hp > 0 && !isUntargetable(u, enemyMain));
      const hitList = [];
      let hits = 0;
      for(let i=0;i<2;i++){
        /* 两道风刃必须打不同目标（规格：2 个随机敌人） */
        const cand = pool.filter(u=>hitList.indexOf(u) < 0 && u.hp > 0);
        if(!cand.length) break;
        const t = pick(cand);
        hitList.push(t);
        castStrike(attackerUnit, t, 0.9, { name: sk.name });
        hits++;
      }
      if(hits === 2) log(`🌪 ${ref.name} 的${sk.name}斩出两道风刃`);
    } else if(el === '草'){
      /* 吸血已由 castStrike 统一处理（草属性命中回 50%） */
      castStrike(attackerUnit, target, 0.8, { name: sk.name, noElement:true });
      if(applyStatus(target, 'poison', 3)) log(`🌿 ${target.ref.name} 缠绕上 3 层中毒`);
    } else if(el === '冰'){
      castStrike(attackerUnit, target, 0.7, { name: sk.name, noElement:true });
      if(applyStatus(target, 'frostbite', 2)) log(`❄ ${target.ref.name} 被冻结 2 层`);
    } else if(el === '雷'){
      /* 溅射已由 castStrike 统一处理（任意雷命中水史莱姆都会触发） */
      castStrike(attackerUnit, target, 1.5, { name: sk.name, noElement:true });
    } else if(el === '光'){
      if(B.training && getAllAliveUnits('ally').some(u=>['burn','poison','frostbite','frozen','paralysis','charm','weakness'].some(k=>u.st[k]>0))) B.practiceUsed.cleanse=true;
      const heal = Math.max(1, Math.round(magAtk(ref) * 0.6));
      getAllAliveUnits('ally').forEach(u=>{
        if(u.hp <= 0) return;
        u.hp = Math.min(u.maxHp, u.hp + heal);
        FX.float(getUnitEl(u, sideOfUnit(u)), '+' + heal, { cls:'good small' });
        u.st.burn = u.st.poison = u.st.frostbite = 0;
        u.st.frozen = u.st.paralysis = u.st.charm = u.st.weakness = 0;
      });
      log(`✨ ${ref.name} 的${sk.name}治愈全队 ${heal} 点并净化负面状态`);
    } else if(el === '暗'){
      castStrike(attackerUnit, target, 0.9, { name: sk.name, noElement:true });
      if(applyStatus(target, 'weakness', 3)) log(`🌑 ${target.ref.name} 被削弱 3 层`);
    } else if(el === '幻'){
      castStrike(attackerUnit, target, 0.5, { name: sk.name, noElement:true });
      if(applyStatus(target, 'charm', 2)) log(`💗 ${target.ref.name} 被魅惑 2 回合`);
    } else if(el === '空间'){
      castStrike(attackerUnit, target, 0.8, { name: sk.name, noElement:true });
      attackerUnit.st.intangible = 1;
      log(`🌌 ${ref.name} 相位化，暂时无法被选中`);
    } else if(el === '时间'){
      const dead = B.allies.find(u=>u !== attackerUnit && u.hp <= 0);
      if(dead){
        dead.hp = Math.max(1, Math.round(dead.maxHp * 0.3));
        if(dead.st){
          dead.st.burn = dead.st.poison = dead.st.frostbite = 0;
          dead.st.frozen = dead.st.paralysis = dead.st.charm = dead.st.weakness = 0;
        }
        refreshBars();
        const del = getUnitEl(dead, 'ally');
        /* 撤掉死亡演出残留，否则复活后单位停在 opacity:0 */
        const delSl = del && del.querySelector('.slime');
        if(delSl) delSl.classList.remove('dying');
        if(del) FX.float(del, '复活', { cls:'good' });
        log(`⏳ ${ref.name} 的${sk.name}让 ${dead.ref.name} 回到战场（30% 生命）`);
      } else {
        if(!target || target.hp <= 0){
          log('没有阵亡友方，也没有可攻击的目标');
          renderSkillBar();
          return false;
        }
        castStrike(attackerUnit, target, 1.3, { name: sk.name });
      }
    }

    attackerUnit.acted = true;
    attackerUnit.cd[el] = sk.cd;
    refreshIntentPanel();
    refreshBars();
    renderSkillBar();
    return true;
  }

  function markTargetable(on){
    overlay.querySelectorAll('.battle-row.enemy .battle-unit').forEach(el=>{
      const u=B.monsters.find(b=>String(b.ref.id)===String(el.dataset.monId));
      el.classList.toggle('targetable', !!on && !!u && u.hp>0 && !isUntargetable(u,getAllAliveMain('enemy')));
    });
  }

  function renderSkillBar(){
    overlay.querySelectorAll('[data-ally-id]').forEach(el=>el.classList.toggle('selected-unit', !!skSel && manualMode() && String(el.dataset.allyId)===String(skSel.ref.id)));
    const bar = overlay.querySelector('#skillBar');
    if(!bar) return;
    if(!manualMode()){
      bar.classList.add('hide');
      bar.innerHTML = '';
      skSel = null;
      skPick = null;
      markTargetable(false);
      return;
    }
    bar.classList.remove('hide');
    const alive = B.allies.filter(u=>u.hp > 0).slice(0, 5);
    /* 全队阵亡：技能条必须收起来，否则残留按钮会让人以为还能行动 */
    if(!alive.length){
      bar.classList.add('hide');
      bar.innerHTML = '';
      skSel = null;
      skPick = null;
      markTargetable(false);
      return;
    }
    if(skSel && (skSel.hp <= 0 || alive.indexOf(skSel) < 0)){ skSel = null; skPick = null; markTargetable(false); }
    let html = alive.map(u=>{
      const cd = u.cd[u.ref.element] || 0;
      return `<button class="sk-unit ${u === skSel ? 'on' : ''}" data-sk-unit="${u.ref.id}">
        <span class="sk-ic">${elementIcon(u.ref.element)}</span>
        <span class="sk-nm">${esc(u.ref.name)}</span>
        ${cd > 0 ? `<span class="sk-nm">CD ${cd}</span>` : (u.acted ? '<span class="sk-nm">已行动</span>' : '')}
      </button>`;
    }).join('');
    if(skSel){
      const sk = skillOf(skSel.ref);
      const cd = skSel.cd[skSel.ref.element] || 0;
      html += `<div class="sk-acts">
        <button class="sk-act" data-sk-act="basic" ${skSel.acted ? 'disabled' : ''}>普攻</button>
        <button class="sk-act" data-sk-act="skill" ${(skSel.acted || cd > 0) ? 'disabled' : ''}>${sk ? sk.name : '—'}${cd > 0 ? ' CD' + cd : ''}</button>
        <button class="sk-act ghost" data-sk-act="cancel">×</button>
      </div>`;
    }
    bar.innerHTML = html;

    bar.querySelectorAll('[data-sk-unit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = String(btn.dataset.skUnit);
        const u = B.allies.find(a=>String(a.ref.id) === id);
        if(!u || u.hp <= 0) return;
        skSel = (skSel === u) ? null : u;
        skPick = null;
        markTargetable(false);
        renderSkillBar();
      });
    });
    bar.querySelectorAll('[data-sk-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const act = btn.dataset.skAct;
        if(act === 'cancel'){ skSel = null; skPick = null; markTargetable(false); renderSkillBar(); return; }
        if(!skSel) return;
        if(act === 'basic'){ skPick = 'basic'; markTargetable(true); log('选择普攻目标…'); return; }
        const sk = skillOf(skSel.ref);
        if(!sk) return;
        if(sk.target === 'enemy'){ skPick = 'skill'; markTargetable(true); log('选择技能目标…'); return; }
        doManual('skill', null);
      });
    });
  }

  function doManual(kind, target){
    markTargetable(false);
    const u = skSel;
    skPick = null;
    if(!u) return;
    const ok = (kind === 'basic') ? playerBasic(u, target) : playerCast(u, target);
    if(ok) skSel = null;
    renderSkillBar();
    if((ok || u.acted) && typeof afterPlayerAction === 'function') afterPlayerAction(u);
    refreshIntentPanel();
  }

  overlay.addEventListener('click', (ev)=>{
    if(!skSel || !skPick) return;
    const unitEl = ev.target.closest ? ev.target.closest('.battle-row.enemy .battle-unit') : null;
    if(!unitEl) return;
    const id = String(unitEl.dataset.monId);
    const target = B.monsters.find(m=>String(m.ref.id) === id);
    if(!target) return;
    doManual(skPick, target);
  });

  overlay.querySelector('#bMode').addEventListener('click', ()=>{
    const i = MODES.indexOf(currentBattleMode());
    const nextMode = MODES[(i + 1) % MODES.length];
    if(B.training) B.trainingMode = nextMode; else S.battleMode = nextMode;
    overlay.querySelector('#bMode').textContent = MODE_LABEL[currentBattleMode()];
    renderSkillBar();
    log(`战斗玩法切换为「${MODE_LABEL[currentBattleMode()]}」`);
    /* 从逐回合切走时，立刻交回这条待行动的单位，不用等 8s 兜底 */
    if(B.paused && typeof B._pauseResume === 'function'){
      const resume = B._pauseResume;
      B._pauseResume = null;
      resume();
    }
    save();
  });
  overlay.querySelector('#bMode').textContent = MODE_LABEL[currentBattleMode()] || '自动';
  renderSkillBar();

  let battleClosed = false;
  let autoCloseTimer = null;

  function closeBattle(){
    LivingWorld.release(S,'battle');
    if(battleClosed) return;
    battleClosed = true;
    B.running = false;
    B.paused = false;
    afterPlayerAction = null;
    if(B.pauseTimer){ clearTimeout(B.pauseTimer); B.pauseTimer = null; }
    B._pauseResume = null;
    if(autoCloseTimer){ clearTimeout(autoCloseTimer); autoCloseTimer = null; }
    if(B.timer) clearInterval(B.timer);
    B.pendingTimers.forEach(t=>clearTimeout(t));
    B.pendingTimers = [];
    overlay.remove();
    save();
    if(activeTab === 'space') renderTab();
  }

  function later(fn, ms){
    const id = setTimeout(()=>{
      B.pendingTimers = B.pendingTimers.filter(x=>x!==id);
      if(battleClosed)return;
      if(!canWrite()){later(fn,250);return;}
      fn();
    }, ms);
    B.pendingTimers.push(id);
    return id;
  }

  overlay.querySelectorAll('.speed-btn[data-speed]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      battleSpeed = +btn.dataset.speed;
      S.battleSpeed = battleSpeed;
      save();
      overlay.querySelectorAll('.speed-btn[data-speed]').forEach(b=>b.classList.toggle('on', b===btn));
      restartTimer();
    });
  });

  function intervalMs(){ return Math.round(9000 / battleSpeed); }

  function restartTimer(){
    if(B.timer) clearInterval(B.timer);
    if(!B.running) return;
    B.timer = setInterval(nextTurn, intervalMs());
  }

  function log(msg){ logEl.innerHTML = msg; }

  function dealDamage(target, dmg){
    const st = target.st;
    let remaining = dmg;
    if(st.rockArmor > 0 || st.iceArmor > 0){
      remaining = Math.max(1, Math.round(remaining * 0.75));
    }
    if(st.rockArmor > 0){
      const absorbed = Math.min(st.rockArmor, remaining);
      st.rockArmor -= absorbed;
      remaining -= absorbed;
    }
    if(st.iceArmor > 0){
      const absorbed = Math.min(st.iceArmor, remaining);
      st.iceArmor -= absorbed;
      remaining -= absorbed;
    }
    target.hp = Math.max(0, target.hp - remaining);
    return remaining;
  }

  /* 护盾（岩甲 / 冰甲）会把伤害先吃掉；如果护盾吃满了这一下，直接报“造成 0 伤害”
     会像攻击打空，所以战报改成披露吸收量，飘字也换成“护盾”。 */
  function shieldOf(target){
    return (target.st.rockArmor || 0) + (target.st.iceArmor || 0);
  }
  function damageLogText(target, beforeShield, actual, head, tail){
    const absorbed = Math.max(0, beforeShield - shieldOf(target));
    if(actual === 0 && absorbed > 0) return `${head}，护盾吸收 ${absorbed} 点${tail || ''}`;
    return `${head}，造成 ${actual} 伤害${tail || ''}`;
  }

  function applyStatus(unit, key, amount){
    const st = unit.st;
    if(st.immuneDebuff) return false;
    if(key === 'burn' && unit.ref.element === '水') return false;
    if(key === 'burn' && unit.ref.element === '草') amount += 1;
    const def = STATUS_DEFS[key];
    if(!def) return false;
    st[key] = Math.min(def.max, (st[key]||0) + amount);
    if(key === 'frostbite' && st.frostbite >= 3){
      st.frostbite = 0;
      st.frozen = 1;
    }
    return true;
  }

  function isUntargetable(unit, team){
    if(unit.st && (unit.st.intangible || 0) > 0) return true;
    if(unit.ref.element !== '空间') return false;
    return team.some(u=>u !== unit && u.hp > 0);
  }

  function checkRevive(side){
    const team = side === 'ally' ? B.allies : B.monsters;
    if(team.some(u=>u.hp > 0)) return false;
    const reviver = team.find(u=>u.st.timeRevive && !u.st.reviveUsed);
    if(!reviver) return false;
    reviver.st.reviveUsed = true;
    team.forEach(u=>{
      u.hp = Math.max(1, Math.round(u.maxHp * 0.2));
      u.st.burn = u.st.poison = u.st.frostbite = 0;
      u.st.frozen = u.st.paralysis = u.st.charm = u.st.weakness = 0;
      u.st.rockArmor = 0;
      u.st.iceArmor = 0;
      /* 死亡演出（.dying 定格 opacity:0）必须撤掉，否则复活的史莱姆看不见 */
      const el = getUnitEl(u, side);
      const sl = el && el.querySelector('.slime');
      if(sl) sl.classList.remove('dying');
    });
    log(`⏳ ${reviver.ref.name} 触发【回溯】，全体友方复活（回复20%生命）！`);
    refreshBars();
    return true;
  }

  function getCoords(el){
    const fieldRect = fieldEl.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return {x:r.left-fieldRect.left+r.width/2, y:r.top-fieldRect.top+r.height/2};
  }

  function spawnRadiantOrbs(from, to, col, count, sizeRange, opts){
    opts = opts || {};
    const [minS, maxS] = sizeRange || [9, 24];
    const opBase = opts.opacity != null ? opts.opacity : 0.92;
    const spreadX = opts.spreadX != null ? opts.spreadX : 22;
    const spreadYMin = opts.spreadYMin != null ? opts.spreadYMin : 28;
    const spreadYMax = opts.spreadYMax != null ? opts.spreadYMax : 60;
    const noFade = !!opts.noFade;
    const glow = opts.glow;
    const glowSpread = opts.glowSpread != null ? opts.glowSpread : 1.4;
    for(let i=0;i<count;i++){
      const size = rnd(minS, maxS);
      const orb = document.createElement('div');
      orb.className = 'skill-orb';
      orb.style.left = from.x+'px'; orb.style.top = from.y+'px';
      orb.style.width = size+'px'; orb.style.height = size+'px';
      orb.style.background = `radial-gradient(circle, ${col} 12%, ${col} 28%, rgba(255,255,255,0.22) 58%, rgba(255,255,255,0) 100%)`;
      orb.style.clipPath = 'polygon(50% 0%, 65% 40%, 100% 50%, 65% 60%, 50% 100%, 35% 60%, 0% 50%, 35% 40%)';
      orb.style.borderRadius = '0';
      orb.style.filter = 'blur(2.6px)';
      orb.style.opacity = String(opBase);
      if(glow){
        orb.style.boxShadow = `0 0 ${size*glowSpread}px ${glow}, 0 0 ${size*glowSpread*1.7}px ${glow}`;
      } else {
        orb.style.boxShadow = `0 0 ${size*0.6}px ${col}, 0 0 ${size*1.4}px ${col}80`;
      }
      fieldEl.appendChild(orb);
      const ex = from.x + rnd(-spreadX, spreadX);
      const ey = from.y - rnd(spreadYMin, spreadYMax);
      setTimeout(()=>{
        if(!orb.isConnected) return;
        const t0 = performance.now(), d1 = 260 + Math.random()*120;
        function spread(now){
          if(!orb.isConnected) return;
          const p = Math.min(1,(now-t0)/d1);
          const ease = 1-Math.pow(1-p,2);
          orb.style.left = (from.x+(ex-from.x)*ease)+'px';
          orb.style.top  = (from.y+(ey-from.y)*ease)+'px';
          if(p<1){ requestAnimationFrame(spread); return; }
          const t1 = performance.now(), d2 = 340 + Math.random()*140;
          function fly(now2){
            if(!orb.isConnected) return;
            const q = Math.min(1,(now2-t1)/d2);
            const e2 = q*q;
            orb.style.left = (ex+(to.x-ex)*e2)+'px';
            orb.style.top  = (ey+(to.y-ey)*e2)+'px';
            if(noFade){
              orb.style.opacity = String(opBase);
            } else {
              orb.style.opacity = (opBase * (1 - q*0.6)).toFixed(2);
            }
            if(q<1) requestAnimationFrame(fly); else orb.remove();
          }
          requestAnimationFrame(fly);
        }
        requestAnimationFrame(spread);
      }, i*50);
    }
  }

  function markBattleAction(atkUnit,tgtUnit){
    overlay.querySelectorAll('.is-acting,.is-targeted').forEach(e=>e.classList.remove('is-acting','is-targeted'));
    if(atkUnit)atkUnit.classList.add('is-acting');if(tgtUnit)tgtUnit.classList.add('is-targeted');
    later(()=>{if(atkUnit)atkUnit.classList.remove('is-acting');if(tgtUnit)tgtUnit.classList.remove('is-targeted');},Math.max(400,1100/battleSpeed));
  }
  function doElementBallEffect(attacker, atkUnit, tgtUnit, important){
    if(!atkUnit || !tgtUnit) return;
    markBattleAction(atkUnit,tgtUnit);
    const from = getCoords(atkUnit), to = getCoords(tgtUnit);
    const c = slimeColor(attacker);
    const h = c.h, s = Math.max(c.s,40), l = Math.max(c.l,55);
    const col = `hsl(${h} ${s.toFixed(1)}% ${l.toFixed(1)}%)`;
    const miniScale = attacker.miniScale || 1;
    if(!important){
      const orb=document.createElement('div');orb.className='skill-orb';orb.style.cssText=`left:${from.x}px;top:${from.y}px;width:7px;height:7px;background:${col};box-shadow:0 0 5px ${col};opacity:.8`;fieldEl.appendChild(orb);
      const start=performance.now(),duration=Math.max(120,320/battleSpeed);
      const fly=now=>{if(!orb.isConnected)return;const p=Math.min(1,(now-start)/duration);orb.style.left=from.x+(to.x-from.x)*p+'px';orb.style.top=from.y+(to.y-from.y)*p+'px';if(p<1)requestAnimationFrame(fly);else orb.remove();};requestAnimationFrame(fly);return;
    }
    const ring = document.createElement('div');
    ring.className = 'skill-ring important';
    ring.style.left = from.x+'px';
    ring.style.top = from.y+'px';
    ring.style.setProperty('--h', h);
    ring.style.setProperty('--s', s.toFixed(1)+'%');

          function spread(now){
            if(!orb.isConnected) return;
