    [
      ["\u6811\u76AE\u4E0A\u7684\u7BAD\u5934", "\u4E09\u68F5\u8001\u6811\u523B\u7740\u4E0D\u540C\u65B9\u5411\u7684\u7BAD\u5934\uFF0C\u6700\u6D45\u7684\u523B\u75D5\u65C1\u6709\u4E00\u682A\u94C3\u5170\u3002", "\u6CBF\u94C3\u5170\u7EE7\u7EED\u8D70", "\u62D3\u5370\u5168\u90E8\u523B\u75D5"],
      ["\u8611\u83C7\u90AE\u5DEE", "\u6234\u8611\u83C7\u5E3D\u7684\u5C0F\u5BB6\u4F19\u628A\u4E00\u888B\u82B1\u7C89\u8BA4\u6210\u4E86\u4FE1\u4EF6\uFF0C\u575A\u6301\u9001\u53BB\u65E7\u6E29\u5BA4\u3002", "\u966A\u5B83\u5B8C\u6210\u6295\u9012", "\u4EA4\u6362\u82B1\u7C89\u7684\u6765\u5386"],
      ["\u88AB\u7F20\u4F4F\u7684\u5C3E\u5DF4", "\u85E4\u8513\u7F20\u4F4F\u4E00\u53EA\u677E\u9F20\uFF0C\u5B83\u4ECD\u4E0D\u613F\u677E\u5F00\u624B\u91CC\u7684\u6A61\u679C\u3002", "\u526A\u5F00\u85E4\u8513", "\u7528\u679C\u5B9E\u5F15\u5B83\u653E\u624B"],
      ["\u79CD\u5B50\u76EE\u5F55", "\u53D1\u9709\u7684\u4E66\u9875\u53EA\u5269\u690D\u7269\u8F6E\u5ED3\uFF0C\u8FB9\u89D2\u5199\u7740\u201C\u7ED9\u613F\u610F\u7B49\u5F85\u7684\u4EBA\u201D\u3002", "\u6309\u53F6\u5F62\u6574\u7406\u76EE\u5F55", "\u7528\u79CD\u5B50\u989C\u8272\u91CD\u65B0\u5206\u7C7B"],
      ["\u5012\u5F71\u4E2D\u7684\u5C94\u8DEF", "\u4E24\u6761\u8DEF\u5728\u6C34\u4E2D\u6620\u6210\u540C\u4E00\u6761\uFF0C\u4F19\u4F34\u53D1\u73B0\u6811\u5F71\u65B9\u5411\u4E0D\u4E00\u6837\u3002", "\u8DDF\u7740\u5149\u8D70", "\u6CBF\u6C34\u6D41\u8FA8\u8BA4\u65B9\u5411"],
      ["\u6811\u6839\u4E0B\u7684\u547C\u5438", "\u4E00\u53EA\u5E7C\u4F53\u8EB2\u5728\u6811\u6839\u95F4\uFF0C\u6A21\u4EFF\u6811\u53F6\u7684\u989C\u8272\u52AA\u529B\u4E0D\u88AB\u53D1\u73B0\u3002", "\u8F7B\u58F0\u8BB2\u4E00\u4E2A\u6545\u4E8B", "\u653E\u4E0B\u98DF\u7269\u8010\u5FC3\u7B49\u5F85"],
      ["\u7761\u7740\u7684\u5B88\u6797\u8005", "\u5B88\u6797\u8005\u9760\u5728\u6811\u5E72\u4E0A\uFF0C\u624B\u4E2D\u5730\u56FE\u88AB\u96E8\u6253\u6E7F\uFF0C\u58A8\u8FF9\u6B63\u5728\u6563\u5F00\u3002", "\u70D8\u5E72\u5730\u56FE", "\u628A\u8DEF\u7EBF\u523B\u5728\u6728\u7247\u4E0A"],
      ["\u591C\u5F00\u7684\u82B1", "\u592A\u9633\u843D\u4E0B\u540E\uFF0C\u95ED\u5408\u7684\u82B1\u6735\u4F9D\u6B21\u6253\u5F00\uFF0C\u9732\u51FA\u94F6\u8272\u82B1\u7C89\u3002", "\u7559\u4E0B\u4E00\u591C\u89C2\u5BDF", "\u5E26\u5C11\u91CF\u82B1\u7C89\u56DE\u53BB\u7814\u7A76"],
      ["\u4E89\u593A\u6811\u836B", "\u4E24\u682A\u5E7C\u82D7\u6324\u5728\u540C\u4E00\u7247\u9634\u5F71\u91CC\uFF0C\u53F6\u7247\u4E92\u76F8\u906E\u6321\u3002", "\u5206\u522B\u79FB\u683D", "\u4FEE\u526A\u4E0A\u65B9\u6811\u679D"],
      ["\u8346\u68D8\u5B88\u536B", "\u4E00\u53EA\u62A4\u7740\u5DE2\u7A74\u7684\u91CE\u751F\u4F19\u4F34\u628A\u8346\u68D8\u5377\u6210\u76FE\u724C\u3002\u5B83\u53EA\u60F3\u786E\u8BA4\u6765\u5BA2\u4F1A\u4FDD\u6301\u8DDD\u79BB\u3002", "\u6B63\u9762\u8BD5\u63A2\u7F3A\u53E3", "\u7ED5\u5F00\u5DE2\u7A74\u8868\u793A\u5584\u610F"],
      ["\u98CE\u4E2D\u7684\u540D\u5B57", "\u65E7\u8DEF\u724C\u6BCF\u4E00\u9762\u90FD\u523B\u7740\u4E0D\u540C\u7684\u540D\u5B57\uFF0C\u6700\u540E\u4E00\u9762\u7559\u7740\u7A7A\u767D\u3002", "\u523B\u4E0B\u5171\u540C\u7684\u5BB6\u56ED\u540D", "\u5199\u4E0B\u6240\u6709\u540C\u884C\u8005"],
      ["\u6700\u540E\u4E00\u9875", "\u76EE\u5F55\u6700\u540E\u4E00\u9875\u5199\u7740\uFF1A\u79CD\u5B50\u79BB\u5F00\u68EE\u6797\uFF0C\u68EE\u6797\u624D\u80FD\u8D70\u5F97\u66F4\u8FDC\u3002", "\u5E26\u8D70\u4E00\u4EFD\u79CD\u5B50", "\u7ED9\u68EE\u6797\u7559\u4E0B\u81EA\u5DF1\u7684\u8BB0\u5F55"]
    ],
    [
      ["\u7184\u706D\u7684\u6CB3", "\u8424\u706B\u866B\u505C\u5728\u5E72\u67AF\u82A6\u82C7\u4E0A\u3002\u4E0A\u6E38\u7684\u5C0F\u77F3\u575D\u6321\u4F4F\u4E86\u6C34\u6D41\u3002", "\u632A\u5F00\u963B\u6C34\u77F3", "\u6316\u51FA\u7F13\u6162\u7684\u65C1\u6E20"],
      ["\u6F02\u6D41\u74F6", "\u74F6\u91CC\u88C5\u7740\u4E00\u5F20\u6A21\u7CCA\u7684\u5408\u7167\uFF0C\u80CC\u9762\u753B\u7740\u4E00\u6761\u4E09\u5C94\u6C34\u9053\u3002", "\u5BFB\u627E\u62CD\u7167\u7684\u5730\u70B9", "\u4FDD\u5B58\u7167\u7247\u7814\u7A76\u6C34\u9053"],
      ["\u6C34\u4E0B\u7684\u706F", "\u6C34\u5E95\u7684\u5C0F\u5149\u70B9\u968F\u7740\u547C\u5438\u4EAE\u8D77\uFF0C\u662F\u4E00\u53EA\u88AB\u6C34\u8349\u7F20\u4F4F\u7684\u5E7C\u4F53\u3002", "\u6162\u6162\u89E3\u5F00\u6C34\u8349", "\u8BF7\u6C34\u4F19\u4F34\u6258\u5B83\u4E0A\u5CB8"],
      ["\u4F1A\u79FB\u52A8\u7684\u5C9B", "\u5C0F\u5C9B\u5176\u5B9E\u662F\u4E00\u7FA4\u62B1\u5728\u4E00\u8D77\u7684\u6C34\u751F\u690D\u7269\uFF0C\u6839\u90E8\u85CF\u7740\u9C7C\u5375\u3002", "\u62A4\u9001\u5230\u7F13\u6D41\u533A", "\u56F4\u51FA\u5B89\u5168\u7684\u6C34\u6E7E"],
      ["\u51C0\u6C34\u5B9E\u9A8C", "\u900F\u660E\u7684\u6C34\u676F\u91CC\u653E\u7740\u4E0D\u540C\u7684\u6C34\u8349\uFF0C\u4E00\u676F\u9010\u6E10\u53D8\u5F97\u6E05\u6F88\u3002", "\u8BB0\u5F55\u51C0\u5316\u901F\u5EA6", "\u5E26\u56DE\u51C0\u6C34\u85FB\u79CD\u5B50"],
      ["\u6811\u86D9\u5408\u5531", "\u6811\u86D9\u5728\u65AD\u6865\u4E24\u7AEF\u4EA4\u66FF\u9E23\u53EB\uFF0C\u58F0\u97F3\u6807\u51FA\u8FD8\u6CA1\u6C89\u6CA1\u7684\u77F3\u5934\u3002", "\u6309\u8282\u594F\u8FC7\u6CB3", "\u4FEE\u590D\u4E00\u6761\u5B89\u9759\u7684\u6D6E\u6865"],
      ["\u6CE5\u91CC\u7684\u811A\u5370", "\u811A\u5370\u5728\u6D45\u6EE9\u5C3D\u5934\u6D88\u5931\uFF0C\u4E00\u628A\u5C0F\u94F2\u5B50\u7559\u5728\u539F\u5730\u3002", "\u6CBF\u82A6\u82C7\u5BFB\u627E\u4E3B\u4EBA", "\u89C2\u5BDF\u6C34\u4E0B\u7684\u6C14\u6CE1"],
      ["\u94F6\u9CCD\u7684\u56DE\u6E38", "\u94F6\u9CCD\u9C7C\u5728\u7A84\u53E3\u62E5\u6324\uFF0C\u4F19\u4F34\u53D1\u73B0\u4E00\u6BB5\u88AB\u843D\u679D\u5835\u4F4F\u7684\u901A\u9053\u3002", "\u6E05\u7406\u679D\u53F6", "\u6269\u5927\u6D45\u6C34\u5165\u53E3"],
      ["\u6E7F\u5730\u5B88\u95E8\u4EBA", "\u91CE\u751F\u53F2\u83B1\u59C6\u628A\u8377\u53F6\u5F53\u76FE\uFF0C\u8981\u6C42\u6765\u5BA2\u8BC1\u660E\u4E0D\u4F1A\u4F24\u5BB3\u6C34\u5858\u3002", "\u5B8C\u6210\u6C34\u4E0A\u5207\u78CB", "\u5E2E\u52A9\u6253\u635E\u6742\u7269"],
      ["\u96E8\u6C34\u7684\u5473\u9053", "\u4E0D\u540C\u6C34\u6D3C\u91CC\u957F\u7740\u4E0D\u540C\u690D\u7269\uFF0C\u4F19\u4F34\u628A\u5B83\u4EEC\u753B\u6210\u4E00\u5F20\u6E7F\u5EA6\u5730\u56FE\u3002", "\u8865\u5168\u6C34\u8D28\u8BB0\u5F55", "\u91C7\u96C6\u4EE3\u8868\u690D\u7269"],
      ["\u8424\u5149\u7EA6\u5B9A", "\u591C\u706F\u53D1\u73B0\u8424\u706B\u866B\u7684\u5149\u4E0D\u4F1A\u540C\u65F6\u4EAE\u8D77\uFF0C\u603B\u6709\u4E00\u53EA\u5728\u7B49\u5F85\u4F19\u4F34\u3002", "\u4E00\u8D77\u7B49\u5F85\u6700\u540E\u4E00\u53EA", "\u70B9\u4E00\u76CF\u706F\u56DE\u5E94"],
      ["\u6CB3\u6D41\u91CD\u65B0\u53D1\u5149", "\u4FEE\u597D\u7684\u6C34\u9053\u4F20\u6765\u7EC6\u54CD\uFF0C\u7B2C\u4E00\u4E32\u8424\u5149\u6CBF\u7740\u65B0\u6C34\u9762\u7F13\u7F13\u79FB\u52A8\u3002", "\u8BB0\u5F55\u6062\u590D\u540E\u7684\u751F\u7269", "\u9080\u8BF7\u4F19\u4F34\u6765\u6CB3\u8FB9\u91CE\u9910"]
    ],
    [
      ["\u6E29\u6CC9\u88C2\u7F1D", "\u70ED\u6C34\u4ECE\u5CA9\u7F1D\u6EA2\u51FA\uFF0C\u8D8A\u8FC7\u4E86\u5C45\u6C11\u7528\u77F3\u5757\u6807\u8BB0\u7684\u5B89\u5168\u7EBF\u3002", "\u758F\u901A\u65E7\u6E20", "\u780C\u8D77\u5206\u6D41\u77F3\u5899"],
      ["\u70EB\u624B\u7684\u77F3\u5934", "\u7EA2\u8272\u6676\u77F3\u8FD8\u5F88\u6E29\u70ED\uFF0C\u70EC\u56E2\u8BF4\u5B83\u7684\u6E29\u5EA6\u6B63\u5728\u6709\u89C4\u5F8B\u5730\u53D8\u5316\u3002", "\u8BB0\u5F55\u6E29\u5EA6\u5468\u671F", "\u7B49\u51B7\u5374\u540E\u53D6\u6837"],
      ["\u5CE1\u8C37\u56DE\u58F0", "\u6C42\u6551\u58F0\u5728\u8C37\u58C1\u95F4\u91CD\u590D\uFF0C\u6700\u54CD\u7684\u65B9\u5411\u5374\u6CA1\u6709\u811A\u5370\u3002", "\u6CBF\u811A\u5370\u5BFB\u627E", "\u7528\u77ED\u4FC3\u56DE\u58F0\u5B9A\u4F4D"],
      ["\u7194\u5CA9\u65C1\u7684\u5C0F\u5C4B", "\u907F\u98CE\u6D1E\u91CC\u4F4F\u7740\u4E00\u53EA\u706B\u5E7C\u4F53\uFF0C\u5B83\u628A\u788E\u9676\u7247\u6392\u6210\u9910\u684C\u3002", "\u5E26\u4E00\u53EA\u7ED3\u5B9E\u7684\u676F\u5B50", "\u9080\u8BF7\u5B83\u4F7F\u7528\u771F\u6B63\u7684\u9910\u684C"],
      ["\u77F3\u5320\u7684\u96BE\u9898", "\u77F3\u5320\u9700\u8981\u4E00\u5757\u4E0D\u4F1A\u8BA9\u6C34\u6E20\u6F0F\u6C34\u7684\u77F3\u5934\uFF0C\u4E09\u79CD\u7EB9\u7406\u5404\u4E0D\u76F8\u540C\u3002", "\u9009\u62E9\u7EC6\u5BC6\u7684\u77F3\u7EB9", "\u7528\u6CE5\u6D46\u9010\u4E00\u6D4B\u8BD5"],
      ["\u6C99\u4E2D\u7684\u5AE9\u82BD", "\u9AD8\u6E29\u6C99\u5730\u91CC\u957F\u51FA\u4E00\u682A\u5AE9\u82BD\uFF0C\u6839\u90E8\u7D27\u8D34\u4E00\u5757\u51B0\u51C9\u7684\u7070\u77F3\u3002", "\u8FDE\u77F3\u5E26\u82D7\u79FB\u683D", "\u7814\u7A76\u77F3\u5934\u7684\u9694\u70ED\u80FD\u529B"],
      ["\u9057\u843D\u7684\u62A4\u76EE\u955C", "\u955C\u7247\u4E0A\u6CBE\u6EE1\u6676\u7C89\uFF0C\u900F\u8FC7\u5B83\u5374\u80FD\u770B\u89C1\u5CA9\u58C1\u91CC\u9690\u85CF\u7684\u88C2\u9699\u3002", "\u4FEE\u597D\u62A4\u76EE\u955C", "\u7ED8\u51FA\u88C2\u9699\u5206\u5E03"],
      ["\u70ED\u6CC9\u6599\u7406", "\u5C45\u6C11\u628A\u98DF\u6750\u653E\u5728\u6CC9\u8FB9\u52A0\u70ED\uFF0C\u9080\u8BF7\u4F60\u51B3\u5B9A\u4ECA\u5929\u7684\u8C03\u5473\u3002", "\u52A0\u5165\u7518\u9732\u8349", "\u52A0\u5165\u6696\u53F6\u8349"],
      ["\u8D64\u6676\u6311\u6218", "\u5B88\u7740\u77FF\u6D1E\u7684\u4F19\u4F34\u8981\u6C42\u6765\u5BA2\u63A7\u5236\u529B\u9053\uFF0C\u4E0D\u80FD\u9707\u843D\u5934\u9876\u7684\u77F3\u7247\u3002", "\u7528\u7CBE\u786E\u7684\u4E00\u51FB", "\u5F15\u5BFC\u5BF9\u65B9\u79BB\u5F00\u6D1E\u53E3"],
      ["\u51C9\u98CE\u4E95", "\u5E9F\u5F03\u901A\u98CE\u4E95\u88AB\u788E\u77F3\u5835\u4F4F\uFF0C\u6D1E\u91CC\u7684\u5E7C\u82D7\u5DF2\u7ECF\u5782\u4E0B\u53F6\u7247\u3002", "\u642C\u5F00\u5835\u585E\u7684\u77F3\u5757", "\u642D\u5EFA\u5BFC\u98CE\u677F"],
      ["\u7126\u9ED1\u7684\u624B\u5957", "\u70EC\u56E2\u8BA4\u51FA\u90A3\u526F\u624B\u5957\uFF0C\u662F\u5B83\u7B2C\u4E00\u6B21\u505A\u996D\u65F6\u7559\u4E0B\u7684\u4E1C\u897F\u3002", "\u628A\u624B\u5957\u6D17\u51C0\u6536\u85CF", "\u7F1D\u6210\u9694\u70ED\u7684\u5C0F\u57AB\u5B50"],
      ["\u6E29\u6696\u7684\u5F52\u8DEF", "\u6C34\u6E20\u4FEE\u597D\u540E\uFF0C\u5C45\u6C11\u6CBF\u7740\u5F52\u8DEF\u70B9\u8D77\u5B89\u5168\u7684\u5C0F\u706B\u76C6\u3002", "\u7ED9\u706B\u76C6\u52A0\u4E0A\u62A4\u680F", "\u5728\u8DEF\u53E3\u7559\u4E0B\u6E29\u5EA6\u6807\u8BB0"]
    ],
    [
      ["\u4E22\u5931\u7684\u94C3\u58F0", "\u96EA\u91CC\u57CB\u7740\u534A\u7247\u94DC\u94C3\uFF0C\u8FDC\u5904\u7684\u56DE\u5E94\u6BD4\u98CE\u58F0\u66F4\u8F7B\u3002", "\u6309\u58F0\u97F3\u7EE7\u7EED\u627E", "\u6CBF\u65E7\u7EF3\u7D22\u5BFB\u627E"],
      ["\u51B0\u5C42\u4E0B\u7684\u7EFF", "\u51B0\u5C42\u4E0B\u4ECD\u6709\u6C34\u8349\u751F\u957F\uFF0C\u94C3\u971C\u628A\u8033\u6735\u8D34\u8FD1\u51B0\u9762\u3002", "\u51FF\u5F00\u900F\u6C14\u5B54", "\u79FB\u8D70\u906E\u5149\u79EF\u96EA"],
      ["\u98CE\u96EA\u4E2D\u7684\u56F4\u5DFE", "\u56F4\u5DFE\u7684\u4E00\u7AEF\u7ED1\u5728\u6811\u4E0A\uFF0C\u53E6\u4E00\u7AEF\u4F38\u5411\u5373\u5C06\u88AB\u96EA\u8986\u76D6\u7684\u5C0F\u7A9D\u3002", "\u6CBF\u56F4\u5DFE\u6551\u51FA\u5E7C\u4F53", "\u5148\u642D\u8D77\u6321\u98CE\u677F"],
      ["\u4E0D\u4F1A\u878D\u5316\u7684\u4FE1", "\u6587\u5B57\u523B\u5728\u51B0\u7247\u5185\u90E8\uFF0C\u6696\u5149\u7167\u4E0A\u53BB\u624D\u663E\u51FA\u5B8C\u6574\u53E5\u5B50\u3002", "\u501F\u65E5\u5149\u8BFB\u4FE1", "\u7528\u706F\u6162\u6162\u7167\u4EAE"],

      ["\u4E00\u74F6\u6D51\u6C34", "\u6C50\u6C50\u628A\u6545\u4E61\u7684\u6EAA\u6C34\u88C5\u5728\u74F6\u91CC\uFF0C\u8BF4\u81EA\u5DF1\u5DF2\u7ECF\u5F88\u4E45\u6CA1\u542C\u89C1\u6811\u86D9\u3002", "\u4E00\u8D77\u68C0\u6D4B\u74F6\u91CC\u7684\u6C34", "\u5148\u753B\u51FA\u8BB0\u5FC6\u91CC\u7684\u6EAA\u6D41"],
      ["\u88AB\u5835\u4F4F\u7684\u6E90\u5934", "\u6EAA\u6D41\u4E0A\u6E38\u5806\u6EE1\u67AF\u679D\u3002\u6C50\u6C50\u60F3\u4E00\u6B21\u642C\u8D70\u6240\u6709\u4E1C\u897F\uFF0C\u6C34\u5374\u51B2\u5F97\u5B83\u7AD9\u4E0D\u7A33\u3002", "\u5206\u6BB5\u6E05\u7406\u6C34\u9053", "\u5148\u642D\u7F13\u6D41\u7684\u77F3\u5824"],
      ["\u80FD\u547C\u5438\u7684\u6C34\u5858", "\u7B2C\u4E00\u6279\u6C34\u8349\u624E\u4E0B\u6839\uFF0C\u6E05\u6C34\u53EA\u51FA\u73B0\u4E86\u4E00\u5C0F\u5708\u3002\u6C50\u6C50\u6BCF\u5929\u6765\u91CF\u8FD9\u4E00\u5708\u3002", "\u8BB0\u5F55\u7F13\u6162\u7684\u53D8\u5316", "\u9080\u8BF7\u4F19\u4F34\u4E00\u8D77\u7167\u6599"],
      ["\u8BBF\u5BA2\u8FDF\u5230\u4E86", "\u6C34\u5DF2\u7ECF\u6E05\u4E86\uFF0C\u6811\u86D9\u4ECD\u6CA1\u56DE\u6765\u3002\u6C50\u6C50\u62C5\u5FC3\u81EA\u5DF1\u505A\u5F97\u8FD8\u4E0D\u591F\u3002", "\u8865\u4E0A\u906E\u9634\u4E0E\u6D45\u6C34\u5904", "\u6CBF\u65E7\u6816\u5730\u5BFB\u627E\u6811\u86D9"],
      ["\u96E8\u591C\u7B2C\u4E00\u58F0", "\u96E8\u591C\uFF0C\u4E00\u58F0\u5F88\u8F7B\u7684\u86D9\u9E23\u4ECE\u6C60\u8FB9\u54CD\u8D77\u3002\u6C50\u6C50\u793A\u610F\u5927\u5BB6\u5B89\u9759\uFF0C\u773C\u91CC\u5168\u662F\u5149\u3002", "\u9759\u9759\u542C\u5B8C\u6574\u573A\u5408\u5531", "\u628A\u58F0\u97F3\u5199\u6210\u8282\u594F\u8BB0\u53F7"],
      ["\u6D41\u5411\u8FDC\u65B9", "\u6C50\u6C50\u4E0D\u518D\u628A\u6EAA\u6C34\u5C01\u5728\u74F6\u91CC\u3002\u5B83\u628A\u7A7A\u74F6\u653E\u8FDB\u7EAA\u5FF5\u9986\uFF0C\u60F3\u8BA9\u6C34\u7EE7\u7EED\u5F80\u524D\u8D70\u3002", "\u7EE7\u7EED\u7EF4\u62A4\u5BB6\u56ED\u6C34\u9053", "\u628A\u51C0\u6C34\u65B9\u6CD5\u5E26\u7ED9\u65C5\u4EBA"]
    ],
    [
      ["\u7126\u6389\u7684\u65E9\u9910", "\u70EC\u56E2\u62A2\u7740\u505A\u65E9\u9910\uFF0C\u9505\u5E95\u5374\u9ED1\u4E86\u3002\u5B83\u6084\u6084\u628A\u81EA\u5DF1\u7684\u4F4D\u7F6E\u79FB\u79BB\u9910\u684C\u3002", "\u966A\u5B83\u6E05\u6D17\u9505\u5E95", "\u4E00\u8D77\u5C1D\u5C1D\u6CA1\u6709\u7126\u7684\u90E8\u5206"],
      ["\u6E29\u5EA6\u4E5F\u6709\u523B\u5EA6", "\u5DE5\u574A\u505A\u51FA\u7B80\u5355\u7684\u6E29\u5EA6\u724C\uFF0C\u70EC\u56E2\u7B2C\u4E00\u6B21\u770B\u89C1\u81EA\u5DF1\u7684\u70ED\u91CF\u80FD\u88AB\u51C6\u786E\u8BB0\u5F55\u3002", "\u7EC3\u4E60\u7A33\u5B9A\u7684\u5C0F\u706B", "\u8BD5\u8BD5\u77ED\u4FC3\u7684\u52A0\u70ED"],
      ["\u6E29\u5BA4\u91CC\u7684\u5BD2\u591C", "\u5BD2\u98CE\u8FDB\u5165\u6E29\u5BA4\uFF0C\u5E7C\u82D7\u5782\u4E0B\u53F6\u5B50\u3002\u70EC\u56E2\u62C5\u5FC3\u78B0\u574F\u5B83\u4EEC\uFF0C\u5728\u95E8\u53E3\u6765\u56DE\u8E31\u6B65\u3002", "\u8BF7\u5B83\u5B88\u5728\u6E29\u5BA4\u5916\u4F9B\u6696", "\u505A\u9694\u70ED\u6C34\u7BB1\u4F20\u9012\u6E29\u6696"],
      ["\u88C2\u5F00\u7684\u9676\u676F", "\u70EC\u56E2\u7ED9\u6C50\u6C50\u70ED\u6C34\uFF0C\u676F\u5B50\u7A81\u7136\u88C2\u5F00\u3002\u5B83\u53C8\u89C9\u5F97\u81EA\u5DF1\u53EA\u4F1A\u7834\u574F\u3002", "\u4E00\u8D77\u8C03\u67E5\u6750\u6599\u7684\u5DEE\u5F02", "\u8BF7\u6C50\u6C50\u8BF4\u51FA\u5B9E\u9645\u611F\u53D7"],
      ["\u7ED9\u6240\u6709\u4EBA\u7684\u4E00\u9505\u6C64", "\u65B0\u9505\u505A\u6210\u4E86\uFF0C\u70EC\u56E2\u60F3\u716E\u4E00\u9505\u6BCF\u4F4D\u4F19\u4F34\u90FD\u80FD\u559D\u7684\u6C64\uFF0C\u8FDE\u94C3\u971C\u7684\u90A3\u4EFD\u4E5F\u51C6\u5907\u597D\u4E86\u3002", "\u6309\u6BCF\u4EBA\u559C\u597D\u5206\u88C5", "\u8BA9\u5927\u5BB6\u5171\u540C\u51B3\u5B9A\u8C03\u5473"],
      ["\u5C0F\u5C0F\u7684\u7089\u706F", "\u591C\u91CC\u53A8\u623F\u7559\u7740\u4E00\u76CF\u6696\u706F\u3002\u70EC\u56E2\u8BF4\u706B\u6709\u5F88\u591A\u6837\u5B50\uFF0C\u81EA\u5DF1\u7EC8\u4E8E\u627E\u5230\u559C\u6B22\u7684\u4E00\u79CD\u3002", "\u5C06\u7089\u706F\u7559\u5728\u516C\u5171\u53A8\u623F", "\u628A\u7089\u706F\u6302\u5728\u5B83\u7684\u5C0F\u5C4B\u524D"]
    ],
    [
      ["\u95E8\u724C\u4E0A\u7684\u82D4", "\u82D4\u77F3\u4ECE\u5E9F\u589F\u5E26\u56DE\u4E00\u5757\u95E8\u724C\uFF0C\u5B57\u8FF9\u88AB\u82D4\u85D3\u76D6\u4F4F\u4E86\u4E00\u534A\u3002", "\u6E05\u7406\u51FA\u95E8\u724C\u4E0A\u7684\u5B57", "\u4FDD\u7559\u82D4\u85D3\u62D3\u5370\u65E7\u5B57"],
      ["\u8C01\u4F4F\u8FC7\u8FD9\u91CC", "\u65E7\u5EAD\u9662\u91CC\u6563\u843D\u7740\u5927\u5C0F\u4E0D\u540C\u7684\u676F\u5B50\uFF0C\u82D4\u77F3\u8BB0\u4E0D\u8D77\u6BCF\u4E2A\u4E3B\u4EBA\u3002", "\u6309\u7269\u54C1\u63A8\u6D4B\u751F\u6D3B\u573A\u666F", "\u8BF7\u65C5\u4EBA\u5E2E\u5FD9\u8FA8\u8BA4"],
      ["\u7A7A\u51FA\u6765\u7684\u5730\u65B9", "\u7167\u7740\u65E7\u56FE\u91CD\u5EFA\u65F6\uFF0C\u4E00\u68F5\u65B0\u6811\u6321\u5728\u5C0F\u5C4B\u7684\u4F4D\u7F6E\u3002\u82D4\u77F3\u62B1\u7740\u56FE\u7EB8\u6C89\u9ED8\u4E86\u3002", "\u4E3A\u65B0\u6811\u8C03\u6574\u8BBE\u8BA1", "\u7ED9\u8001\u623F\u5B50\u6362\u4E2A\u671D\u5411"],
      ["\u4E00\u628A\u6B6A\u6905\u5B50", "\u5B83\u7B2C\u4E00\u6B21\u505A\u51FA\u7684\u6905\u5B50\u6709\u4E9B\u6B6A\uFF0C\u5374\u6700\u9002\u5408\u4E00\u53EA\u559C\u6B22\u4FA7\u8EBA\u7684\u4F19\u4F34\u3002", "\u4E3A\u6905\u5B50\u627E\u5230\u5408\u9002\u4E3B\u4EBA", "\u548C\u4F19\u4F34\u4E00\u8D77\u4FEE\u6574\u6905\u811A"],
      ["\u4E0D\u540C\u7684\u5EAD\u9662", "\u91CD\u5EFA\u540E\u7684\u5EAD\u9662\u4E0E\u65E7\u7167\u7247\u5F88\u4E0D\u4E00\u6837\u3002\u82D4\u77F3\u62C5\u5FC3\u81EA\u5DF1\u6CA1\u6709\u4FDD\u5B58\u597D\u8BB0\u5FC6\u3002", "\u5BF9\u7167\u65B0\u65E7\u7167\u7247\u8BB2\u6545\u4E8B", "\u9080\u8BF7\u5927\u5BB6\u8BF4\u51FA\u559C\u6B22\u7684\u89D2\u843D"],
      ["\u65B0\u7684\u95E8\u724C", "\u82D4\u77F3\u5728\u65E7\u95E8\u724C\u80CC\u9762\u523B\u4E0B\u4ECA\u5929\u7684\u65E5\u671F\uFF1A\u8FD9\u91CC\u66FE\u7ECF\u662F\u5BB6\uFF0C\u4E5F\u4ECD\u7136\u662F\u5BB6\u3002", "\u6302\u5728\u6240\u6709\u4EBA\u7ECF\u8FC7\u7684\u5165\u53E3", "\u653E\u8FDB\u7EAA\u5FF5\u9986\u4FDD\u5B58\u539F\u8C8C"]
    ],
    [
      ["\u79BB\u706B\u6700\u8FDC\u7684\u4F4D\u7F6E", "\u94C3\u971C\u603B\u5750\u5728\u805A\u9910\u6700\u5916\u4FA7\uFF0C\u8BF4\u81EA\u5DF1\u5E76\u4E0D\u997F\u3002\u7897\u91CC\u7684\u6C64\u65E9\u5DF2\u51C9\u4E86\u3002", "\u4E3A\u5B83\u51C6\u5907\u9002\u6E29\u7684\u98DF\u7269", "\u966A\u5B83\u5750\u5230\u51C9\u723D\u7684\u5730\u65B9"],
      ["\u4E00\u76C6\u4E0D\u6015\u51B7\u7684\u82B1", "\u4E00\u76C6\u971C\u53F6\u8349\u5728\u94C3\u971C\u8EAB\u8FB9\u8212\u5C55\u5F00\u6765\u3002\u5B83\u60CA\u8BB6\u5730\u53D1\u73B0\u81EA\u5DF1\u7684\u4F4E\u6E29\u4E5F\u80FD\u5E2E\u52A9\u522B\u4EBA\u3002", "\u79CD\u4E00\u5C0F\u7247\u8010\u5BD2\u82D7\u5703", "\u7814\u7A76\u4E0D\u540C\u690D\u7269\u7684\u6E29\u5EA6\u559C\u597D"],
      ["\u5171\u4EAB\u7684\u6E29\u5BA4", "\u70EC\u56E2\u548C\u94C3\u971C\u90FD\u60F3\u7167\u6599\u5E7C\u82D7\uFF0C\u4F46\u4E00\u4E2A\u8BA9\u6C34\u592A\u70ED\uFF0C\u4E00\u4E2A\u8BA9\u6C34\u7ED3\u51B0\u3002", "\u5212\u5206\u51B7\u6696\u4E24\u4E2A\u89D2\u843D", "\u8BA9\u5B83\u4EEC\u8F6E\u6D41\u8C03\u8282\u6C34\u6E29"],
      ["\u9001\u4E0D\u51FA\u53BB\u7684\u971C\u82B1", "\u94C3\u971C\u60F3\u628A\u971C\u82B1\u9001\u7ED9\u670B\u53CB\uFF0C\u82B1\u5728\u51FA\u95E8\u524D\u5C31\u878D\u4E86\u3002\u5B83\u51B3\u5B9A\u4E0D\u518D\u9001\u793C\u3002", "\u505A\u4E00\u4E2A\u4FDD\u6E29\u7684\u5C0F\u74F6", "\u4E00\u8D77\u5236\u4F5C\u4E0D\u4F1A\u878D\u5316\u7684\u82B1\u5F62"],
      ["\u6709\u8FB9\u754C\u7684\u62E5\u62B1", "\u4F19\u4F34\u60F3\u62E5\u62B1\u94C3\u971C\uFF0C\u53C8\u88AB\u51B0\u5F97\u7F29\u56DE\u53BB\u3002\u5927\u5BB6\u4E00\u8D77\u627E\u51FA\u53CC\u65B9\u90FD\u8212\u670D\u7684\u8DDD\u79BB\u3002", "\u7F16\u4E00\u6761\u539A\u539A\u7684\u56F4\u5DFE", "\u7EA6\u5B9A\u8F7B\u8F7B\u78B0\u4E00\u4E0B\u989D\u5934"],
      ["\u51C9\u77F3\u8FB9\u7684\u5EA7\u4F4D", "\u9910\u684C\u65C1\u591A\u4E86\u4E00\u5757\u51C9\u77F3\u3002\u94C3\u971C\u7684\u5EA7\u4F4D\u7EC8\u4E8E\u4E0E\u5927\u5BB6\u5728\u4E00\u8D77\u3002", "\u628A\u51C9\u77F3\u523B\u4E0A\u6240\u6709\u4EBA\u7684\u540D\u5B57", "\u8BA9\u51C9\u77F3\u6210\u4E3A\u968F\u65F6\u5F00\u653E\u7684\u5EA7\u4F4D"]
    ],
    [
      ["\u5E8A\u4E0B\u7684\u706F", "\u591C\u706F\u660E\u660E\u53D1\u7740\u5149\uFF0C\u4ECD\u628A\u81EA\u5DF1\u85CF\u5728\u5E8A\u4E0B\u3002\u5B83\u8BF4\u770B\u4E0D\u5230\u7684\u5730\u65B9\u603B\u8BA9\u4EBA\u62C5\u5FC3\u3002", "\u966A\u5B83\u68C0\u67E5\u623F\u95F4\u7684\u89D2\u843D", "\u5750\u5728\u65C1\u8FB9\u542C\u5B83\u8BB2\u5BB3\u6015"],
      ["\u82B1\u56ED\u91CC\u7684\u5F71\u5B50", "\u4E00\u9635\u98CE\u8BA9\u6811\u5F71\u6643\u52A8\uFF0C\u591C\u706F\u5DEE\u70B9\u9003\u56DE\u5C4B\u91CC\uFF0C\u5374\u53D1\u73B0\u5F71\u5B50\u6765\u81EA\u81EA\u5DF1\u7684\u5C0F\u6811\u3002", "\u4E00\u8D77\u505A\u5F71\u5B50\u6E38\u620F", "\u7ED9\u719F\u6089\u7684\u6811\u7CFB\u4E0A\u94C3\u94DB"],
      ["\u7B2C\u4E00\u53EA\u8424\u706B\u866B", "\u8424\u706B\u866B\u505C\u5728\u591C\u706F\u7684\u7A97\u8FB9\uFF0C\u6CA1\u6709\u8981\u6C42\u5B83\u53D8\u5F97\u66F4\u4EAE\uFF0C\u53EA\u966A\u5B83\u5F85\u4E86\u4E00\u4F1A\u3002", "\u5728\u7A97\u8FB9\u51C6\u5907\u6C34\u8349", "\u628A\u8FD9\u4E00\u591C\u5199\u8FDB\u56DE\u5FC6\u518C"],
      ["\u7184\u706F\u7EC3\u4E60", "\u591C\u706F\u63D0\u51FA\u5173\u6389\u4E00\u76CF\u706F\uFF0C\u53EA\u5173\u4E00\u76CF\u3002\u4F19\u4F34\u4EEC\u5B89\u9759\u5750\u5728\u5B83\u8EAB\u65C1\u3002", "\u7531\u591C\u706F\u51B3\u5B9A\u4F55\u65F6\u7ED3\u675F", "\u4E00\u8D77\u6570\u542C\u5F97\u89C1\u7684\u58F0\u97F3"],
      ["\u8D70\u5728\u961F\u4F0D\u524D\u9762", "\u591C\u95F4\u8C03\u67E5\u7F3A\u5C11\u5E26\u8DEF\u7684\u4EBA\u3002\u591C\u706F\u4ECD\u5BB3\u6015\uFF0C\u5374\u4E3E\u624B\u8BF4\u81EA\u5DF1\u53EF\u4EE5\u8D70\u4E00\u5C0F\u6BB5\u3002", "\u8BA9\u4F19\u4F34\u8F6E\u6D41\u63A5\u529B", "\u5728\u719F\u6089\u8DEF\u6BB5\u7531\u5B83\u9886\u961F"],
      ["\u706F\u7167\u7740\u5F7C\u6B64", "\u8FD4\u56DE\u65F6\u591C\u706F\u8BF4\uFF0C\u81EA\u5DF1\u8FD8\u4F1A\u6015\uFF0C\u4F46\u73B0\u5728\u77E5\u9053\u5BB3\u6015\u65F6\u80FD\u53EB\u8C01\u7684\u540D\u5B57\u3002", "\u7ED9\u5B83\u4E00\u679A\u9886\u8DEF\u7EAA\u5FF5\u7AE0", "\u6536\u7559\u5E7C\u4F53\uFF0C\u8BA9\u5B83\u8BB2\u4ECA\u665A\u7684\u6545\u4E8B"]
    ],
    [
      ["\u72EC\u81EA\u5F52\u6765\u7684\u8DF3\u8DF3", "\u8DF3\u8DF3\u5E26\u56DE\u4E00\u80CC\u5305\u6750\u6599\uFF0C\u5374\u8BF4\u4E0D\u6E05\u9014\u4E2D\u89C1\u8FC7\u7684\u7F8E\u666F\u3002\u5B83\u603B\u662F\u8D76\u7740\u53BB\u4E0B\u4E00\u5904\u3002", "\u966A\u5B83\u6574\u7406\u65C5\u884C\u8BB0\u5F55", "\u9080\u8BF7\u5B83\u5E26\u4E00\u4F4D\u540C\u4F34\u51FA\u53D1"],
      ["\u843D\u4E0B\u7684\u961F\u53CB", "\u540C\u4F34\u5728\u5C94\u8DEF\u505C\u4E0B\u7814\u7A76\u690D\u7269\uFF0C\u8DF3\u8DF3\u8D70\u51FA\u5F88\u8FDC\u624D\u53D1\u73B0\u8EAB\u540E\u6CA1\u4EBA\u3002", "\u56DE\u5230\u6700\u540E\u4E00\u8D77\u505C\u7559\u5904", "\u7EA6\u5B9A\u6BCF\u4E2A\u5C94\u8DEF\u76F8\u4E92\u786E\u8BA4"],

    [["\u6700\u540E\u4E00\u4EFD\u70B9\u5FC3", "\u5B83\u603B\u628A\u81EA\u5DF1\u7684\u70B9\u5FC3\u8BA9\u51FA\u53BB\u3002", "\u805A\u9910\u7ED3\u675F\u540E\uFF0C\u5B83\u72EC\u81EA\u671B\u7740\u7A7A\u76D8\u5B50\u3002", "\u4F19\u4F34\u4E3A\u5B83\u7559\u4E86\u4E00\u4EFD\u559C\u6B22\u7684\u5473\u9053\uFF0C\u7167\u987E\u4E5F\u80FD\u53CC\u5411\u53D1\u751F\u3002"], ["\u75C5\u5F31\u7684\u5C0F\u82D7", "\u5B83\u628A\u5168\u90E8\u65F6\u95F4\u7528\u6765\u7167\u987E\u4E00\u682A\u5C0F\u82D7\u3002", "\u5176\u4ED6\u690D\u7269\u4E5F\u9700\u8981\u6D47\u6C34\uFF0C\u5B83\u6709\u4E9B\u75B2\u60EB\u3002", "\u5927\u5BB6\u5206\u5DE5\u7167\u6599\uFF0C\u5C0F\u82D7\u548C\u5B83\u90FD\u5F97\u5230\u4F11\u606F\u3002"], ["\u4E0D\u613F\u62D2\u7EDD", "\u5B83\u7B54\u5E94\u4E86\u592A\u591A\u5E2E\u5FD9\u8BF7\u6C42\u3002", "\u7EA6\u5B9A\u5728\u540C\u4E00\u5929\u5230\u671F\uFF0C\u5B83\u4E0D\u77E5\u9053\u5148\u505A\u54EA\u4E00\u4E2A\u3002", "\u4F60\u4EEC\u6392\u597D\u987A\u5E8F\uFF0C\u5B83\u7B2C\u4E00\u6B21\u8BF4\u51FA\u81EA\u5DF1\u9700\u8981\u7684\u65F6\u95F4\u3002"]],
    [["\u53F6\u7247\u7559\u8A00", "\u5B83\u628A\u60F3\u8BF4\u7684\u8BDD\u5199\u5728\u53F6\u7247\u80CC\u9762\u3002", "\u53F6\u7247\u88AB\u98CE\u5439\u6563\uFF0C\u8BDD\u8FD8\u6CA1\u9001\u5230\u670B\u53CB\u624B\u4E2D\u3002", "\u7559\u8A00\u677F\u7559\u51FA\u5B89\u9759\u7684\u4E00\u89D2\uFF0C\u5B83\u53EF\u4EE5\u6309\u81EA\u5DF1\u7684\u8282\u594F\u8868\u8FBE\u3002"], ["\u9759\u542C\u6C34\u58F0", "\u5B83\u6BCF\u5929\u5750\u5728\u6C34\u5858\u8FB9\u542C\u6C34\u58F0\u3002", "\u70ED\u95F9\u7684\u805A\u4F1A\u6765\u5230\u6C34\u8FB9\uFF0C\u5B83\u6084\u6084\u632A\u8FDC\u4E86\u3002", "\u5927\u5BB6\u4E3A\u805A\u4F1A\u548C\u5B89\u9759\u90FD\u7559\u4E86\u4F4D\u7F6E\uFF0C\u5B83\u5E26\u6765\u4E00\u6BB5\u65B0\u7684\u89C2\u5BDF\u3002"], ["\u65E0\u58F0\u7684\u9080\u8BF7", "\u5B83\u6446\u597D\u4E24\u53EA\u676F\u5B50\uFF0C\u5374\u4E00\u76F4\u6CA1\u6709\u5F00\u53E3\u9080\u8BF7\u3002", "\u670B\u53CB\u8DEF\u8FC7\u51E0\u6B21\uFF0C\u90FD\u4EE5\u4E3A\u5B83\u53EA\u662F\u5728\u6574\u7406\u684C\u5B50\u3002", "\u4E00\u5F20\u7B80\u5355\u7684\u9080\u8BF7\u5361\uFF0C\u8BA9\u4E24\u53EA\u676F\u5B50\u7EC8\u4E8E\u540C\u65F6\u88AB\u6367\u8D77\u6765\u3002"]],
    [["\u8FC7\u7EC6\u7684\u8BA1\u5212", "\u5B83\u628A\u65C5\u884C\u6BCF\u4E00\u6B65\u90FD\u5199\u4E86\u4E0B\u6765\u3002", "\u7A81\u7136\u7684\u4E00\u573A\u96E8\u6539\u53D8\u4E86\u9053\u8DEF\uFF0C\u5B83\u7AD9\u5728\u539F\u5730\u91CD\u65B0\u8BA1\u7B97\u3002", "\u8BA1\u5212\u91CC\u591A\u4E86\u53EF\u4EE5\u8C03\u6574\u7684\u7A7A\u767D\uFF0C\u96E8\u5929\u4E5F\u6709\u81EA\u5DF1\u7684\u53D1\u73B0\u3002"], ["\u6162\u6162\u4FEE\u597D", "\u5B83\u575A\u6301\u628A\u65E7\u6C34\u58F6\u4FEE\u5230\u5B8C\u5168\u4E0D\u6F0F\u3002", "\u540C\u4F34\u5DF2\u7ECF\u7528\u65B0\u58F6\u5F00\u59CB\u6D47\u6C34\uFF0C\u5B83\u89C9\u5F97\u81EA\u5DF1\u88AB\u843D\u4E0B\u3002", "\u65E7\u58F6\u6210\u4E3A\u80B2\u82D7\u4E13\u7528\u58F6\uFF0C\u7EC6\u81F4\u7EC8\u4E8E\u6709\u4E86\u5408\u9002\u7684\u4F4D\u7F6E\u3002"], ["\u4EE3\u7BA1\u7684\u4ED3\u5E93", "\u5B83\u8D1F\u8D23\u8BB0\u5F55\u5BB6\u56ED\u6750\u6599\u3002", "\u4E00\u4E2A\u6570\u91CF\u5BF9\u4E0D\u4E0A\uFF0C\u5B83\u53CD\u590D\u68C0\u67E5\u5230\u5F88\u665A\u3002", "\u5927\u5BB6\u4E00\u8D77\u627E\u5230\u9057\u6F0F\u7684\u9886\u53D6\u8BB0\u5F55\uFF0C\u8D23\u4EFB\u53EF\u4EE5\u5171\u540C\u6838\u5BF9\u3002"]],
    [["\u81EA\u5DF1\u7684\u9009\u62E9", "\u5B83\u603B\u8BF4\u90FD\u53EF\u4EE5\u3002", "\u8F6E\u5230\u5B83\u51B3\u5B9A\u79CD\u4EC0\u4E48\u65F6\uFF0C\u5B83\u4ECD\u628A\u76EE\u5F55\u63A8\u56DE\u4F60\u624B\u91CC\u3002", "\u4E00\u5C0F\u5757\u4E13\u5C5E\u82B1\u5703\u79CD\u4E0B\u4E86\u5B83\u771F\u6B63\u559C\u6B22\u7684\u82B1\u3002"], ["\u5199\u9519\u7684\u6807\u7B7E", "\u5B83\u62C5\u5FC3\u6807\u7B7E\u4E0A\u7684\u5B57\u4E0D\u591F\u6574\u9F50\u3002", "\u91CD\u5199\u4E86\u51E0\u904D\uFF0C\u79CD\u5B50\u4ECD\u5728\u7B49\u7740\u64AD\u79CD\u3002", "\u624B\u5199\u6807\u7B7E\u88AB\u5927\u5BB6\u8BA4\u771F\u4FDD\u7559\uFF0C\u613F\u610F\u5C1D\u8BD5\u6BD4\u5B57\u8FF9\u66F4\u73CD\u8D35\u3002"], ["\u65B0\u7684\u89C4\u5219", "\u5B83\u4E25\u683C\u6309\u7167\u65E7\u8BF4\u660E\u7167\u6599\u690D\u7269\u3002", "\u6742\u4EA4\u690D\u7269\u7684\u4E60\u6027\u4E0D\u540C\uFF0C\u8BF4\u660E\u5F00\u59CB\u4E0D\u7BA1\u7528\u4E86\u3002", "\u5B83\u5199\u4E0B\u7B2C\u4E00\u6761\u81EA\u5DF1\u7684\u89C2\u5BDF\uFF0C\u89C4\u5219\u4E5F\u80FD\u4ECE\u7ECF\u9A8C\u751F\u957F\u3002"]],
    [["\u85CF\u8D77\u6765\u7684\u6C34\u58F6", "\u5B83\u628A\u6C34\u58F6\u85CF\u8FDB\u6811\u6D1E\u60F3\u9017\u5927\u5BB6\u3002", "\u4F19\u4F34\u627E\u4E0D\u5230\u5DE5\u5177\uFF0C\u9519\u8FC7\u4E86\u7167\u6599\u7EA6\u5B9A\u3002", "\u5B83\u505A\u4E86\u4E00\u5F20\u5BFB\u5B9D\u5730\u56FE\uFF0C\u5E76\u5728\u6E38\u620F\u7ED3\u675F\u540E\u5F52\u8FD8\u5DE5\u5177\u3002"], ["\u4F1A\u54CD\u7684\u82B1\u76C6", "\u5B83\u5728\u82B1\u76C6\u4E0B\u9762\u653E\u4E86\u5C0F\u94C3\u3002", "\u94C3\u58F0\u5413\u5230\u4E86\u521A\u6765\u7684\u5E7C\u4F53\u3002", "\u4F60\u4EEC\u628A\u94C3\u79FB\u5230\u6E38\u620F\u533A\uFF0C\u5E7C\u4F53\u4E5F\u80FD\u51B3\u5B9A\u662F\u5426\u53C2\u52A0\u3002"], ["\u5047\u88C5\u8FF7\u8DEF", "\u5B83\u60F3\u8BA9\u670B\u53CB\u6765\u627E\u81EA\u5DF1\u3002", "\u670B\u53CB\u771F\u7684\u62C5\u5FC3\u8D77\u6765\uFF0C\u73A9\u7B11\u53D8\u5F97\u6C89\u91CD\u3002", "\u5B83\u5B66\u4F1A\u76F4\u63A5\u8BF4\u60F3\u4E00\u8D77\u73A9\uFF0C\u9080\u8BF7\u6BD4\u60CA\u5413\u66F4\u6709\u8DA3\u3002"]],
    [["\u95E8\u5916\u7684\u811A\u6B65", "\u964C\u751F\u8BBF\u5BA2\u6765\u5230\u95E8\u524D\uFF0C\u5B83\u8EB2\u8FDB\u5C4B\u91CC\u3002", "\u8BBF\u5BA2\u7559\u4E0B\u4E00\u7C92\u79CD\u5B50\uFF0C\u7B2C\u4E8C\u5929\u8FD8\u4F1A\u6765\u3002", "\u5B83\u9694\u7740\u7A97\u4ECB\u7ECD\u81EA\u5DF1\u7684\u690D\u7269\uFF0C\u4EA4\u670B\u53CB\u53EF\u4EE5\u5F88\u6162\u3002"], ["\u8FC7\u6865\u7EC3\u4E60", "\u5B83\u5728\u5C0F\u6865\u524D\u505C\u4F4F\u4E86\u3002", "\u6BCF\u6B21\u9760\u8FD1\u6865\u5934\uFF0C\u8EAB\u4F53\u90FD\u4F1A\u8F7B\u8F7B\u53D1\u6296\u3002", "\u540C\u4F34\u94FA\u597D\u6276\u624B\uFF0C\u966A\u5B83\u4E00\u6B65\u4E00\u6B65\u8D70\u5B8C\u3002"], ["\u591C\u91CC\u7684\u54CD\u58F0", "\u5C4B\u540E\u4F20\u6765\u6C99\u6C99\u58F0\u3002", "\u5B83\u4EE5\u4E3A\u6709\u602A\u7269\uFF0C\u4F19\u4F34\u63D0\u8BAE\u4E00\u8D77\u8C03\u67E5\u3002", "\u58F0\u97F3\u6765\u81EA\u523A\u732C\uFF0C\u5B83\u4E3A\u65B0\u8BBF\u5BA2\u51C6\u5907\u4E86\u4E00\u7897\u6C34\u3002"]],
    [["\u6084\u6084\u505A\u7684\u793C\u7269", "\u5B83\u8BF4\u624D\u6CA1\u6709\u51C6\u5907\u793C\u7269\u3002", "\u62BD\u5C49\u91CC\u5374\u85CF\u7740\u4E00\u6761\u7F1D\u4E86\u4E00\u534A\u7684\u56F4\u5DFE\u3002", "\u670B\u53CB\u6536\u4E0B\u56F4\u5DFE\u65F6\u6CA1\u6709\u62C6\u7A7F\u5B83\uFF0C\u53EA\u8BA4\u771F\u8BF4\u4E86\u8C22\u8C22\u3002"], ["\u4E0D\u80AF\u6C42\u52A9", "\u5B83\u642C\u4E0D\u52A8\u4E00\u5757\u5927\u77F3\u5934\u3002", "\u51E0\u6B21\u5931\u8D25\u540E\u4ECD\u8BF4\u81EA\u5DF1\u53EA\u662F\u5728\u4F11\u606F\u3002", "\u5927\u5BB6\u4ECE\u53E6\u4E00\u4FA7\u62AC\u8D77\u77F3\u5934\uFF0C\u5B83\u4E5F\u627F\u8BA4\u4E24\u4E2A\u4EBA\u66F4\u5FEB\u3002"], ["\u597D\u5403\u7684\u70B9\u5FC3", "\u5B83\u5C1D\u5230\u559C\u6B22\u7684\u70B9\u5FC3\uFF0C\u5374\u6545\u610F\u8BF4\u4E00\u822C\u3002", "\u53A8\u5E08\u51C6\u5907\u6362\u83DC\u5355\uFF0C\u5B83\u7A81\u7136\u7740\u6025\u8D77\u6765\u3002", "\u4E00\u53E5\u5C0F\u5C0F\u7684\u559C\u6B22\uFF0C\u7EC8\u4E8E\u8BA9\u70B9\u5FC3\u7559\u5728\u4E86\u83DC\u5355\u4E0A\u3002"]],
    [["\u592A\u591A\u7684\u9080\u8BF7", "\u5B83\u4E00\u5929\u5B89\u6392\u4E86\u4E09\u573A\u6D3B\u52A8\u3002", "\u4F19\u4F34\u5F00\u59CB\u75B2\u60EB\uFF0C\u5B83\u8FD8\u60F3\u7EE7\u7EED\u3002", "\u6D3B\u52A8\u8868\u52A0\u4E0A\u4F11\u606F\u95F4\u9694\uFF0C\u70ED\u95F9\u4E5F\u80FD\u8BA9\u4EBA\u8212\u670D\u3002"], ["\u8DD1\u4E22\u7684\u79CD\u5B50", "\u5B83\u62B1\u7740\u79CD\u5B50\u4E00\u8DEF\u8DF3\u8DC3\u3002", "\u79CD\u5B50\u6563\u5728\u8DEF\u8FB9\uFF0C\u9700\u8981\u4E00\u9897\u9897\u627E\u56DE\u6765\u3002", "\u4F60\u4EEC\u505A\u4E86\u5E26\u76D6\u7684\u79CD\u5B50\u888B\uFF0C\u4E0B\u4E00\u6B21\u8DF3\u8DC3\u4ECD\u7136\u5FEB\u4E50\u3002"], ["\u5B89\u9759\u7684\u670B\u53CB", "\u5B83\u60F3\u8BA9\u5B89\u9759\u7684\u4F19\u4F34\u4E5F\u52A0\u5165\u6E38\u620F\u3002", "\u8FDE\u7EED\u9080\u8BF7\u8BA9\u5BF9\u65B9\u6709\u4E9B\u9000\u7F29\u3002", "\u5B83\u51C6\u5907\u4E86\u65C1\u89C2\u7684\u4F4D\u7F6E\uFF0C\u670B\u53CB\u540E\u6765\u4E3B\u52A8\u52A0\u5165\u4E00\u5C0F\u4F1A\u3002"]],
    [["\u5206\u5F00\u7684\u4E0B\u5348", "\u4F60\u51C6\u5907\u51FA\u95E8\uFF0C\u5B83\u7D27\u7D27\u8DDF\u7740\u3002", "\u5BB6\u56ED\u91CC\u4E5F\u6709\u559C\u6B22\u5B83\u7684\u4F19\u4F34\uFF0C\u5B83\u5374\u4E0D\u6562\u7559\u4E0B\u3002", "\u7EA6\u597D\u56DE\u6765\u7684\u65F6\u95F4\u540E\uFF0C\u5B83\u5F00\u59CB\u62E5\u6709\u81EA\u5DF1\u7684\u4E0B\u5348\u3002"], ["\u7B2C\u4E8C\u4E2A\u670B\u53CB", "\u5B83\u62C5\u5FC3\u4F60\u559C\u6B22\u65B0\u4F19\u4F34\u66F4\u591A\u3002", "\u805A\u9910\u65F6\u5B83\u4E00\u76F4\u6324\u5728\u4F60\u65C1\u8FB9\u3002", "\u4E00\u8D77\u7167\u6599\u5C0F\u82D7\u8BA9\u5B83\u53D1\u73B0\uFF0C\u5173\u7CFB\u53EF\u4EE5\u540C\u65F6\u589E\u52A0\u3002"], ["\u7EAA\u5FF5\u7684\u5C0F\u77F3\u5934", "\u5B83\u60F3\u628A\u6BCF\u6B21\u4E00\u8D77\u6361\u5230\u7684\u77F3\u5934\u90FD\u5E26\u7740\u3002", "\u80CC\u5305\u8D8A\u6765\u8D8A\u91CD\uFF0C\u5B83\u5374\u820D\u4E0D\u5F97\u653E\u4E0B\u3002", "\u7EAA\u5FF5\u67B6\u4FDD\u5B58\u4E86\u5171\u540C\u7ECF\u5386\uFF0C\u51FA\u95E8\u65F6\u53EF\u4EE5\u8F7B\u677E\u4E00\u4E9B\u3002"]],
    [["\u95E8\u53E3\u7684\u6C34\u679C", "\u5B83\u770B\u4F3C\u4E0D\u5728\u610F\u522B\u4EBA\uFF0C\u5374\u5728\u95E8\u53E3\u7559\u4E0B\u6C34\u679C\u3002", "\u4F19\u4F34\u4E0D\u77E5\u9053\u6C34\u679C\u662F\u8C01\u9001\u7684\uFF0C\u60F3\u5F53\u9762\u9053\u8C22\u3002", "\u4F60\u4EEC\u7559\u4E0B\u4E00\u5F20\u56DE\u4FE1\uFF0C\u5B83\u6CA1\u6709\u5426\u8BA4\u4E5F\u6CA1\u6709\u79BB\u5F00\u3002"], ["\u5E76\u80A9\u5DE5\u4F5C", "\u5B83\u559C\u6B22\u72EC\u81EA\u505A\u4E8B\u3002", "\u4E00\u6839\u957F\u6728\u677F\u9700\u8981\u4E24\u4EBA\u62AC\uFF0C\u5B83\u72B9\u8C6B\u4E86\u3002", "\u4E00\u6B21\u7B80\u5355\u914D\u5408\u7ED3\u675F\u540E\uFF0C\u5B83\u4E3B\u52A8\u7559\u4E0B\u4E0B\u4E00\u6B21\u7684\u65F6\u95F4\u3002"], ["\u4E0D\u4E60\u60EF\u7684\u79F0\u8D5E", "\u5927\u5BB6\u5938\u5B83\u89C2\u5BDF\u7EC6\u81F4\u3002", "\u5B83\u628A\u5934\u8F6C\u5F00\uFF0C\u5374\u4E00\u76F4\u4FDD\u5B58\u7740\u90A3\u5F20\u8BB0\u5F55\u3002", "\u7EAA\u5FF5\u518C\u7ED9\u51FA\u5177\u4F53\u7684\u8D21\u732E\uFF0C\u5B83\u6162\u6162\u63A5\u53D7\u81EA\u5DF1\u7684\u4EF7\u503C\u3002"]],

function summonerNeed(lv){ return 10 + lv * 6; }
function staminaMax(s){ return Math.round(80 + (s.size || 1) * 40); }

/* 魔物与伙伴共用属性公式；取消原来叠加在敌人成长上的 ×2，修正高层数值失衡。 */
function monMul(s){ return 1; }

function hpMax(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bhp') + traitBonus(s,'ball');
  return Math.round((100 * (s.size || 1) + (s.str || 0) * 3 * m + (s.level || 1) * 10) * personaMul(s,'hp') * bonus);
}
function physAtk(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'batk') + traitBonus(s,'ball');
  return Math.round((s.str * 2 * m + s.level * 3) * personaMul(s,'atk') * bonus);
}
function magAtk(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bmatk') + traitBonus(s,'ball');
  return Math.round((s.mag * 2 * m + s.level * 3) * personaMul(s,'matk') * bonus);
}
function atkSpeed(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bspd') + traitBonus(s,'ball');
  return Math.round((100 + s.agi * m) * personaMul(s,'speed') * bonus);
}
function dodgeRate(s){
  const agi = s.agi * monMul(s);
  const base = agi / (agi + 60) * 100 * 0.2;
  let add = (traitBonus(s,'bdodge') + traitBonus(s,'ball')) * 100;
  if(s.element === '风') add += 20;
  return clamp(Math.round(base + add), 0, 70);
}
function critRate(s){
  const luck = (s.luck||0) * monMul(s);
  const base = luck / (luck + 80) * 100;
  const add = (traitBonus(s,'bcrit') + traitBonus(s,'ball')) * 100;
  return clamp(Math.round(base + add), 0, 30);
}
function manaMax(s){
  const bonus = 1 + traitBonus(s,'bmana') + traitBonus(s,'ball');
  return Math.round(s.mag * 10 * monMul(s) * bonus);
}
/* 攻击类型（参考《宝可梦》物理/特殊分离）：物理系用物攻打防御，其余元素用魔攻打抗性。 */
const PHYSICAL_ELEMENTS = ['岩','风','草','暗'];
function damageType(s){ return PHYSICAL_ELEMENTS.includes(s && s.element) ? 'phys' : 'mag'; }
function attackPower(s){ return damageType(s) === 'phys' ? physAtk(s) : magAtk(s); }
function defense(s){ return Math.round((Number(s.str)||0) * 0.6 + (Number(s.level)||1) * 3); }
function resist(s){ return Math.round((Number(s.mag)||0) * 0.6 + (Number(s.level)||1) * 3); }
/* 减伤：常数随攻击者等级增长，
   这样同级对战的减伤比例在 1–50 级都稳定在 40% 左右，不会高等级时刮痧。 */
function mitigation(attacker, target){
  const def = damageType(attacker) === 'phys' ? defense(target) : resist(target);
  const k = 40 + 8 * (Number(attacker.level)||1);
  return k / (k + Math.max(0, def));
}
function loadCap(s){ return s.str * 5; }
function expRate(s){ return 1 + (s.wit||0) * 0.02; }
function skillApt(s){ return s.wit||0; }

function slimePower(s){
  return Math.round(
    physAtk(s) + magAtk(s) + hpMax(s) * 0.5 + atkSpeed(s) * 0.3 + (defense(s) + resist(s)) * 0.5 +
    dodgeRate(s) * 2 + critRate(s) * 2 + manaMax(s) * 0.1
  );
}

function validSaveData(d){
  if(!d || typeof d !== 'object' || Array.isArray(d) || typeof d.started!=='boolean' || !Array.isArray(d.slimes)) return false;
  const safeTree=value=>{
    if(!value || typeof value!=='object') return true;
    return Object.keys(value).every(k=>!['__proto__','prototype','constructor'].includes(k) && safeTree(value[k]));
  };
  if(!safeTree(d)) return false;
  if(Number(d.saveVersion)>4 || (d.saveVersion>=3 && (!d.world||d.world.version!==d.saveVersion))) return false;
  if(d.saveVersion===4 && ['bag','feedTrough'].some(k=>Object.prototype.hasOwnProperty.call(d,k))) return false;
  if(d.world!==undefined && !LivingWorld.validWorld(d.world,d.slimes.map(s=>s.id))) return false;
  const number=(obj,k,min=0,integer=false)=>obj[k]===undefined || (typeof obj[k]==='number' && Number.isFinite(obj[k]) && obj[k]>=min && (!integer || Number.isInteger(obj[k])));
  for(const k of ['coins','points','summonerExp','totalEarned','feedTrough','stackRecord','lastActive']) if(!number(d,k)) return false;
  for(const k of ['level','abyssLevel','abyssUnlocked','seq']) if(!number(d,k,1,true)) return false;
  for(const k of ['nameSeq','exploreMapIndex','saveVersion','summonPity','sweepUsed','planClock']) if(!number(d,k,0,true)) return false;
  if(d.planClock !== undefined && d.planClock >= 12) return false;
  if(d.monsters !== undefined && !Array.isArray(d.monsters)) return false;
  for(const k of ['bag','tasks','taskClaimed','customPlans','progress']) if(d[k]!==undefined && (!d[k] || typeof d[k]!=='object' || Array.isArray(d[k]))) return false;
  if(d.bag && !Object.values(d.bag).every(v=>typeof v==='number' && Number.isFinite(v) && v>=0)) return false;
  if(d.progress){
    for(const key of ['abyssClears','challengeClears','regions','collected','claimed']){
      const record=d.progress[key];
      if(record!==undefined && (!record || typeof record!=='object' || Array.isArray(record))) return false;
      if(record && !Object.values(record).every(v=>key==='regions' ? typeof v==='number' && Number.isFinite(v) && v>=0 : typeof v==='boolean')) return false;
    }
  }

  const ids=new Set();
  return [...d.slimes,...(d.monsters||[])].every(s=>{
    if(!s || typeof s!=='object' || Array.isArray(s) || !Number.isInteger(s.id) || s.id<1 || ids.has(s.id) || typeof s.name!=='string' || !Object.prototype.hasOwnProperty.call(ELEMENTS,s.element)) return false;
    ids.add(s.id);

    for(const k of ['strPotential','agiPotential','magPotential','luck','wit','str','agi','mag','mood','stamina','hp','exp','intimacy','mergeCount']) if(!number(s,k)) return false;

    return true;
  });
}

      normalizeSlime(s);
      s.isMonster = true;
      if(typeof s.monSat !== 'number') s.monSat = rnd(18,58);
      if(typeof s.monLight !== 'number') s.monLight = rnd(14,34);
      if(typeof s.hp !== 'number') s.hp = hpMax(s);
    });
    S.seq=Math.max(S.seq||1,...[...S.slimes,...S.monsters].map(s=>s.id+1));
    if(fromVersion<4){
      const away=!DIAGNOSTIC_MODE&&S.started&&S.lastActive>0?Math.floor(clamp(Date.now()-S.lastActive,0,43200000)/1000):0;
      LivingWorld.prepareLegacy(S);
      if(away)advanceWorld(away,true);
      const preset=Array.isArray(S.exploreTeam)?S.exploreTeam.slice():S.slimes.filter(hasExplorePlan).map(s=>s.id);
      S.legacyTeamPreset=preset;S.globalPlan=null;S.customPlans={};S.slimes.forEach(s=>s.resting=false);
      LivingWorld.upgradeWorld(S.world,S.slimes,fromVersion,Date.now());S.saveVersion=4;LivingWorld.attachLegacyInventory(S);
      const mapping=[0,3,4];for(let old=0;old<3;old++)if((S.progress?.regions?.[old]??0)>0)for(let route=0;route<3;route++){const key=mapping[old]+':'+route;if(!S.world.familiar.includes(key))S.world.familiar.push(key);}
      S.lastActive=Math.max(S.lastActive||0,Date.now());
      S.world.notices.unshift('旧派遣已结清并回家，队伍预设保留。欢迎一起经营这个家。');
    }else{LivingWorld.ensure(S);S.world.activities=Object.fromEntries(Object.entries(S.world.activities).filter(([,a])=>a.ref==='mini'));}
    if(!LivingWorld.validWorld(S.world,S.slimes.map(s=>s.id)))throw new Error('迁移后的存档无效');
    if(fromVersion<4&&!DIAGNOSTIC_MODE&&!save())throw new Error('迁移无法保存');
    return true;
  }catch(e){
    const restored=JSON.parse(previous); delete S.bag;delete S.feedTrough;Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,restored);LivingWorld.ensure(S);
    persistenceBlocked=true; persistenceWarning='现有存档无法安全读取，已停止自动写入以保护原始数据。';
    return false;
  }
}

function normalizeSlime(s){
  delete s.hunger;
  if(typeof s.locked !== 'boolean') s.locked = false;
  if(!Number.isFinite(s.mergeCount) || s.mergeCount < 0) s.mergeCount = 0;
  else s.mergeCount = Math.floor(s.mergeCount);
  if(s.resting === undefined) s.resting = false;
  if(typeof s.mood !== 'number') s.mood = 70;
  if(typeof s.size !== 'number') s.size = 1;
  if(typeof s.intimacy !== 'number') s.intimacy = 0;
  // Fill each absent legacy field independently; never overwrite a present potential/stat.
  for(const key of ['strPotential','agiPotential','magPotential']) if(typeof s[key]!=='number') s[key]=10;
  if(typeof s.luck !== 'number') s.luck = 0;
  if(typeof s.wit !== 'number') s.wit = 0;
  if(typeof s.level !== 'number') s.level = 1;
  if(typeof s.exp !== 'number') s.exp = 0;
  if(typeof s.morality !== 'number') s.morality = 0;
  const lv = s.level;
  if(typeof s.str !== 'number') s.str = growthStat(s.strPotential, lv);
  if(typeof s.agi !== 'number') s.agi = growthStat(s.agiPotential, lv);
  if(typeof s.mag !== 'number') s.mag = growthStat(s.magPotential, lv);
  const stMax = staminaMax(s);
  if(typeof s.stamina !== 'number') s.stamina = stMax;
  s.stamina = clamp(s.stamina, 0, stMax);
  if(typeof s.hp !== 'number' || s.hp <= 0) s.hp = hpMax(s);
  if(!s.traits) s.traits = [];
  s.traits.forEach(refreshTraitDesc);
  if(!s.personality) s.personality = pick(PERSONALITIES);
  if(s.isMonster){
    if(typeof s.monSat !== 'number') s.monSat = rnd(18,58);
    if(typeof s.monLight !== 'number') s.monLight = rnd(14,34);
  }
  if(!s.skill){
    s.skill = HEAL_ELEMENTS.includes(s.element) ? '治疗' : '元素弹';
  }
  return s;
}

function checkDailyReset(silent){
  const today = todayKey();
  if(S.taskDate !== today){
    S.taskDate = today;
    S.tasks = {};
    S.taskClaimed = {};
    Object.keys(TASK_DEFS).forEach(k=>{ S.tasks[k] = 0; S.taskClaimed[k] = false; });
    S.sweepUsed = 0;
    if(!silent) save();
  }
  Object.keys(TASK_DEFS).forEach(k=>{
    if(S.tasks[k] === undefined) S.tasks[k] = 0;
    if(S.taskClaimed[k] === undefined) S.taskClaimed[k] = false;
  });
}
function addTaskProgress(key, n, silent){
  checkDailyReset(silent);
  S.tasks[key] = (S.tasks[key]||0) + n;
  if(!S.taskClaimed[key]){
    const def = TASK_DEFS[key];
    if(S.tasks[key] >= def.need){
      S.taskClaimed[key] = true;
      S.points += def.reward;
      if(!silent){
        toast(`系统任务完成：${def.name}\n获得 ${def.reward} 系统积分`, 'good');
        save(); renderTop();
        if(activeTab==='status') renderTab();
      }
    }
  }
}

function calcTalent(s){
  return s.strPotential + s.agiPotential + s.magPotential + (s.luck||0) + (s.wit||0) + Math.round(20 * s.size);
}

function slimeColor(s){
  if(s.colorOverride) return s.colorOverride;
  if(s.isMonster){
    if(typeof s.monSat !== 'number') s.monSat = rnd(18,58);
    if(typeof s.monLight !== 'number') s.monLight = rnd(14,34);
    return {h: ELEMENTS[s.element] ? ELEMENTS[s.element].h : 280, s:s.monSat, l:s.monLight};
  }
  const el = ELEMENTS[s.element] || ELEMENTS['空间'];
  const talent = calcTalent(s);
  const h = el.h;
  const sat = clamp((44 + talent*0.34) * el.sat, 12, 96);
  let lig = clamp(38 + (s.morality+100)/200*20 + talent*0.09, 20, 84);
  if(s.element === '暗') lig = clamp(lig - 28, 6, 34);
  return {h, s:sat, l:lig};
}
function eyeColor(s){
  if(s.isMonster) return {h: ELEMENTS[s.element] ? ELEMENTS[s.element].h : 280, s:10, l:50};
  const c = slimeColor(s);
  if(s.element === '暗') return {h:c.h, s:Math.min(c.s*.7,60), l:24};
  return {h:c.h, s:Math.min(c.s*.85,80), l:20};
}

function slimeHTMLFromColor(c,e,opts={}){
  const sz = opts.sz || 1;
  const ghost = (opts.element === '时间' || opts.element === '空间') ? 1 : 0;
  const dead = opts.dead ? 1 : 0;
  return `<div class="slime" data-mood="${opts.mood||'idle'}" data-dead="${dead}" data-ghost="${ghost}" data-el="${opts.element||'sys'}"
    style="--h:${c.h};--s:${c.s.toFixed(1)}%;--l:${c.l.toFixed(1)}%;--eh:${e.h};--es:${e.s.toFixed(1)}%;--el:${e.l}%;--sz:${sz.toFixed(2)}">
    <div class="shadow"></div>
    <div class="anim">
      <div class="breath">
        <div class="blob outer"></div>
        <div class="blob inner"></div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mark"></div>
        <div class="fx"></div>
      </div>
      <div class="halo"><span class="fh fh1">🌸</span><span class="fh fh2">✿</span></div>
    </div>
    ${opts.traitBadge ? '<div class="mon-badge">!</div>' : ''}
  </div>`;
}
function slimeHTML(s,opts={}){
  const sz = clamp(s.size || 1, 0.6, 1.6);
  const dead = (opts.dead !== undefined ? opts.dead : (s.hp !== undefined && s.hp <= 0));
  if(s && s.isSystem){
    return slimeHTMLFromColor(
      {h:S.sysLook.h, s:S.sysLook.s, l:S.sysLook.l},
      {h:S.sysLook.eh, s:S.sysLook.es, l:S.sysLook.el},
      {mood:opts.mood, sz, dead:false, traitBadge:!!opts.traitBadge}
    );
  }
  return slimeHTMLFromColor(slimeColor(s), eyeColor(s), {
    ...opts, sz, dead, element: s.element,
    traitBadge: !!opts.traitBadge
  });
}
function lookHTML(look,opts={}){
  return slimeHTMLFromColor({h:look.h,s:look.s,l:look.l},{h:look.eh,s:look.es,l:look.el},{...opts, sz:1});
}

function traitBonus(s,key){
  if(!s.traits) return 0;
  return s.traits.filter(t=>t.k===key).reduce((a,t)=>a+t.v, 0);
}

function slimeExpNeed(level){ return 100 + level*80; }

function addSummonerExp(amount, silent){
  if(S.breakPending) return;
  if(amount <= 0) return;
  S.summonerExp += amount;
  let guard = 0;
  while(S.summonerExp >= summonerNeed(S.level) && guard++ < 100){
    S.summonerExp -= summonerNeed(S.level);
    S.level++;
    if(S.level % 10 === 0){
      S.breakPending = true;
      S.summonerExp = 0;
      if(!silent) toast(`👑 召唤师达到 Lv.${S.level}！\n需要手动突破才能继续升级`, 'good');
      break;
    }
  }
}

function getPlan(id){
  if(S.customPlans[id]) return S.customPlans[id];
  if(S.globalPlan) return {type:S.globalPlan, global:true};
  return null;
}
function isDispatched(s){
  if(LivingWorld.isBusy(S,s.id)) return true;
  const plan = getPlan(s.id);
  if(!plan) return false;
  if(s.resting) return false;
  if(plan.global && plan.type === 'explore' && S.exploreTeam !== null){
    return S.exploreTeam.includes(s.id);
  }
  return true;
}

/* ==================== 探险物品系统 ==================== */
function stopExploreItems(){
  exploreRunning = false;
  if(exploreRAF){ cancelAnimationFrame(exploreRAF); exploreRAF = null; }
  if(exploreSpawnTimer){ clearInterval(exploreSpawnTimer); exploreSpawnTimer = null; }
  exploreItems = [];
  exploreLayer = null;
  exploreLastT = 0;
}

function startExploreItems(){
  stopExploreItems();
  const scene = document.querySelector('.explore-scene');
  if(!scene) return;
  /* 没有史莱姆在探险时，不生成任何物品 */
  if(!S.slimes.some(s=>isDispatched(s))) return;
  let layer = scene.querySelector('.explore-items-layer');
  if(!layer){
    layer = document.createElement('div');
    layer.className = 'explore-items-layer';
    scene.appendChild(layer);
  }
  exploreLayer = layer;
  exploreItems = [];
  exploreLastT = 0;
  exploreRunning = true;

  exploreSpawnTimer = setInterval(()=>{
    if(!exploreRunning) return;
    if(!layer.isConnected){ stopExploreItems(); return; }
    spawnExploreItem(layer);
  }, 5000 + Math.random()*4000);

  exploreRAF = requestAnimationFrame(function loop(t){
    if(!exploreRunning) return;
    if(!exploreLastT) exploreLastT = t;
    const dt = Math.min(0.05, (t - exploreLastT)/1000);
    exploreLastT = t;
    updateExploreItems(dt);
    exploreRAF = requestAnimationFrame(loop);
  });
}

function makeExploreMonster(){
  const lv = 1 + Math.floor(Math.random()*10);
  const element = pick(ELEMENT_KEYS);
  const strPot = rndInt(12,26), agiPot = rndInt(12,26), magPot = rndInt(12,26);
  const luck = rndInt(3,14), wit = rndInt(3,14);
  const size = +(0.66 + Math.random()*0.34).toFixed(2);
  const mon = {
    id: -1, name: `${element}魔物`, element, isMonster:true, level:lv, size,
    str: strPot*lv, agi: agiPot*lv, mag: magPot*lv,
    strPotential:strPot, agiPotential:agiPot, magPotential:magPot,
    luck, wit, personality:'调皮', morality:-50, traits:[],
    monSat: rnd(18,58), monLight: rnd(14,34),
    stamina:100, mood:50, intimacy:0, resting:false, exp:0
  };
  mon.hp = hpMax(mon);
  return mon;
}

function spawnExploreItem(layer){
  if(!layer || !layer.isConnected) return;
  const r = Math.random();
  let type;
  if(r < 0.40) type = 'coin';
  else if(r < 0.60) type = 'exp';
  else if(r < 0.80) type = 'food';
  else if(r < 0.88) type = 'point';
  else if(r < 0.96) type = 'monster';
  else type = 'treasure';

  const el = document.createElement('div');
  el.className = 'explore-item explore-item-' + type;
  const x = 100;
  const y = 67 + Math.random()*13;
  el.style.left = x + '%';
  el.style.top = y + '%';

  let monster = null;
  let value = 0;

  if(type === 'monster'){
    monster = makeExploreMonster();
    const scale = 0.18;
    const w = 26, h = 22;
    const isJump = Math.random() < 0.5;
    el.innerHTML = `<div class="explore-slime explore-monster ${isJump?'jumping':'walking'}"
      style="width:${w}px;height:${h}px;--ex-scale:${scale};--delay:0s;"
      data-next-toggle="0">
      ${slimeHTML(monster,{mood:'idle'})}
    </div>`;
  } else {
    const icons = {coin:'coin',exp:'potion',food:'food',point:'star',treasure:'gem'};
    el.innerHTML = `<span class="ei-icon">${uiIcon(icons[type])}</span>`;
    if(type==='coin') value = rndInt(30,80);
    else if(type==='exp') value = rndInt(20,50);
    else if(type==='food') value = 1;
    else if(type==='point') value = rndInt(1,2);
    else if(type==='treasure') value = 1;
  }

  layer.appendChild(el);
  exploreItems.push({
    el, type, x, y, speed: 8 + Math.random()*6,
    monster, value, fleeing:false, fleeVx:0, fleeVy:0, fleeAngle:0
  });
}

function rectsIntersect(a, b){
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function triggerMonsterReactions(monster, slimeRects){
  if(!monster || !slimeRects || !slimeRects.length) return;
  const monPower = slimePower(monster);
  const arr = slimeRects;
  arr.forEach((sr, idx)=>{
    if(Math.random() < 0.25){
      const slimeEl = sr.el.querySelector('.slime');
      if(!slimeEl) return;
      slimeEl.dataset.mood = 'fear';
      setTimeout(()=>{ if(slimeEl.isConnected) slimeEl.dataset.mood = 'idle'; }, 1600);
      if(slimePower(sr.s) > monPower){
        let nIdx = idx + (Math.random() < 0.5 ? -1 : 1);
        if(nIdx < 0) nIdx = idx + 1;
        if(nIdx >= arr.length) nIdx = idx - 1;
        if(nIdx >= 0 && nIdx < arr.length){
          const nEl = arr[nIdx].el.querySelector('.slime');
          if(nEl){
            nEl.dataset.mood = 'deadpan';
            setTimeout(()=>{ if(nEl.isConnected) nEl.dataset.mood = 'idle'; }, 1600);
          }
        }
      }
    }
  });
}

function updateExploreItems(dt){
  const scene = document.querySelector('.explore-scene');
  if(!scene){ stopExploreItems(); return; }
  const slimeEls = scene.querySelectorAll('.explore-slime');
  const slimeRects = [];
  slimeEls.forEach(el=>{
    if(el.closest('.explore-item')) return;
    const r = el.getBoundingClientRect();
    if(r.width === 0) return;
    const sid = +el.dataset.sid;
    const s = getSlime(sid);
    if(!s) return;
    slimeRects.push({el, sid, s, rect:r});
  });

  for(let i = exploreItems.length - 1; i >= 0; i--){
    const item = exploreItems[i];
    if(!item.el.isConnected){ exploreItems.splice(i,1); continue; }

    if(item.fleeing){
      item.x += item.fleeVx * dt;
      item.y += item.fleeVy * dt;
      item.fleeAngle += 540 * dt;
      item.el.style.left = item.x + '%';
      item.el.style.top = item.y + '%';
      const inner = item.el.querySelector('.explore-slime');
      if(inner){
        inner.style.animation = 'none';
        inner.style.transformOrigin = 'center center';
        inner.style.transform = `rotate(${item.fleeAngle}deg)`;
      }
      if(item.x > 130 || item.y < -40){
        item.el.remove();
        exploreItems.splice(i,1);
      }
      continue;
    }

    item.x -= item.speed * dt;
    item.el.style.left = item.x + '%';

    const itemRect = item.el.getBoundingClientRect();
    let hit = null;
    for(const sr of slimeRects){
      if(rectsIntersect(itemRect, sr.rect)){ hit = sr; break; }
    }

    if(hit){
      if(item.type === 'monster'){
        item.fleeing = true;
        const speed = 45 + Math.random()*15;
        const angle = 20 * Math.PI / 180;
        item.fleeVx = speed * Math.cos(angle);
        item.fleeVy = -speed * Math.sin(angle);
        item.fleeAngle = 0;
        triggerMonsterReactions(item.monster, slimeRects);
      } else {
        /* 拾取仅作派遣演出；奖励统一由 runPlans 结算，切换页面不会改变收益。 */
        const slimeEl = hit.el.querySelector('.slime');
        if(slimeEl && Math.random() < 0.65){
          slimeEl.dataset.mood = 'happy';
          setTimeout(()=>{ if(slimeEl.isConnected) slimeEl.dataset.mood = 'idle'; }, 1500);
        }
        item.el.remove();
        exploreItems.splice(i,1);
        continue;
      }
    }

    if(item.x < -15){
      item.el.remove();
      exploreItems.splice(i,1);
    }
  }
}

  {title:'从此，有个小小的同行者',t:()=>`<b>${esc(S.sysName)}</b>从月光里探出脑袋，轻轻碰了碰你的手。<br>“我会陪着你。我们去找一个家吧。”`,next:'一起去看看'},

];
let storyStep = 0;
let blocking = false;

function assignStoryRole(){
  if(persistenceBlocked) return;
  let changed=false;
  if(!S.name){S.name=['星野','月白','青禾','云岚','林夕','沐风','初晴','知秋'][Math.floor(Math.random()*8)];changed=true;}
  if(!S.sysName){
    const guide=[['团子',200],['小满',150],['糯米',42],['云朵',260],['桃桃',330],['青芽',100]][Math.floor(Math.random()*6)];
    S.sysName=guide[0];S.sysLook={h:guide[1],s:66,l:70,eh:guide[1],es:48,el:25};changed=true;
  }
  if(changed)save();
}
function renderStory(){
  assignStoryRole();
  if(storyStep >= STORY_STEPS.length){ finishStory(); return; }
  const st=STORY_STEPS[storyStep],stage=$('#storyStage'),text=$('#storyText'),action=$('#storyAction'),screen=$('#storyScreen');
  if(!screen.querySelector('.story-sky'))screen.insertAdjacentHTML('afterbegin',skyArt('story'));
  screen.classList.add('story-arrival');
  stage.innerHTML=`<div class="arrival-orbit">${lookHTML(S.sysLook,{mood:'happy'})}</div><span class="arrival-guide">${esc(S.sysName)} · 你的向导</span>`;
  text.classList.remove('hl');
  text.innerHTML=`<div class="arrival-progress" aria-label="序章 ${storyStep+1} / ${STORY_STEPS.length}">${STORY_STEPS.map((_,i)=>`<i class="${i<=storyStep?'is-read':''}"></i>`).join('')}</div><h1>${st.title}</h1><p>${st.t()}</p>`;
  action.innerHTML=`<button class="btn gold full arrival-next" id="storyNext">${st.next}<span aria-hidden="true">→</span></button>`;
  $('#storyNext').onclick=()=>{storyStep++;renderStory();};
  $('#storyHint').textContent='你的身份已确定，故事就此开始';
  blocking=false;
}

function finishStory(){
  if(persistenceBlocked){ toast('请先恢复存档；原始数据仍受保护'); return; }
  assignStoryRole();
  if(!S.started && !S.starterGiftClaimed){S.points += 200;S.starterGiftClaimed=true;}
  S.started = true;
  save();
  $('#storyScreen').classList.add('hidden');
  $('#gameScreen').classList.remove('hidden');
  applyTheme();
  checkDailyReset();

}

/* Local stroke icons belong to the interface, never to creature sprites. */
function uiIcon(name){

function elementIcon(element){
  return uiIcon({'岩':'rock','火':'flame','水':'drop','风':'wind','草':'leaf','冰':'snow','雷':'bolt','光':'spark','暗':'moon','空间':'orbit','时间':'clock','幻':'spiral'}[element]);
}
function itemIcon(item){return uiIcon({food:'food',treasure:'gem',ticket:'ticket',expPotion:'potion',net:'net'}[item]);}
function refreshUIIcons(root){
  root=root||document;
  root.querySelectorAll('[data-ui-icon]').forEach(el=>{if(!el.querySelector('.ui-icon'))el.innerHTML=uiIcon(el.dataset.uiIcon);});
  const nav={home:'home',journey:'map',companions:'person',space:'home',world:'leaf',summon:'spark',travel:'map',bag:'bag',status:'person'};
  const acts={settings:'settings',summon:'spark',mergeopen:'spark',cycleMap:'map',globalplan:'map',setupTeam:'person',abyssSetup:'sword',refill:'food',selectToy:'ball',toggleSpaceMode:'home',buy:'bag',buy10:'bag',feed:'food',treasure:'gift',drinkPotion:'gift',breakthrough:'bolt',claimGoal:'gift',challengeStart:'sword',petlock:'lock'};
  root.querySelectorAll('button[data-act]').forEach(b=>{
    const a=b.dataset.act;
    if(a==='tab'){const ic=b.querySelector('.ico');if(ic)ic.innerHTML=uiIcon(nav[b.dataset.tab]);return;}
    let name=acts[a];if(!name||b.querySelector('.ui-icon'))return;
    if(a==='globalplan'&&b.dataset.type==='clear')name='back';
    if(a==='selectToy'&&b.dataset.toy==='stack')name='stack';
    if(a==='settings'&&b.classList.contains('settings-trigger')){b.innerHTML=uiIcon(name);return;}
    for(const n of Array.from(b.childNodes)){if(n.nodeType===3)n.textContent=n.textContent.replace(/^[\s✨🗺️↩️👥⚔️🥣🎮⚽🧱⚡🎁◇]+/u,'').replace(/[✨]+$/u,'');}
    b.insertAdjacentHTML('afterbegin',uiIcon(name));
  });
}

      <radialGradient id="${id}-haloA"><stop stop-color="#f2d9a6" stop-opacity=".3"/><stop offset="1" stop-color="#f2d9a6" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}-haloB"><stop stop-color="#bcd0f5" stop-opacity=".26"/><stop offset="1" stop-color="#bcd0f5" stop-opacity="0"/></radialGradient>

      <linearGradient id="${id}-cloud" x2="0" y2="1"><stop stop-color="#b9aae8" stop-opacity=".2"/><stop offset="1" stop-color="#b9aae8" stop-opacity="0"/></linearGradient>
      <symbol id="${id}-isle" viewBox="0 0 100 72" overflow="visible">
        <path d="M0 14C8 6 22 3 36 5C48 1 64 2 76 6C88 4 97 9 100 14C93 22 83 27 76 35C68 47 59 59 51 70C44 58 37 47 28 39C18 31 7 24 0 14Z" fill="url(#${id}-rock)"/>
        <path d="M0 14C8 6 22 3 36 5C48 1 64 2 76 6C88 4 97 9 100 14C86 18 70 16 50 18C30 16 13 18 0 14Z" fill="url(#${id}-moss)"/>
        <path d="M30 40q-1 9 2 15M62 44q2 8 0 14M45 52q-1 7 1 12" stroke="#2a2442" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <circle cx="51" cy="70" r="6" fill="url(#${id}-glow)"/><circle cx="51" cy="70" r="1.6" fill="#ddd1ff"/>
      </symbol>
      <symbol id="${id}-jelly" viewBox="-14 -14 28 34" overflow="visible">
        <circle r="13" fill="url(#${id}-glow)"/>
        <path d="M-7 1C-7-8 7-8 7 1C5 3 3.5 1 1.8 3C0 1-1.8 3-3.5 1C-5 3-6 2.5-7 1Z" fill="#ebe3ff" fill-opacity=".86"/>

const BOND_MILESTONES=[{need:0,name:'初识',response:'歪着头，认真记住你的声音。',face:'happy'},{need:5,name:'熟悉',response:'蹭了蹭你的手：想和你一起走！',face:'like'},{need:15,name:'信赖',response:'一看到你就跳起来：你终于回来啦！',face:'jump'},{need:30,name:'挚友',response:'把小小的安心交给你：有你在真好。',face:'like'}];
function bondMilestone(s){return BOND_MILESTONES.slice().reverse().find(m=>(Number(s.intimacy)||0)>=m.need)||BOND_MILESTONES[0];}
function gainCompanionIntimacy(s,now){
  const before=bondMilestone(s);
  const last=Number(s.lastPetAt),hasLast=s.lastPetAt!==undefined && s.lastPetAt!==null && Number.isFinite(last);
  const gained=!hasLast || now<last || now-last>=30000;
  if(gained){s.intimacy=(Number(s.intimacy)||0)+1;s.lastPetAt=now;}
  return {before,bond:bondMilestone(s),gained};
}

function renderExploreScene(){
  const map = MAP_THEMES[exploreRegionIndex()];
  const dispatched = S.slimes.filter(s => isDispatched(s));
  const now = Date.now();

  function buildSlimeEl(s, i, opts){
    opts = opts || {};
    const scaleMul = opts.scaleMul || 1;
    const preferWalk = !!opts.preferWalk;
    const isJump = preferWalk ? Math.random() < 0.3 : Math.random() < 0.5;
    const nextToggle = now + 500 + Math.random() * 800;
    const sz = clamp(s.size || 1, 0.6, 1.6);
    const scale = 0.18 * sz * scaleMul;
    const w = Math.round(26 * sz * scaleMul);
    const h = Math.round(22 * sz * scaleMul);
    return `
    <div class="explore-slime ${isJump?'jumping':'walking'}"
         style="width:${w}px;height:${h}px;--ex-scale:${scale.toFixed(3)};--delay:${(i*0.2).toFixed(2)}s"
         data-sid="${s.id}"
         data-row="${opts.row || 'back'}"
         data-next-toggle="${nextToggle}">
      ${slimeHTML(s,{mood:'idle'})}
    </div>`;
  }

  let slimesHTML;
  if(!dispatched.length){
    slimesHTML = `<div class="explore-slimes" style="bottom:18%;">
      <span class="explore-empty small">暂无史莱姆在探险</span>
    </div>`;
  } else if(dispatched.length <= 5){
    slimesHTML = `<div class="explore-slimes" style="bottom:18%;">
      ${dispatched.map((s,i)=>buildSlimeEl(s,i,{row:'back'})).join('')}
    </div>`;
  } else {
    const half = Math.ceil(dispatched.length / 2);
    let rowBack = dispatched.slice(0, half);
    let rowFront = dispatched.slice(half);

    const sortedBySize = [...dispatched].sort((a,b)=>(b.size||1)-(a.size||1));
    const top3Ids = new Set(sortedBySize.slice(0,3).map(x=>x.id));
    const lastFront = rowFront[rowFront.length - 1];
    if(lastFront && top3Ids.has(lastFront.id)){
      let swapped = false;
      for(let i = rowFront.length - 2; i >= 0; i--){
        if(!top3Ids.has(rowFront[i].id)){
          const tmp = rowFront[i];
          rowFront[i] = rowFront[rowFront.length - 1];
          rowFront[rowFront.length - 1] = tmp;
          swapped = true;
          break;
        }
      }
      if(!swapped){
        for(let i = rowBack.length - 1; i >= 0; i--){
          if(!top3Ids.has(rowBack[i].id)){
            const tmp = rowBack[i];
            rowBack[i] = rowFront[rowFront.length - 1];
            rowFront[rowFront.length - 1] = tmp;
            swapped = true;
            break;
          }
        }
      }
    }

    slimesHTML = `
      <div class="explore-slimes" style="bottom:22.2%;">
        ${rowBack.map((s,i)=>buildSlimeEl(s,i,{row:'back', scaleMul:0.99})).join('')}
      </div>
      <div class="explore-slimes" style="bottom:14.4%;">
        ${rowFront.map((s,i)=>buildSlimeEl(s,i,{row:'front', scaleMul:0.8, preferWalk:true})).join('')}
      </div>`;
  }

  return `
    <div class="explore-scene" style="--sky1:${map.sky1};--sky2:${map.sky2};--grass1:${map.grass1};--grass2:${map.grass2};--soil1:${map.soil1};--soil2:${map.soil2};">
      <div class="bg-scroll">
        <div class="bg-panel">
          <div class="scene-sky"></div>
          <div class="scene-grass"></div>
          <div class="scene-soil"></div>
          ${mapLandmarks(map)}
        </div>
        <div class="bg-panel">
          <div class="scene-sky"></div>
          <div class="scene-grass"></div>
          <div class="scene-soil"></div>
          ${mapLandmarks(map)}
        </div>

function createSlime(forceMonster, opts){
  const isMon = !!forceMonster;
  /* 魔物不吃玩家的献祭加成；保底召唤只在稀有元素里抽 */
  const element = opts && opts.rare ? pickRareElement(summonBoost) : pickElement(isMon ? null : summonBoost);

  const strPotential = isMon ? gameInt(12, 26) : gameInt(5, 20);
  const agiPotential = isMon ? gameInt(12, 26) : gameInt(5, 20);
  const magPotential = isMon ? gameInt(12, 26) : gameInt(5, 20);
  const luck = isMon ? gameInt(3, 14) : gameInt(0, 10);
  const wit  = isMon ? gameInt(3, 14) : gameInt(0, 10);

  const baseSize = +(0.66 + gameRandom() * 0.34).toFixed(2);

  const str = strPotential;
  const agi = agiPotential;
  const mag = magPotential;
  const initStaminaMax = Math.round(80 + baseSize * 40);

  const morality = gameInt(-100,100);
  const id = S.seq++;

  S.nameSeq = (S.nameSeq || 0) + 1;
  if(S.nameSeq >= 99) S.nameSeq = 1;
  const nameNo = S.nameSeq;

  const traits = [];
  if(gameRandom() < 0.15){
    const count = gameRandom() < 0.25 ? 2 : 1;
    const pool = [...TRAITS_POOL];
    for(let i=0;i<count && pool.length;i++){
      const idx = Math.floor(gameRandom()*pool.length);
      const t = pool.splice(idx,1)[0];
      const nt = {n:t.n,d:t.d,k:t.k,v:t.v};
      refreshTraitDesc(nt);
      traits.push(nt);
    }
  }

  const s = {
    id, name:`${element}${nameNo}`, element, morality,
    personality: gamePick(PERSONALITIES),
    mood:70, stamina:initStaminaMax, traits,
    level:1, exp:0, size:baseSize, resting:false,
    intimacy:0, locked:false, mergeCount:0,
    strPotential, agiPotential, magPotential, luck, wit,
    str, agi, mag
  };
  s.hp = hpMax(s);
  if(forceMonster){
    s.isMonster = true;
    s.monSat = gameRange(18,58);
    s.monLight = gameRange(14,34);
  }
  s.skill = HEAL_ELEMENTS.includes(element) ? '治疗' : '元素弹';
  return s;
}

/* One growth rule for leveling and merging. Add deltas instead of replacing
   existing stats, so old saves keep every previously earned point. */
function growthStat(potential, level){
  const p = Math.max(0, Number(potential)||0);
  return p + Math.max(0, (Number(level)||1)-1) * Math.round(p * 0.5);
}
function growthStats(s, newLevel, potentials){
  const out = {};
  for(const key of ['str','agi','mag']){
    const potKey = key + 'Potential';
    const nextPot = potentials && Number.isFinite(potentials[potKey]) ? potentials[potKey] : s[potKey];
    out[key] = (Number(s[key])||0) + Math.max(0,
      growthStat(nextPot, newLevel) - growthStat(s[potKey], s.level));
  }
  return out;
}
function addExp(s, amount, silent){
  const rate = expRate(s);
  const actual = Math.max(0, Math.round((Number(amount)||0) * rate));
  if(!Number.isFinite(actual) || actual <= 0) return false;
  addSummonerExp(Math.max(1, Math.round(actual * 0.1)), silent);
  s.exp = (Number(s.exp)||0) + actual;
  let leveled = false;
  while(s.exp >= slimeExpNeed(s.level)){
    s.exp -= slimeExpNeed(s.level);
    const nextLevel = s.level + 1;
    Object.assign(s, growthStats(s, nextLevel));
    s.level = nextLevel;
    s.size = +(s.size + 0.0016).toFixed(3);
    leveled = true;
  }
  if(leveled) s.hp = hpMax(s);
  return leveled;
}

function buyItem(k, qty){
  qty = qty || 1;
  const it = ITEMS[k];
  const total = it.price * qty;
  if(k === 'ticket'){
    if(S.points < total){ toast(`系统积分不足（需要 ${total} 积分）`); return; }
    S.points -= total;
    S.bag.ticket = (S.bag.ticket||0) + qty;
    save(); renderTop(); renderTab();
    toast(`购买成功：${it.name} ×${qty}`, 'good');
    return;
  }
  /* 经验药水：获得后自动对等级最低的史莱姆使用 */
  if(k === 'expPotion'){
    if(S.coins < total){ toast('晶币不足'); return; }
    S.coins -= total;
    let used = false;
    for(let i=0;i<qty;i++){
      if(autoUseExpPotionSilent()) used = true;
      else S.bag.expPotion = (S.bag.expPotion||0) + 1;
    }
    save(); renderTop(); renderTab();
    if(used) toast(`🧪 经验药水已自动使用于等级最低的史莱姆`, 'good');
    else toast('没有史莱姆，经验药水已暂存');
    return;
  }
  if(S.coins < total){ toast('晶币不足'); return; }
  S.coins -= total;
  S.bag[k] = (S.bag[k]||0) + qty;
  save(); renderTop(); renderTab();
  toast(`购买成功：${it.name} ×${qty}`, 'good');
}

function useItem(k,id){
  const s = getSlime(id); if(!s) return;
  if(s.isMonster && k !== 'food'){ toast('魔物无法使用该道具'); return; }
  if((S.bag[k]||0) <= 0){ toast('数量不足，请先购买'); return; }

  if(k === 'food' && !s.isMonster){LivingWorld.dispatch({type:'interact',slime:id,action:'feed'});return;}
  if(!s.isMonster&&LivingWorld.isBusy(S,id)){toast('请先让伙伴回家');return;}
  if(k === 'food'){
    S.bag.food--;
    s.stamina = clamp(s.stamina + 30, 0, staminaMax(s));
    s.mood = clamp(s.mood + 5, 0, 100);
    if(!s.isMonster) addExp(s, 8);
    addTaskProgress('feed', 1);
    toast('🍖 吃得很好！体力+30 心情+5', 'good');
  }
  else if(k === 'treasure'){
    S.bag.treasure--;
    const inc = gameInt(6,14);
    s.strPotential = clamp(s.strPotential + Math.round(inc/3), 5, 40);
    s.agiPotential = clamp(s.agiPotential + Math.round(inc/3), 5, 40);
    s.magPotential = clamp(s.magPotential + Math.round(inc/3), 5, 40);
    s.mood = clamp(s.mood + 15, 0, 100);
    s.stamina = clamp(s.stamina + 20, 0, staminaMax(s));
    addExp(s, 25);
    addTaskProgress('grow', 1);
    toast(`💎 吸收了${s.element}属性天材地宝！\n潜力提升（天赋现为 ${calcTalent(s)}）`, 'good');
  }
  else if(k === 'ticket'){
    if(s.traits.length >= 3){ toast('这只史莱姆的词条已满（3/3）'); return; }
    const pool = TRAITS_POOL.filter(t=>!s.traits.some(x=>x.n===t.n));
    if(!pool.length){ toast('已无可抽取的词条'); return; }
    S.bag.ticket--;
    const t = gamePick(pool);
    const nt = {n:t.n, d:t.d, k:t.k, v:t.v};
    refreshTraitDesc(nt);
    s.traits.push(nt);
    addExp(s, 15);
    toast(`🎫 抽取词条：【${nt.n}】\n${nt.d}`, 'good');
  }
  else if(k === 'expPotion'){
    S.bag.expPotion--;
    const gain = potionExp(s);
    addExp(s, gain);
    toast(`🧪 喝下经验药水！获得 ${gain} 经验（受悟性加成）`, 'good');
  }
  save(); renderTop(); renderTab();
  if(!$('#modalLayer').classList.contains('hidden')) openDetail(id);
}

let mergeSel = [];
let mergePreviewSignature = '';
function mergeStateSignature(a, b){
  const fields = ['id','name','element','level','exp','intimacy','size','str','agi','mag','strPotential','agiPotential','magPotential','luck','wit','traits','locked','mergeCount'];
  return JSON.stringify([a,b].map(s=>fields.map(k=>s && s[k])));
}
function mergeCost(a, b){
  const count = Math.max(0, Math.floor(Number(a.mergeCount)||0));
  return 500 + 100 * Math.max(a.level, b.level) + 250 * count * (count + 1);
}
function mergePreview(a, b){
  if(typeof LivingWorld!=='undefined' && ((a && LivingWorld.isBusy(S,a.id)) || (b && LivingWorld.isBusy(S,b.id)))) return {valid:false,reason:'请先让伙伴结束家园工作或远征。'};
  if(!a || !b || a === b || a.id === b.id) return {valid:false, reason:'请选择两只不同的史莱姆'};
  if(a.isMonster) return {valid:false, reason:'魔物不能作为主史莱姆'};
  if(b.locked) return {valid:false, reason:'副宠已珍爱锁定，不能被消耗；请先在详情中解锁'};
  const level = Math.max(a.level, b.level);
  const maxPots = {};
  for(const key of ['strPotential','agiPotential','magPotential']) maxPots[key] = Math.max(a[key], Math.min(40, a[key] + 3));
  const guaranteedTraits = (a.traits||[]).filter(t=>(b.traits||[]).some(bt=>bt.n===t.n)).map(t=>t.n);
  const possibleTraits = (b.traits||[]).filter(bt=>!(a.traits||[]).some(t=>t.n===bt.n)).map(t=>t.n);
  return {valid:true, cost:mergeCost(a,b), level,
    statsMin:growthStats(a, level), statsMax:growthStats(a, level, maxPots),
    guaranteedTraits, possibleTraits, fullTraits:(a.traits||[]).length >= 3};
}
function renderMergePreview(){
  const el = document.getElementById('mergePreview');
  const btn = document.querySelector('[data-act="mergeconfirm"]');
  if(!el || !btn) return;
  const a = getSlime(mergeSel[0]), b = getSlime(mergeSel[1]);
  if(!a || !b){
    el.innerHTML = '<p class="muted small">先选择保留身份的主宠，再选择会被消耗的副宠。</p>';
    btn.disabled = true;
    btn.textContent = '先选择主宠与副宠';
    return;
  }
  const p = mergePreview(a,b);
  if(!p.valid){ mergePreviewSignature = ''; el.textContent = p.reason; btn.disabled = true; return; }
  mergePreviewSignature = mergeStateSignature(a,b);

function toggleMergeSel(id){
  const s = getSlime(id);
  if(!s) return;
  const idx = mergeSel.indexOf(id);
  if(idx >= 0){
    mergeSel.splice(idx,1);
    if(mergeSel.length && getSlime(mergeSel[0]).isMonster) mergeSel = [];
  } else {
    if(mergeSel.length >= 2){ toast('请先取消一个选择，再替换宠物'); return; }
    if(!mergeSel.length && s.isMonster){ toast('魔物不能作为主史莱姆'); return; }
    if(mergeSel.length === 1 && s.locked){ toast('这只宠物已珍爱锁定，不能作为被消耗的副宠'); return; }
    mergeSel.push(id);
  }
  document.querySelectorAll('.merge-list .minicard').forEach(c=>{
    const at = mergeSel.indexOf(+c.dataset.id);
    c.classList.toggle('on', at>=0);
    c.setAttribute('aria-pressed', String(at>=0));
    const label = c.querySelector('.merge-role');
    if(label) label.textContent = at===0 ? '主宠 · 身份保留' : at===1 ? '副宠 · 将被消耗' : '';
  });
  renderMergePreview();
}
function doMerge(){
  if(mergeSel.length !== 2) return;
  const a = getSlime(mergeSel[0]), b = getSlime(mergeSel[1]);
  const preview = mergePreview(a,b);
  if(!preview.valid){ toast(preview.reason); return; }
  if(mergePreviewSignature && mergePreviewSignature !== mergeStateSignature(a,b)){
    renderMergePreview();
    toast('宠物在预览期间获得了成长，已更新预览；请再次确认费用与继承结果');
    return;
  }
  if(S.coins < preview.cost){ toast(`晶币不足，合体需要 ${preview.cost} 晶币`); renderMergePreview(); return; }

  const potBonus = gameRandom() < 0.25 ? gameInt(1,3) : 0;
  const pots = {};
  for(const key of ['strPotential','agiPotential','magPotential']) pots[key] = Math.max(a[key], Math.min(40, a[key] + potBonus));
  const stats = growthStats(a, preview.level, pots);
  const mergedTraits = (a.traits||[]).map(t=>({...t}));
  (b.traits||[]).forEach(bt=>{
    const mt = mergedTraits.find(t=>t.n===bt.n);
    if(mt){ mt.v = +(mt.v * 1.2).toFixed(4); refreshTraitDesc(mt); }
    else if(mergedTraits.length < 3 && gameRandom() < 0.5){
      const nt = {...bt}; refreshTraitDesc(nt); mergedTraits.push(nt);
    }
  });
  const newSize = gameRandom() < 0.1 ? +(a.size + b.size * 0.008).toFixed(3) : a.size;
  let newElement = a.element;
  if(a.element !== b.element){
    const r = gameRandom();
    if(r >= 0.80 && r < 0.98) newElement = b.element;
    else if(r >= 0.98) newElement = gamePick(['草','冰','雷','幻','光','暗','空间','时间']);
  }

  /* Mutate the retained primary in place: references, custom name, earned
     intimacy/experience and all old-save extras survive the operation. */
  if(typeof ensureProgress === 'function') ensureProgress();
  S.coins -= preview.cost;
  Object.assign(a, pots, stats, {
    element:newElement, level:preview.level, traits:mergedTraits, size:newSize,
    luck:Math.max(a.luck||0, Math.min(20, (a.luck||0) + (potBonus?1:0))),
    wit:Math.max(a.wit||0, Math.min(20, (a.wit||0) + (potBonus?1:0))),
    mergeCount:(Math.max(0, Math.floor(Number(a.mergeCount)||0)))+1
  });
  a.skill = HEAL_ELEMENTS.includes(newElement) ? '治疗' : '元素弹';
  a.hp = Math.min(a.hp, hpMax(a));
  LivingWorld.archiveCompanion(S,b.id);
  S.slimes = S.slimes.filter(s=>s!==b);
  S.monsters = S.monsters.filter(s=>s!==b);
  delete S.customPlans[b.id];
  if(Array.isArray(S.exploreTeam)) S.exploreTeam = S.exploreTeam.filter(id=>id!==b.id);
  if(Array.isArray(S.lastAbyssSel)) S.lastAbyssSel = S.lastAbyssSel.filter(id=>id!==b.id);
  if(typeof ensureProgress === 'function') ensureProgress();
  mergeSel = [];
  mergePreviewSignature = '';
  addTaskProgress('grow', 1);
  save(); renderTop(); renderTab(); closeModal();
  toast(`合体完成：${a.name} 仍是你的老朋友！\n消耗 ${preview.cost} 晶币 · Lv.${a.level} · 天赋 ${calcTalent(a)}\n${b.name} 已被消耗；主宠名字、经验与亲密度保留`, 'good');
}

function startBallGame(s){
  if(ballGame || document.getElementById('gameOverlay')) return;
  if(!LivingWorld.reserve(S,[s.id],'play')){toast('请先让伙伴回家休息');return;}
  const overlay = document.createElement('div');
  overlay.id = 'gameOverlay';
  overlay.innerHTML = `
    <div class="game-hud">
      <span>⚽ 接住 <b id="gCatch">0</b> 次</span>
      <span>⏱ <b id="gTime">30</b>s</span>
      <button class="hud-close" id="gClose">退出</button>
    </div>
    <div class="game-field" id="gameField">
      ${Array.from({length:14}).map(()=>`<div class="bg-star" style="left:${rnd(2,98)}%;top:${rnd(2,98)}%;"></div>`).join('')}
      <div class="catch-zone"></div>
      <div class="catch-line"></div>
      <div class="out-line"></div>
      <div class="game-slime" id="gameSlime">${slimeHTML(s,{mood:'idle'})}</div>
      <div class="game-ball" id="gameBall"></div>
    </div>
  `;
  $('#app').appendChild(overlay);$('#app').classList.add('has-game-overlay');
  const field = overlay.querySelector('#gameField');
  const slimeEl = overlay.querySelector('#gameSlime');
  const ballEl = overlay.querySelector('#gameBall');
  const G = {
    slime: s, catches: 0, timeLeft: 30, running: true,
    field, slimeEl, ballEl,
    slimeX: 50, ballX: 50, ballY: 75,
    ballState: 'ready', animId: null, timers: []
  };
  ballGame = G;
  slimeEl.style.left = '50%';
  slimeEl.style.top = '30%';
  function placeBall(x, y){
    G.ballX = x; G.ballY = y;
    ballEl.style.left = x + '%';
    ballEl.style.top = y + '%';
  }
  function showBall(v){ ballEl.classList.toggle('hidden', !v); }
  placeBall(50, 75);
  showBall(true);
  const slimeTimer = setInterval(()=>{
    if(!G.running || storageConflict || persistenceBlocked || saveRetryNeeded) return;
    if(G.ballState === 'toSlime') return;
    G.slimeX = clamp(G.slimeX + gameRange(-18,18), 18, 82);
    slimeEl.style.left = G.slimeX + '%';
    slimeEl.dataset.mood = Math.random()<0.5 ? 'jump' : 'crawl';
    setTimeout(()=>{ if(slimeEl && G.running) slimeEl.dataset.mood = 'idle'; }, 900);
  }, 1300);
  G.timers.push(slimeTimer);
  const clock = setInterval(()=>{
    if(!G.running || storageConflict || persistenceBlocked || saveRetryNeeded) return;
    G.timeLeft--;
    overlay.querySelector('#gTime').textContent = Math.max(0, G.timeLeft);
    if(G.timeLeft <= 0) endGame();
  }, 1000);
  G.timers.push(clock);
  field.addEventListener('pointerdown', ev=>{
    if(!G.running || storageConflict || persistenceBlocked || saveRetryNeeded) return;
    if(G.ballState !== 'ready' && G.ballState !== 'toPlayer') return;
    const rect = field.getBoundingClientRect();
    const bx = rect.left + (G.ballX/100)*rect.width;
    const by = rect.top + (G.ballY/100)*rect.height;
    const dx = ev.clientX - bx;
    const dy = ev.clientY - by;
    if(Math.sqrt(dx*dx + dy*dy) > 50) return;
    if(G.ballState === 'ready'){
      G.ballState = 'toSlime';
      flyToSlime();
    } else {
      G.catches++;
      overlay.querySelector('#gCatch').textContent = G.catches;
      G.ballState = 'toSlime';
      flyToSlime();
    }
  });
  function flyToSlime(){
    const startX = G.ballX, startY = G.ballY;
    const targetX = G.slimeX, targetY = 30;
    const dur = 420;
    let lastNow = performance.now(), elapsed = 0;
    function step(now){
      if(!G.running || G.ballState !== 'toSlime' || storageConflict || persistenceBlocked) return;
      if(saveRetryNeeded){ lastNow = now; G.animId = requestAnimationFrame(step); return; }
      elapsed += Math.max(0, now - lastNow); lastNow = now;
      const p = Math.min(1, elapsed/dur);
      const x = startX + (targetX-startX)*p;
      const y = startY + (targetY-startY)*p;
      placeBall(x,y);
      if(p < 1){
        G.animId = requestAnimationFrame(step);
      } else {
        slimeEl.dataset.mood = 'happy';
        setTimeout(()=>{ if(slimeEl && G.running) slimeEl.dataset.mood = 'idle'; }, 700);
        G.ballState = 'toPlayer';
        fallDown();
      }
    }
    G.animId = requestAnimationFrame(step);
  }
  function fallDown(){
    const base = 23 + G.catches * 0.015;
    const variation = gameRange(0.8, 1.25);
    const speedY = clamp(base * variation, 15, 40);
    const drift = gameRange(-7, 7);
    let lastNow = performance.now();
    function step(now){
      if(!G.running || G.ballState !== 'toPlayer' || storageConflict || persistenceBlocked) return;
      if(saveRetryNeeded){ lastNow = now; G.animId = requestAnimationFrame(step); return; }
      const dt = Math.min(0.05, (now - lastNow)/1000);
      lastNow = now;
      G.ballY += speedY * dt;
      G.ballX = clamp(G.ballX + drift * dt, 6, 94);
      placeBall(G.ballX, G.ballY);
      if(G.ballY >= 83.33){
        G.ballState = 'gone';
        showBall(false);
        function resetBall(){
          if(!G.running || G.ballState !== 'gone' || storageConflict || persistenceBlocked) return;
          if(saveRetryNeeded){ setTimeout(resetBall, 100); return; }
          placeBall(50, 75);
          showBall(true);
          G.ballState = 'ready';
        }
        setTimeout(resetBall, 420);
        return;
      }
      G.animId = requestAnimationFrame(step);
    }
    G.animId = requestAnimationFrame(step);
  }
  function endGame(){
    if(!G.running || storageConflict || persistenceBlocked || saveRetryNeeded) return;
    G.running = false;
    G.timers.forEach(t=>clearInterval(t));
    if(G.animId) cancelAnimationFrame(G.animId);
    const catches = G.catches;
    const moodGain = catches * 3;
    const intimacyGain = Math.floor(catches / 10);
    s.mood = clamp(s.mood + moodGain, 0, 100);
    s.intimacy = (s.intimacy||0) + intimacyGain;
    LivingWorld.release(S,'play',true);save();
    overlay.remove();$('#app').classList.remove('has-game-overlay');
    ballGame = null;
    renderTab();
    if(catches > 0){
      toast(`⚽ 游戏结束！\n接住 ${catches} 次\n心情 +${moodGain}　亲密度 +${intimacyGain}`, 'good');
    } else {
      toast(`⚽ 游戏结束！\n这次没有接住皮球……\n下次加油～`);
    }
  }
  overlay.querySelector('#gClose').addEventListener('click', endGame);
}
