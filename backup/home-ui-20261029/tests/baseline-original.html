<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>最强召唤师系统</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#05060c;color:#e8e9f3;}
#app{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto;overflow:hidden;
  background:radial-gradient(circle at 50% 0%,var(--bgTop) 0%,var(--bgMid) 55%,var(--bgBot) 100%);
  --bgTop:#1e1440;--bgMid:#0a0a18;--bgBot:#05060c;
  --accent:#8b7bff;--accent2:#a78bfa;--gold:#ffd166;
  --panel:rgba(255,255,255,.055);--border:rgba(255,255,255,.11);--text:#e8e9f3;--muted:#7a8098;
  --topbar:rgba(9,10,20,.82);--tabbar:rgba(9,10,20,.94);}
#app::before,#app::after{content:'';position:absolute;left:0;right:0;height:0.7cm;background:#000;z-index:9999;pointer-events:none;}
#app::before{top:0;}
#app::after{bottom:0;}

#app[data-theme="sunset"]{--bgTop:#2b1c5c;--bgMid:#150d2e;--bgBot:#08040f;
  --accent:#8b5cf6;--accent2:#c4b5fd;--gold:#ffd166;
  --panel:rgba(150,120,255,.07);--border:rgba(160,140,255,.16);--text:#ece9ff;--muted:#9b8fc4;
  --topbar:rgba(14,9,28,.85);--tabbar:rgba(14,9,28,.95);}
#app[data-theme="sunset"] .modal{background:#161129;}
#app[data-theme="dark"]{--bgTop:#151a2e;--bgMid:#0e1220;--bgBot:#080a12;
  --accent:#8ab4f8;--accent2:#b4d0ff;--gold:#ffd166;
  --panel:rgba(255,255,255,.05);--border:rgba(180,200,255,.13);--text:#e6ecff;--muted:#7e8aa8;
  --topbar:rgba(8,10,18,.85);--tabbar:rgba(8,10,18,.95);}
#app[data-theme="dark"] .modal{background:#141a2a;}
#app[data-theme="dark"] .story-text{background:rgba(20,26,42,.85);}
#app[data-theme="dark"] .custom-panel{background:rgba(20,26,42,.9);}
#app[data-theme="light"]{--bgTop:#f0f3ff;--bgMid:#e0e6f8;--bgBot:#cdd6f0;
  --accent:#5b48e0;--accent2:#7c63f0;--gold:#b07d00;
  --panel:rgba(255,255,255,.55);--border:rgba(60,70,110,.2);--text:#1a1e33;--muted:#4a5275;
  --topbar:rgba(240,243,255,.92);--tabbar:rgba(240,243,255,.96);}
#app[data-theme="light"] .story-text{background:rgba(255,255,255,.86);}
#app[data-theme="light"] .custom-panel{background:rgba(255,255,255,.9);}
#app[data-theme="light"] .story-input{background:rgba(0,0,0,.05);color:#1a1e33;}
#app[data-theme="light"] .modal{background:#f5f7ff;}
#app[data-theme="light"] .tabbar button{color:#5a6180;}
#app[data-theme="light"] .tabbar button.active{color:#5b48e0;}
#app[data-theme="light"] .topbar{color:#1a1e33;}
#app[data-theme="light"] .cur{background:rgba(255,255,255,.7);border-color:rgba(60,70,110,.2);}
#app[data-theme="light"] .mc-tag,#app[data-theme="light"] .barlabel{color:#4a5275;}
#app[data-theme="light"] .minicard{background:rgba(255,255,255,.55);}
#app[data-theme="light"] .minicard:active{background:rgba(91,72,224,.12);}
#app[data-theme="light"] .close{background:rgba(0,0,0,.08);color:#333;}
#app[data-theme="light"] .item-icon{background:rgba(0,0,0,.05);}
#app[data-theme="light"] .theme-btn{background:none;}
#app[data-theme="light"] .btn{color:#fff;}
#app[data-theme="light"] .btn.gold{color:#2a1e00;}
#app[data-theme="light"] .toast{background:rgba(255,255,255,.97);color:#1a1e33;box-shadow:0 8px 30px rgba(60,70,110,.3);}
#app[data-theme="light"] .cur.g{color:#b07d00;}
#app[data-theme="light"] .cur.s{color:#5b48e0;}
#app[data-theme="light"] .cur.c{color:#b05e2a;}
#app[data-theme="peach"]{--bgTop:#fff0e8;--bgMid:#ffe4d6;--bgBot:#f8d5c4;
  --accent:#e0603a;--accent2:#f08a5d;--gold:#b06000;
  --panel:rgba(255,255,255,.6);--border:rgba(130,80,60,.2);--text:#3a2016;--muted:#7a5242;
  --topbar:rgba(255,240,232,.92);--tabbar:rgba(255,240,232,.96);}
#app[data-theme="peach"] .story-text{background:rgba(255,255,255,.86);}
#app[data-theme="peach"] .custom-panel{background:rgba(255,255,255,.9);}
#app[data-theme="peach"] .story-input{background:rgba(0,0,0,.05);color:#3a2016;}
#app[data-theme="peach"] .modal{background:#fff8f3;}
#app[data-theme="peach"] .tabbar button{color:#7a5242;}
#app[data-theme="peach"] .tabbar button.active{color:#e0603a;}
#app[data-theme="peach"] .topbar{color:#3a2016;}
#app[data-theme="peach"] .cur{background:rgba(255,255,255,.7);border-color:rgba(130,80,60,.2);}
#app[data-theme="peach"] .minicard{background:rgba(255,255,255,.55);}
#app[data-theme="peach"] .minicard:active{background:rgba(224,96,58,.12);}
#app[data-theme="peach"] .close{background:rgba(0,0,0,.08);color:#333;}
#app[data-theme="peach"] .item-icon{background:rgba(0,0,0,.05);}
#app[data-theme="peach"] .theme-btn{background:none;}
#app[data-theme="peach"] .mc-tag,#app[data-theme="peach"] .barlabel{color:#7a5242;}
#app[data-theme="peach"] .toast{background:rgba(255,248,243,.97);color:#3a2016;box-shadow:0 8px 30px rgba(130,80,60,.3);}
#app[data-theme="mint"]{--bgTop:#e8fff5;--bgMid:#d4f5e6;--bgBot:#c0ebd8;
  --accent:#0d9488;--accent2:#14b8a6;--gold:#8a6d00;
  --panel:rgba(255,255,255,.6);--border:rgba(20,90,80,.2);--text:#0f2e2a;--muted:#4a7a72;
  --topbar:rgba(232,255,245,.92);--tabbar:rgba(232,255,245,.96);}
#app[data-theme="mint"] .story-text{background:rgba(255,255,255,.86);}
#app[data-theme="mint"] .custom-panel{background:rgba(255,255,255,.9);}
#app[data-theme="mint"] .story-input{background:rgba(0,0,0,.05);color:#0f2e2a;}
#app[data-theme="mint"] .modal{background:#f0fff9;}
#app[data-theme="mint"] .tabbar button{color:#4a7a72;}
#app[data-theme="mint"] .tabbar button.active{color:#0d9488;}
#app[data-theme="mint"] .topbar{color:#0f2e2a;}
#app[data-theme="mint"] .cur{background:rgba(255,255,255,.7);border-color:rgba(20,90,80,.2);}
#app[data-theme="mint"] .minicard{background:rgba(255,255,255,.55);}
#app[data-theme="mint"] .minicard:active{background:rgba(13,148,136,.12);}
#app[data-theme="mint"] .close{background:rgba(0,0,0,.08);color:#333;}
#app[data-theme="mint"] .item-icon{background:rgba(0,0,0,.05);}
#app[data-theme="mint"] .theme-btn{background:none;}
#app[data-theme="mint"] .mc-tag,#app[data-theme="mint"] .barlabel{color:#4a7a72;}
#app[data-theme="mint"] .toast{background:rgba(240,255,249,.97);color:#0f2e2a;box-shadow:0 8px 30px rgba(20,90,80,.3);}
#app[data-theme="lavender"]{--bgTop:#f4eeff;--bgMid:#e8dcff;--bgBot:#d8c8f5;
  --accent:#7c3aed;--accent2:#a78bfa;--gold:#8a5a00;
  --panel:rgba(255,255,255,.6);--border:rgba(90,60,140,.2);--text:#2a1a4a;--muted:#6a5590;
  --topbar:rgba(244,238,255,.92);--tabbar:rgba(244,238,255,.96);}
#app[data-theme="lavender"] .story-text{background:rgba(255,255,255,.86);}
#app[data-theme="lavender"] .custom-panel{background:rgba(255,255,255,.9);}
#app[data-theme="lavender"] .story-input{background:rgba(0,0,0,.05);color:#2a1a4a;}
#app[data-theme="lavender"] .modal{background:#faf7ff;}
#app[data-theme="lavender"] .tabbar button{color:#6a5590;}
#app[data-theme="lavender"] .tabbar button.active{color:#7c3aed;}
#app[data-theme="lavender"] .topbar{color:#2a1a4a;}
#app[data-theme="lavender"] .cur{background:rgba(255,255,255,.7);border-color:rgba(90,60,140,.2);}
#app[data-theme="lavender"] .minicard{background:rgba(255,255,255,.55);}
#app[data-theme="lavender"] .minicard:active{background:rgba(124,58,237,.12);}
#app[data-theme="lavender"] .close{background:rgba(0,0,0,.08);color:#333;}
#app[data-theme="lavender"] .item-icon{background:rgba(0,0,0,.05);}
#app[data-theme="lavender"] .theme-btn{background:none;}
#app[data-theme="lavender"] .mc-tag,#app[data-theme="lavender"] .barlabel{color:#6a5590;}
#app[data-theme="lavender"] .toast{background:rgba(250,247,255,.97);color:#2a1a4a;box-shadow:0 8px 30px rgba(90,60,140,.3);}
#app[data-theme="sky"]{--bgTop:#e8f4ff;--bgMid:#d4e8fc;--bgBot:#bcdcf8;
  --accent:#0284c7;--accent2:#38bdf8;--gold:#8a6000;
  --panel:rgba(255,255,255,.6);--border:rgba(20,80,130,.2);--text:#0c2a44;--muted:#4a6a88;
  --topbar:rgba(232,244,255,.92);--tabbar:rgba(232,244,255,.96);}
#app[data-theme="sky"] .story-text{background:rgba(255,255,255,.86);}
#app[data-theme="sky"] .custom-panel{background:rgba(255,255,255,.9);}
#app[data-theme="sky"] .story-input{background:rgba(0,0,0,.05);color:#0c2a44;}
#app[data-theme="sky"] .modal{background:#f5faff;}
#app[data-theme="sky"] .tabbar button{color:#4a6a88;}
#app[data-theme="sky"] .tabbar button.active{color:#0284c7;}
#app[data-theme="sky"] .topbar{color:#0c2a44;}
#app[data-theme="sky"] .cur{background:rgba(255,255,255,.7);border-color:rgba(20,80,130,.2);}
#app[data-theme="sky"] .minicard{background:rgba(255,255,255,.55);}
#app[data-theme="sky"] .minicard:active{background:rgba(2,132,199,.12);}
#app[data-theme="sky"] .close{background:rgba(0,0,0,.08);color:#333;}
#app[data-theme="sky"] .item-icon{background:rgba(0,0,0,.05);}
#app[data-theme="sky"] .theme-btn{background:none;}
#app[data-theme="sky"] .mc-tag,#app[data-theme="sky"] .barlabel{color:#4a6a88;}
#app[data-theme="sky"] .toast{background:rgba(245,250,255,.97);color:#0c2a44;box-shadow:0 8px 30px rgba(20,80,130,.3);}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.hidden{display:none!important;}

#storyScreen{padding:calc(0.7cm + 22px) 22px;justify-content:center;align-items:center;z-index:2;}
#storyScreen::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(2px 2px at 20% 15%,rgba(255,255,255,.7),transparent),
             radial-gradient(2px 2px at 70% 25%,rgba(180,200,255,.6),transparent),
             radial-gradient(1.5px 1.5px at 40% 40%,rgba(255,255,255,.5),transparent),
             radial-gradient(2px 2px at 85% 60%,rgba(200,180,255,.6),transparent),
             radial-gradient(1.5px 1.5px at 15% 70%,rgba(255,255,255,.4),transparent),
             radial-gradient(1.5px 1.5px at 55% 85%,rgba(180,220,255,.5),transparent);
  animation:twinkle 6s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
#storyStage{display:flex;justify-content:center;align-items:center;min-height:110px;margin-bottom:14px;width:100%;position:relative;z-index:5;}
#storyStage .slime{--sz:.82;transform:scale(.82);}
.story-text{background:rgba(12,14,28,.82);border:1px solid var(--border);border-radius:18px;
  padding:18px;font-size:15px;line-height:1.85;backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,.5);min-height:110px;width:100%;text-align:center;color:var(--text);}
.story-text.hl{border-color:rgba(255,209,102,.45);box-shadow:0 0 24px rgba(255,209,102,.16),0 8px 30px rgba(0,0,0,.5);}
.story-text.hl b{color:var(--gold);}
.story-action{margin-top:12px;display:flex;flex-direction:column;gap:8px;width:100%;}
.story-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.story-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.07);color:var(--text);font-size:15px;outline:none;text-align:center;font-family:inherit;}
.story-input:focus{border-color:var(--accent);}
.custom-panel{background:rgba(12,14,28,.85);border:1px solid var(--border);border-radius:18px;padding:14px;
  display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(10px);width:100%;}
.custom-panel label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.custom-panel label span{width:32px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums;}
.custom-panel input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;}
.custom-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
  border-radius:50%;background:#fff;box-shadow:0 0 8px var(--accent);cursor:pointer;}

#gameScreen{z-index:3;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:10px 12px;padding-top:calc(0.7cm + 10px + env(safe-area-inset-top));
  background:var(--topbar);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  font-size:12.5px;z-index:5;flex:none;color:var(--text);}
.cur{display:flex;align-items:center;gap:4px;background:var(--panel);
  padding:4px 9px;border-radius:20px;border:1px solid var(--border);}
.cur b{font-variant-numeric:tabular-nums;font-weight:600;}
.cur.g{color:var(--gold);} .cur.s{color:var(--accent2);} .cur.p{color:#ffd166;}
.cur .sym{font-size:12px;}
.cur.alert{border-color:var(--gold);box-shadow:0 0 12px rgba(255,209,102,.4);animation:pulse 1.4s infinite;}

.coin-silver{
  display:inline-block;
  width:13px;height:13px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ffffff 0%, #e8eef4 18%, #b8c4d0 55%, #8a98a8 100%);
  box-shadow:
    inset 0 0 2px rgba(255,255,255,.9),
    inset 0 -1px 2px rgba(60,80,100,.4),
    0 0 4px rgba(160,190,220,.6);
  position:relative;
  vertical-align:middle;
}
.coin-silver::after{
  content:'';
  position:absolute;
  left:50%;top:50%;
  width:6px;height:6px;
  transform:translate(-50%,-50%);
  background:linear-gradient(135deg, #ffffff 0%, #d8e4f0 100%);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  opacity:.85;
}

.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(0.7cm + 92px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;
  background:var(--tabbar);backdrop-filter:blur(16px);border-top:1px solid var(--border);
  padding-bottom:calc(0.7cm + env(safe-area-inset-bottom));z-index:10;}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:9px 0 9px;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:.15s;}
.tabbar button.active{color:var(--gold);transform:translateY(-2px);}
.tabbar .ico{font-size:19px;line-height:1;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;
  backdrop-filter:blur(6px);overflow:hidden;}
.panel h2{margin:0 0 6px;font-size:17px;color:var(--accent2);}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--text);font-weight:600;letter-spacing:.5px;opacity:.9;}
.center{text-align:center;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;margin:6px 0;}
.small{font-size:11.5px;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:11px 16px;
  border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;}
.btn:active{transform:scale(.96);}
.btn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.14);
  box-shadow:none;cursor:not-allowed;transform:none;}
.btn.gold{background:linear-gradient(135deg,#ffd166,#ffab5e);color:#3a2600;}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:10px;}
.btn.full{width:100%;margin-top:10px;}
.btn.big{font-size:17px;padding:15px 30px;border-radius:16px;width:100%;margin-top:12px;
  box-shadow:0 6px 24px rgba(139,123,255,.4);}
.btn.themed{background:rgba(255,255,255,.08)!important;color:var(--accent2)!important;border:1px solid var(--border);box-shadow:none!important;}
#app[data-theme="light"] .btn.themed,#app[data-theme="peach"] .btn.themed,
#app[data-theme="mint"] .btn.themed,#app[data-theme="lavender"] .btn.themed,
#app[data-theme="sky"] .btn.themed{background:rgba(0,0,0,.05)!important;}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:8px;
  background:rgba(139,123,255,.18);color:var(--accent2);border:1px solid var(--border);}
.toast{position:absolute;left:50%;bottom:calc(0.7cm + 110px);transform:translate(-50%,20px);opacity:0;
  background:rgba(20,22,40,.96);border:1px solid var(--border);color:#fff;padding:11px 18px;
  border-radius:14px;font-size:13px;transition:.3s;z-index:200;pointer-events:none;
  white-space:pre-line;text-align:center;max-width:80%;box-shadow:0 8px 30px rgba(0,0,0,.6);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.good{border-color:rgba(255,209,102,.5);box-shadow:0 0 22px rgba(255,209,102,.25);}

.slime{--sz:1;position:relative;z-index:5;width:140px;height:118px;flex:none;}
.slime .shadow{position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
  width:86px;height:12px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);
  animation:shadowPulse 3.4s ease-in-out infinite;}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.9}50%{transform:translateX(-50%) scaleX(1.08);opacity:.7}}
.slime .anim{position:absolute;left:0;top:0;width:140px;height:104px;transform-origin:50% 100%;}
.slime .breath{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.slime .blob{position:absolute;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;}
.slime .outer{
  inset:0 3px;
  background:hsl(var(--h) var(--s) calc(var(--l) + 8%) / .4);
  border:1.5px solid hsl(var(--h) var(--s) calc(var(--l) + 26%) / .55);
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.16),inset 8px 8px 16px rgba(255,255,255,.28);
}
.slime .inner{
  inset:9px 10px 0 10px;
  border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;
  background:radial-gradient(circle at 36% 22%,
    hsl(var(--h) var(--s) calc(var(--l) + 22%)),
    hsl(var(--h) var(--s) var(--l)) 58%,
    hsl(var(--h) var(--s) calc(var(--l) - 13%)));
  box-shadow:inset -6px -8px 14px rgba(0,0,0,.18),0 0 18px hsl(var(--h) var(--s) var(--l) / .28);
}
.slime .inner::after{content:'';position:absolute;left:22%;top:14%;width:22px;height:14px;
  border-radius:50%;background:rgba(255,255,255,.5);filter:blur(2px);transform:rotate(-20deg);}
.slime .eyes{position:absolute;left:0;right:0;top:57%;display:flex;justify-content:center;gap:24px;}
.slime .eye{width:14px;height:18px;border-radius:50%;position:relative;
  background:hsl(var(--eh) var(--es) var(--el));animation:blink 4.6s infinite;}
.slime .eye::after{content:'';position:absolute;left:3px;top:3px;width:5px;height:6px;
  border-radius:50%;background:rgba(255,255,255,.9);}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.slime .fx{position:absolute;inset:0;pointer-events:none;}

/* ============ 属性装饰层：已全部移除（用户要求不要任何附加形状），保留空容器与 data-el 供将来扩展 ============ */
.slime .mark{position:absolute;inset:0;pointer-events:none;z-index:1;}

/* 眼睛始终在最上层（与上面的空装饰层保持层叠约定） */
.slime .eyes{z-index:3;}

.slime .halo{display:none;position:absolute;right:0;top:-20px;width:58px;height:32px;pointer-events:none;}
.slime[data-mood="happy"] .halo{display:block;}
.slime .halo .fh{position:absolute;font-size:15px;line-height:1;animation:flSpin 2.2s linear infinite;transform-origin:50% 50%;}
.slime .halo .fh1{right:0;top:0;}
.slime .halo .fh2{right:24px;top:6px;animation-duration:2.8s;animation-direction:reverse;}
@keyframes flSpin{to{transform:rotate(360deg)}}

.slime[data-mood="sleep"] .eye{height:4px;width:16px;border-radius:3px;margin-top:7px;animation:none;}
.slime[data-mood="sleep"] .eye::after{display:none;}
.slime[data-mood="sleep"] .breath{animation-duration:5.2s;}
.slime[data-mood="sleep"] .fx::before{content:'z';position:absolute;right:8px;top:-4px;font-size:17px;
  font-weight:800;color:#9fb6ff;animation:zzz 2.6s infinite;font-style:italic;}
.slime[data-mood="sleep"] .fx::after{content:'z';position:absolute;right:-1px;top:-18px;font-size:12px;
  font-weight:800;color:#7f96df;animation:zzz 2.6s .9s infinite;font-style:italic;}
@keyframes zzz{0%{opacity:0;transform:translate(0,8px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(9px,-18px) scale(1.15)}}

.slime[data-mood="look"] .eye{animation:lookaround 3.2s ease-in-out infinite;}
@keyframes lookaround{0%,100%{transform:translateX(0)}18%,40%{transform:translateX(-6px)}58%,80%{transform:translateX(6px)}}

.slime[data-mood="fear"] .anim{animation:shake .11s infinite;}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.slime[data-mood="fear"] .fx::before{content:'〰〰';position:absolute;left:-25px;top:24%;font-size:13px;
  color:#7fd3ff;font-weight:700;transform:rotate(-50deg);animation:wig .22s infinite alternate;}
.slime[data-mood="fear"] .fx::after{content:'〰〰';position:absolute;right:-25px;top:24%;font-size:13px;
  color:#7fd3ff;font-weight:700;transform:rotate(50deg);animation:wig .22s infinite alternate-reverse;}
@keyframes wig{from{opacity:.25}to{opacity:1}}

/* 甩动 / 害怕 眼睛样式 "> <" */
.slime[data-mood="swing"] .eye,
.slime[data-mood="fear"] .eye{
  background:none; height:16px; width:18px; box-sizing:border-box;
  border:0; border-radius:0; animation:none; transform:translateY(2px); position:relative;
}
.slime[data-mood="swing"] .eye::before,
.slime[data-mood="fear"] .eye::before{
  content:''; position:absolute; top:50%; width:10px; height:10px;
}
.slime[data-mood="swing"] .eye:first-child::before,
.slime[data-mood="fear"] .eye:first-child::before{
  left:1px;
  border-top:4px solid hsl(var(--eh) var(--es) var(--el));
  border-right:4px solid hsl(var(--eh) var(--es) var(--el));
  transform:translateY(-50%) rotate(45deg);
}
.slime[data-mood="swing"] .eye:last-child::before,
.slime[data-mood="fear"] .eye:last-child::before{
  right:1px;
  border-top:4px solid hsl(var(--eh) var(--es) var(--el));
  border-left:4px solid hsl(var(--eh) var(--es) var(--el));
  transform:translateY(-50%) rotate(-45deg);
}
.slime[data-mood="swing"] .eye::after,
.slime[data-mood="fear"] .eye::after{display:none;}

.slime[data-mood="happy"] .eye{background:none;height:12px;width:17px;box-sizing:border-box;
  border:3px solid hsl(var(--eh) var(--es) var(--el));border-bottom-color:transparent;
  border-left-color:transparent;border-right-color:transparent;border-radius:50%;
  animation:none;transform:translateY(3px);}
.slime[data-mood="happy"] .eye::after{display:none;}

.slime[data-mood="like"] .eye{background:none;height:12px;width:17px;box-sizing:border-box;
  border:3px solid hsl(var(--eh) var(--es) var(--el));border-bottom-color:transparent;
  border-left-color:transparent;border-right-color:transparent;border-radius:50%;
  animation:none;transform:translateY(3px);}
.slime[data-mood="like"] .eye::after{display:none;}
.slime[data-mood="like"] .fx::before{content:'💗';position:absolute;right:-4px;top:16%;font-size:14px;
  line-height:1;animation:heartPop 1.8s ease-out infinite;font-style:normal;}
.slime[data-mood="like"] .fx::after{content:'💗';position:absolute;right:4px;top:36%;font-size:10px;
  line-height:1;animation:heartPop 1.8s .6s ease-out infinite;font-style:normal;}
@keyframes heartPop{
  0%{opacity:0;transform:translate(0,0) scale(.5);}
  20%{opacity:1;transform:translate(2px,-4px) scale(1);}
  100%{opacity:0;transform:translate(14px,-32px) scale(1.05);}
}

/* 魅惑状态 */
.slime[data-mood="charm"] .eye{background:none;height:14px;width:16px;box-sizing:border-box;
  border:0;border-radius:0;animation:none;transform:none;position:relative;}
.slime[data-mood="charm"] .eye::before{content:'♥';position:absolute;left:0;top:0;font-size:16px;color:hsl(var(--eh) var(--es) var(--el));line-height:1;animation:heartBeat 1.5s infinite;}
.slime[data-mood="charm"] .eye::after{display:none;}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.slime[data-mood="charm"] .fx::before{content:'❤️';position:absolute;left:0;top:20%;font-size:12px;animation:heartFloat1 2s ease-out infinite;}
.slime[data-mood="charm"] .fx::after{content:'💖';position:absolute;right:0;top:30%;font-size:16px;animation:heartFloat2 2.3s ease-out infinite;}
@keyframes heartFloat1{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-10px,-40px) scale(1.2)}}
@keyframes heartFloat2{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(15px,-35px) scale(1.1)}}

.slime[data-mood="deadpan"] .fx::before{content:'';position:absolute;right:6px;top:-4px;
  width:2.5px;height:24px;background:#33384e;border-radius:2px;
  box-shadow:5px 0 0 #33384e,-5px 0 0 #33384e;}

.slime[data-mood="jump"] .anim{animation:jump .95s cubic-bezier(.3,0,.5,1) infinite;}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.14,.84)}
  42%{transform:translateY(-34px) scale(.92,1.1)}62%{transform:translateY(-38px) scale(.95,1.06)}
  86%{transform:translateY(0) scale(1.12,.88)}}
.slime[data-mood="crawl"] .anim{animation:crawl 1.7s ease-in-out infinite;}
@keyframes crawl{0%{transform:translateX(-16px) scale(1.08,.92) rotate(-3deg)}
  50%{transform:translateX(16px) scale(.92,1.08) rotate(3deg)}
  100%{transform:translateX(-16px) scale(1.08,.92) rotate(-3deg)}}

.slime[data-dead="1"] .eye::after{display:none;}
.slime[data-dead="1"] .halo{display:none!important;}
.slime[data-dead="1"] .fx::before,.slime[data-dead="1"] .fx::after{display:none!important;}

.slime[data-ghost="1"] .outer{opacity:.6;}

.modal{background:#121422;border:1px solid var(--border);border-radius:22px;
  padding:18px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative;color:var(--text);}
.modal::-webkit-scrollbar{width:0;}
.close{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:none;
  background:rgba(255,255,255,.09);color:#aab;font-size:14px;cursor:pointer;z-index:2;}
.detail-slime{display:flex;justify-content:center;align-items:center;margin:2px 0 4px;height:104px;overflow:hidden;position:relative;z-index:5;}
.detail-slime .slime{transform:scale(.8);}
.detail h3{margin:0 0 12px;font-size:18px;text-align:center;color:var(--accent2);}
.trait-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.trait-chip{font-size:11px;padding:4px 9px;border-radius:9px;background:rgba(255,209,102,.15);
  color:var(--gold);border:1px solid rgba(255,209,102,.3);}
.act-grid .btn{width:100%;}
.summon-result{text-align:center;}
.sr-title{font-size:18px;font-weight:800;color:var(--gold);letter-spacing:2px;margin-bottom:4px;
  text-shadow:0 0 20px rgba(255,209,102,.6);}
.sr-slime{display:flex;justify-content:center;height:104px;align-items:center;overflow:hidden;position:relative;z-index:5;}
.sr-slime .slime{transform:scale(.8);}
.sr-name{font-size:16px;font-weight:700;margin:2px 0 10px;color:var(--accent2);}
.sr-props{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
.sr-props span{font-size:11.5px;padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.07);
  color:var(--text);border:1px solid var(--border);}
.plan-options{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.plan-options button{width:100%;}
.merge-list .minicard.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.3);}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-bottom:12px;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:4.5px 0;
  border-bottom:1px dashed var(--border);font-size:12px;line-height:1.4;}
.info-row span{color:var(--muted);font-size:11px;white-space:nowrap;}
.info-row b{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.info-row b.lv-exp{font-size:11.5px;white-space:normal;}
.stat-section-title{font-size:11.5px;color:var(--accent2);font-weight:600;margin:12px 0 6px;}

.rename-btn{background:none;border:none;padding:0 2px;font-size:14px;line-height:1;
  color:var(--muted);cursor:pointer;opacity:.7;transition:.15s;flex:none;}
.rename-btn:hover,.rename-btn:active{opacity:1;color:var(--accent2);}

.edit-label{display:block;font-size:11.5px;color:var(--muted);margin-top:8px;}

.team-alert{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;color:#000;font-size:11px;font-weight:900;line-height:14px;text-align:center;
  z-index:5;box-shadow:0 0 6px rgba(255,255,255,.8);pointer-events:none;}

#gameOverlay{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0%,var(--bgTop) 0%,var(--bgMid) 55%,var(--bgBot) 100%);
  padding:calc(0.7cm + 10px) 12px calc(0.7cm + 12px);}
.game-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;row-gap:8px;
  font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:8px 12px;flex:none;backdrop-filter:blur(8px);}
.game-hud .hud-title{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:1;}
.game-hud .hud-speeds{flex:1 1 100%;order:3;display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.game-hud .hud-close{flex:none;order:2;}
.game-hud b{color:var(--gold);font-variant-numeric:tabular-nums;}
.game-hud .hud-close{background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:6px 12px;border-radius:10px;font-size:12px;font-family:inherit;cursor:pointer;}
.game-hud .hud-close:active{transform:scale(.96);}
.game-field{position:relative;flex:1;margin-top:10px;border-radius:16px;overflow:hidden;
  border:1px solid var(--border);
  background:radial-gradient(circle at 50% 30%,rgba(139,123,255,.12),rgba(0,0,0,.3));}
.game-slime{position:absolute;transform:translate(-50%,-50%);transition:left .55s linear;z-index:5;}
.game-slime .slime{transform:scale(.45);}
.game-ball{position:absolute;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 34% 30%,#fff6c0,#ffd166 52%,#c98f00);
  box-shadow:0 0 16px rgba(255,209,102,.75),inset -4px -4px 8px rgba(0,0,0,.28);
  z-index:10;cursor:pointer;transition:opacity .2s;}
.game-ball.hidden{opacity:0;pointer-events:none;}
.catch-line{position:absolute;left:0;right:0;top:66.67%;height:0;border-top:3px dashed #3b82f6;z-index:2;pointer-events:none;}
.catch-line::after{content:'接球线';position:absolute;right:10px;top:-18px;font-size:11px;color:#3b82f6;font-weight:800;}
.out-line{position:absolute;left:0;right:0;top:83.33%;height:0;border-top:3px dashed rgba(248,113,113,.75);z-index:2;pointer-events:none;}
.out-line::after{content:'出界线';position:absolute;right:10px;top:-18px;font-size:11px;color:#f87171;font-weight:800;}
.catch-zone{position:absolute;left:0;right:0;bottom:0;height:33.33%;
  background:linear-gradient(to top,rgba(74,222,128,.12),transparent);pointer-events:none;z-index:1;}

/* 深渊战斗 */
.battle-field{position:relative;flex:1;margin-top:10px;border-radius:16px;overflow:hidden;
  border:1px solid var(--border);
  background:
    radial-gradient(circle at 50% 12%, rgba(120,38,55,.38), rgba(28,10,20,.9) 55%, rgba(8,3,9,.98) 100%),
    linear-gradient(180deg, rgba(20,6,14,.96), rgba(6,2,8,1));}

.battle-row.enemy{top:6%;height:26%;align-items:flex-end;}
.battle-row.ally{bottom:6%;height:26%;align-items:flex-start;}

.battle-row{position:absolute;left:0;right:0;display:flex;justify-content:space-around;padding:0 6px;z-index:2;}
.battle-unit{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:70px;}

.slime-wrap{
  position:relative;
  width:54px;height:44px;
  display:flex;justify-content:center;align-items:flex-end;
  overflow:visible;
}
.slime-wrap .slime{
  position:absolute;
  left:50%;bottom:0;
  transform:translateX(-50%) scale(.36);
  transform-origin:bottom center;
  z-index:5;
}
.battle-unit .hpbar{
  position:absolute;
  bottom:calc(100% + 6px);
  left:50%;transform:translateX(-50%);
  width:48px;height:5px;border-radius:3px;
  background:rgba(0,0,0,.5);
  overflow:hidden;
  z-index:25;
  pointer-events:none;
}
.battle-unit .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24);transition:width .3s;}

/* 护盾条（极窄） */
.battle-unit .shieldbar{
  position:absolute;
  bottom:calc(100% + 12px);
  left:50%;transform:translateX(-50%);
  width:48px;height:2px;border-radius:2px;
  background:rgba(0,0,0,.5);
  overflow:hidden;
  z-index:26;
  pointer-events:none;
  display:none;
}
.battle-unit .shieldbar.show{display:block;}
.battle-unit .shieldbar i{display:block;height:100%;width:100%;background:#fff;box-shadow:0 0 4px #fff;transition:width .3s;}

.battle-unit .uname{
  font-size:9px;color:#e8e9f3;
  max-width:68px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:center;
  margin-top:0;
}

.battle-log{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
  font-size:11px;color:#ffd166;text-align:center;line-height:1.5;pointer-events:none;padding:0 8px;
  z-index:10;
}
/* 阵亡观感沿用第一版：身体留在原地、data-dead 平眼，不做灰化/💀 标记 */

.slime-wrap.attack-jump{animation:unitJump .65s cubic-bezier(.3,0,.5,1);}@keyframes unitJump{
  0%{transform:translateY(0);}
  25%{transform:translateY(-16px);}
  55%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

.skill-ring{
  position:absolute;width:20px;height:20px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:3px solid hsl(var(--h) var(--s) var(--l));
  box-shadow:0 0 24px hsl(var(--h) var(--s) var(--l));
  animation:ringExpand .75s ease-out forwards;
  pointer-events:none;z-index:15;
}
@keyframes ringExpand{
  0%{width:12px;height:12px;opacity:1;}
  100%{width:100px;height:100px;opacity:0;}
}
.skill-orb{
  position:absolute;width:12px;height:12px;border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:16;
}
.heal-dot{
  position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:16;
}

.capture-btn{position:absolute;top:-32px;left:50%;transform:translateX(-50%);z-index:30;
  font-size:10px;padding:2px 8px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;font-family:inherit;cursor:pointer;
  white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.45);}

.speed-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:8px;font-size:11px;font-family:inherit;cursor:pointer;transition:.15s;}
.speed-btn.on{background:linear-gradient(135deg,var(--gold),var(--accent2));color:#2a1e00;border-color:transparent;font-weight:700;}

/* 战斗技能条（插话 / 逐回合模式） */
.skill-bar{
  position:absolute;left:6px;right:6px;bottom:3px;z-index:28;
  display:flex;align-items:center;gap:4px;
  padding:3px 4px;border-radius:10px;
  background:rgba(10,6,16,.74);border:1px solid rgba(255,255,255,.12);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
}
.skill-bar.hide{display:none;}
.sk-unit{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:0;
  min-width:34px;padding:2px 3px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:#e8e9f3;font:9px/1.15 inherit;font-family:inherit;cursor:pointer;
}
.sk-unit.on{border-color:var(--gold);background:rgba(255,209,102,.18);box-shadow:inset 0 0 0 1px var(--gold);}
.sk-ic{font-size:11px;line-height:1.1;}
.sk-nm{max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sk-acts{display:flex;gap:4px;flex:none;padding-left:4px;border-left:1px solid rgba(255,255,255,.14);}
.sk-act{
  flex:none;padding:3px 6px;border-radius:7px;font:10px/1.2 inherit;font-family:inherit;
  background:linear-gradient(135deg,rgba(255,209,102,.92),rgba(255,140,90,.92));
  color:#2a1e00;border:none;font-weight:700;cursor:pointer;white-space:nowrap;
}
.sk-act.ghost{background:rgba(255,255,255,.1);color:#cfd3e6;font-weight:400;border:1px solid rgba(255,255,255,.16);}
.sk-act:disabled{background:rgba(255,255,255,.09);color:#8b93a7;font-weight:400;border:1px solid rgba(255,255,255,.12);cursor:not-allowed;}
.battle-unit.targetable .slime-wrap{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:10px;
  animation:targetPulse 1s ease-in-out infinite;
}
@keyframes targetPulse{
  0%,100%{outline-color:rgba(255,209,102,.95);}
  50%{outline-color:rgba(255,209,102,.3);}
}
.abyss-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.abyss-row label{font-size:12px;color:var(--muted);flex:none;}
.abyss-level-input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,.07);color:var(--text);font-size:13px;outline:none;font-family:inherit;}
#app[data-theme="light"] .abyss-level-input,#app[data-theme="peach"] .abyss-level-input,
#app[data-theme="mint"] .abyss-level-input,#app[data-theme="lavender"] .abyss-level-input,
#app[data-theme="sky"] .abyss-level-input{background:rgba(0,0,0,.05);}
.abyss-step{padding:6px 10px;font-size:13px;border-radius:8px;flex:none;line-height:1;}

/* 冻结状态覆盖特效：半透明青色不规则多边形（底部平整） */
@keyframes frozenPulse {
  0% { opacity: 0.65; }
  100% { opacity: 1; }
}
.frozen-orb {
  position: absolute;
  left: 50%; bottom: 2px;
  transform: translateX(-50%);
  width: 56px; height: 50px;
  background: rgba(120, 220, 230, 0.38);
  border: 1.5px solid rgba(180, 245, 255, 0.9);
  clip-path: polygon(15% 10%, 38% 4%, 62% 8%, 88% 16%, 96% 48%, 92% 96%, 8% 96%, 4% 58%, 8% 28%);
  pointer-events: none;
  z-index: 9;
  animation: frozenPulse 1.6s ease-in-out infinite alternate;
  box-shadow: 0 0 14px rgba(120,220,230,.55), inset 0 0 12px rgba(200,250,255,.5);
}

/* 胜利庆祝小花 */
@keyframes flowerFall {
  0% { transform: translateY(-8px) rotate(0deg) scale(0.6); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(40px) rotate(200deg) scale(1); opacity: 0; }
}

/* ========== 野外探险画面 ========== */
.explore-scene{
  position:relative;height:130px;border-radius:14px;overflow:hidden;margin-top:10px;
  --sky1:#87CEEB; --sky2:#B0E0E6;
  --grass1:#4CAF50; --grass2:#388E3C;
  --soil1:#8D6E63; --soil2:#5D4037;
}
.bg-scroll{position:absolute;inset:0;display:flex;width:200%;animation:bgScroll 12s linear infinite;z-index:0;}
.bg-panel{flex:none;width:50%;height:100%;position:relative;}
.scene-sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2));}
.scene-grass{
  position:absolute;left:0;right:0;top:55%;bottom:0;
  background:linear-gradient(var(--grass1),var(--grass2));
  -webkit-mask-image:var(--grass-mask);mask-image:var(--grass-mask);
  -webkit-mask-size:50% 100%;mask-size:50% 100%;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;
  -webkit-mask-position:0 0;mask-position:0 0;
}
.scene-soil{
  position:absolute;left:0;right:0;top:80%;bottom:0;
  background:linear-gradient(var(--soil1),var(--soil2));
  -webkit-mask-image:var(--soil-mask);mask-image:var(--soil-mask);
  -webkit-mask-size:50% 100%;mask-size:50% 100%;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;
  -webkit-mask-position:0 0;mask-position:0 0;
}
@keyframes bgScroll{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

.explore-items-layer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.explore-item{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
  will-change:left, top, transform;
}
.explore-item .ei-icon{font-size:12px;line-height:1;display:block;}

.explore-empty{
  position:relative;z-index:3;
  background:rgba(8,10,20,.5);border:1px solid rgba(255,255,255,.18);
  color:#eef0f8;border-radius:8px;padding:3px 9px;backdrop-filter:blur(3px);
}
.explore-slimes{
  position:absolute;
  left:0;
  bottom:18%;
  width:45%;
  display:flex;
  align-items:flex-end;
  gap:0;
  padding-left:8px;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

.explore-slime{
  flex:none;position:relative;
  margin-right:-8px;
}
.explore-slime .slime{
  position:absolute;left:50%;bottom:0;
  transform:translateX(-50%) scale(var(--ex-scale, 0.18));
  transform-origin:bottom center;
}

.explore-scene .explore-slime:not(.explore-monster) .slime .eyes{justify-content:flex-end;padding-right:18%;}
.explore-scene .explore-monster .slime .eyes{justify-content:flex-start;padding-left:18%;padding-right:0;}

.explore-slime.jumping{
  animation:exploreJumpFast .38s ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes exploreJumpFast{
  0%,100%{transform:translateY(0);}
  35%{transform:translateY(-12px);}
  65%{transform:translateY(-6px);}
  100%{transform:translateY(0);}
}

.explore-slime.walking{
  animation:exploreWalkFast .9s ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes exploreWalkFast{
  0%{transform:translateX(0);}
  30%{transform:translateX(-6px);}
  70%{transform:translateX(6px);}
  100%{transform:translateX(0);}
}

.explore-btns{display:flex;gap:6px;margin-top:10px;}
.explore-btn{padding:8px 10px;font-size:12px;flex:1;white-space:nowrap;}

.tc-barwrap{display:flex;align-items:center;gap:4px;margin-bottom:4px;max-width:100%;}
.tc-bar-label{font-size:9px;color:var(--muted);width:24px;flex:none;text-align:right;}
.tc-bar{height:16px;position:relative;flex:1;border-radius:8px;overflow:hidden;}
.tc-bar i{position:absolute;left:0;top:0;height:100%;border-radius:8px;}
.tc-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;z-index:2;}

/* 迷你水史莱姆 */
@keyframes miniBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.mini-slime{
  position:absolute;
  width:30px;height:26px;
  pointer-events:none;
  z-index:30;
  animation:miniBob .8s ease-in-out infinite;
}
.mini-slime .slime{
  position:absolute;
  left:50%;bottom:0;
  transform-origin:bottom center;
}
.mini-slime.pos-right .slime{ transform:translateX(-50%) scale(0.20); }
.mini-slime.pos-left-back .slime{ transform:translateX(-50%) scale(0.18); }
.mini-slime.pos-left-front .slime{ transform:translateX(-50%) scale(0.16); }
.mini-slime.pos-right{ right:-16px; bottom:-8px; z-index:31; }
.mini-slime.pos-left-back{ left:-18px; bottom:-2px; z-index:29; }
.mini-slime.pos-left-front{ left:-5px; bottom:-10px; z-index:32; }
.mini-hpbar{
  position:absolute; left:50%; top:-6px; transform:translateX(-50%);
  width:22px; height:3px; border-radius:2px;
  background:rgba(0,0,0,.55);
  overflow:hidden;
  z-index:40;
}
.mini-hpbar i{ display:block; height:100%; background:linear-gradient(90deg,#f87171,#fbbf24); transition:width .3s; }
.mini-slime.pos-left-back .mini-hpbar{ width:20px; height:2.5px; top:-5px; }
.mini-slime.pos-left-front .mini-hpbar{ width:18px; height:2.5px; top:-5px; }

/* 护甲罩：史莱姆半透明身体形状（同比例放大并略上移） */
@keyframes shieldPulse {
  0% { opacity: 0.45; transform: translateX(-50%) scale(0.96); }
  100% { opacity: 0.95; transform: translateX(-50%) scale(1.04); }
}
.shield-orb {
  position: absolute;
  left: 50%; bottom: 3px;
  transform: translateX(-50%);
  width: 60px; height: 51px;
  border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
  pointer-events: none;
  z-index: 8;
  animation: shieldPulse 2s infinite alternate;
}
.shield-orb::after {
  content: '';
  position: absolute;
  left: 9%; top: 10%;
  width: 36%; height: 27%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 46% 46%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.42) 45%, rgba(255,255,255,0) 76%);
  transform: rotate(112deg);
  pointer-events: none;
}
.shield-orb.rock { border: 1px solid rgba(200, 150, 50, 0.85); box-shadow: inset 0 0 12px rgba(200, 150, 50, 0.45), inset 6px 8px 14px rgba(255,255,255,0.18), 0 0 10px rgba(200, 150, 50, 0.4); }
.shield-orb.ice { border: 1px solid rgba(56, 189, 248, 0.85); box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.45), inset 6px 8px 14px rgba(255,255,255,0.18), 0 0 10px rgba(56, 189, 248, 0.4); }

/* 系统史莱姆对话气泡 */
.sys-bubble{
  position:absolute;left:50%;top:14px;transform:translate(-50%,-100%) scale(.9);
  background:rgba(255,255,255,.95);color:#1a1e33;font-size:11px;line-height:1.2;
  padding:4px 9px;border-radius:11px;white-space:nowrap;pointer-events:none;z-index:70;

}

  100%{ filter: none; }
}
@keyframes fxHitFlashCrit{

  100%{ filter: none; transform: none; }
}
.fx-float{

  color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.85);

}
.fx-float.crit{ color:#ffd166; font-size:17px; }

.fx-float.weak{ color:#9aa7b8; font-size:11px; }

/* 血条残影：主条即时、残影延迟 240ms 追上 */
.battle-unit .hpbar i.ghost,
.battle-unit .shieldbar i.ghost{

.battle-unit .hpbar.low i:not(.ghost){

}
@keyframes fxLowPulse{
  0%,100%{ opacity:1; }
  50%{ opacity:.5; }
}
@keyframes fxFloatUp{
  0%{ opacity:0; transform:translate(-50%,6px) scale(.8); }

.field-shake[data-k="kill"]{ animation: fxShakeKill .14s linear 1; }
.field-shake[data-k="crit"]{ animation: fxShakeCrit .16s linear 1; }
@keyframes fxShakeLight{
  0%,100%{ transform:none; }
  25%{ transform:translate(-3px,1px); }
  50%{ transform:translate(2px,-1px); }
  75%{ transform:translate(-1px,1px); }

@keyframes fxShakeCrit{

}
@keyframes fxShakeKill{
  0%,100%{ transform:none; }

}
.fx-part{
  position:absolute; width:var(--sz,3px); height:var(--sz,3px);
  border-radius:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:28;
  animation: fxPart .62s ease-out forwards;
}
@keyframes fxPart{
  0%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-20px))) scale(.4); }

  100%{ transform:translateX(-50%) scale(calc(var(--die0,.36) * .72)); opacity:0; filter:brightness(.6); }
}
@media (prefers-reduced-motion: reduce){
  .field-shake{ animation: none !important; }

  const weights = {...ELEMENT_WEIGHTS};
  if(boost){
    for(const k in boost){
      if(weights[k] !== undefined) weights[k] += boost[k];

  const entries = Object.entries(weights);

  let r = Math.random()*total;
  for(const [k,v] of entries){ r -= v; if(r <= 0) return k; }

function staminaMax(s){ return Math.round(80 + (s.size || 1) * 40); }

function monMul(s){ return s.isMonster ? 2 : 1; }

function hpMax(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bhp') + traitBonus(s,'ball');
  return Math.round((100 * (s.size || 1) + (s.str || 0) * 3 * m + (s.level || 1) * 10) * personaMul(s,'hp') * bonus);
}
function physAtk(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'batk') + traitBonus(s,'ball');
  return Math.round((s.str * 2 * m + s.level * 3) * personaMul(s,'atk') * bonus);
}
function magAtk(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bmatk') + traitBonus(s,'ball');
  return Math.round((s.mag * 2 * m + s.level * 3) * personaMul(s,'matk') * bonus);
}
function atkSpeed(s){
  const m = monMul(s);
  const bonus = 1 + traitBonus(s,'bspd') + traitBonus(s,'ball');
  return Math.round((100 + s.agi * m) * personaMul(s,'speed') * bonus);
}
function dodgeRate(s){
  const agi = s.agi * monMul(s);
  const base = agi / (agi + 60) * 100 * 0.2;
  let add = (traitBonus(s,'bdodge') + traitBonus(s,'ball')) * 100;
  if(s.element === '风') add += 20;
  return clamp(Math.round(base + add), 0, 70);
}
function critRate(s){
  const luck = (s.luck||0) * monMul(s);
  const base = luck / (luck + 80) * 100;
  const add = (traitBonus(s,'bcrit') + traitBonus(s,'ball')) * 100;
  return clamp(Math.round(base + add), 0, 30);
}
function manaMax(s){
  const bonus = 1 + traitBonus(s,'bmana') + traitBonus(s,'ball');
  return Math.round(s.mag * 10 * monMul(s) * bonus);
}
function loadCap(s){ return s.str * 5; }
function expRate(s){ return 1 + (s.wit||0) * 0.02; }
function skillApt(s){ return s.wit||0; }

function slimePower(s){
  return Math.round(
    physAtk(s) + magAtk(s) + hpMax(s) * 0.5 + atkSpeed(s) * 0.3 +
    dodgeRate(s) * 2 + critRate(s) * 2 + manaMax(s) * 0.1
  );
}

function normalizeSlime(s){
  delete s.hunger;
  if(s.resting === undefined) s.resting = false;
  if(typeof s.mood !== 'number') s.mood = 70;
  if(typeof s.size !== 'number') s.size = 1;
  if(typeof s.intimacy !== 'number') s.intimacy = 0;
  if(typeof s.strPotential !== 'number'){
    const base = 10;
    s.strPotential = clamp(base + rndInt(-3, 3), 5, 20);
    s.agiPotential = clamp(base + rndInt(-3, 3), 5, 20);
    s.magPotential = clamp(base + rndInt(-3, 3), 5, 20);
    s.luck = rndInt(0, 10);
    s.wit = rndInt(0, 10);
  }
  if(typeof s.luck !== 'number') s.luck = rndInt(0,10);
  if(typeof s.wit !== 'number') s.wit = rndInt(0,10);
  const lv = s.level || 1;
  if(typeof s.str !== 'number') s.str = s.strPotential * lv;
  if(typeof s.agi !== 'number') s.agi = s.agiPotential * lv;
  if(typeof s.mag !== 'number') s.mag = s.magPotential * lv;
  const stMax = staminaMax(s);
  if(typeof s.stamina !== 'number') s.stamina = stMax;
  s.stamina = clamp(s.stamina, 0, stMax);
  if(typeof s.hp !== 'number' || s.hp <= 0) s.hp = hpMax(s);
  if(!s.traits) s.traits = [];
  s.traits.forEach(refreshTraitDesc);
  if(!s.personality) s.personality = pick(PERSONALITIES);
  if(s.isMonster){
    if(typeof s.monSat !== 'number') s.monSat = rnd(18,58);
    if(typeof s.monLight !== 'number') s.monLight = rnd(14,34);
  }
  if(!s.skill){
    s.skill = HEAL_ELEMENTS.includes(s.element) ? '治疗' : '元素弹';
  }
  return s;
}

function slimeColor(s){
  if(s.colorOverride) return s.colorOverride;
  if(s.isMonster){
    if(typeof s.monSat !== 'number') s.monSat = rnd(18,58);
    if(typeof s.monLight !== 'number') s.monLight = rnd(14,34);
    return {h: ELEMENTS[s.element] ? ELEMENTS[s.element].h : 280, s:s.monSat, l:s.monLight};
  }
  const el = ELEMENTS[s.element] || ELEMENTS['空间'];
  const talent = calcTalent(s);
  const h = el.h;
  const sat = clamp((44 + talent*0.34) * el.sat, 12, 96);
  let lig = clamp(38 + (s.morality+100)/200*20 + talent*0.09, 20, 84);
  if(s.element === '暗') lig = clamp(lig - 28, 6, 34);
  return {h, s:sat, l:lig};

  if(s.isMonster) return {h: ELEMENTS[s.element] ? ELEMENTS[s.element].h : 280, s:10, l:50};

function traitBonus(s,key){

function slimeExpNeed(level){ return 100 + level*80; }

function addSummonerExp(amount){
  if(S.breakPending) return;
  if(amount <= 0) return;
  S.summonerExp += amount;
  let guard = 0;
  while(S.summonerExp >= summonerNeed(S.level) && guard++ < 100){
    S.summonerExp -= summonerNeed(S.level);
    S.level++;
    if(S.level % 10 === 0){
      S.breakPending = true;
      S.summonerExp = 0;
      toast(`👑 召唤师达到 Lv.${S.level}！\n需要手动突破才能继续升级`, 'good');
      break;
    }
  }
}

  if(s.resting) return false;
  if(plan.global && plan.type === 'explore' && S.exploreTeam !== null){
    return S.exploreTeam.includes(s.id);

function stopExploreItems(){
  exploreRunning = false;
  if(exploreRAF){ cancelAnimationFrame(exploreRAF); exploreRAF = null; }
  if(exploreSpawnTimer){ clearInterval(exploreSpawnTimer); exploreSpawnTimer = null; }
  exploreItems = [];
  exploreLayer = null;
  exploreLastT = 0;
}

function startExploreItems(){
  stopExploreItems();
  const scene = document.querySelector('.explore-scene');
  if(!scene) return;
  /* 没有史莱姆在探险时，不生成任何物品 */
  if(!S.slimes.some(s=>isDispatched(s))) return;
  let layer = scene.querySelector('.explore-items-layer');
  if(!layer){
    layer = document.createElement('div');
    layer.className = 'explore-items-layer';
    scene.appendChild(layer);
  }
  exploreLayer = layer;
  exploreItems = [];
  exploreLastT = 0;
  exploreRunning = true;

  exploreSpawnTimer = setInterval(()=>{
    if(!exploreRunning) return;
    if(!layer.isConnected){ stopExploreItems(); return; }
    spawnExploreItem(layer);
  }, 5000 + Math.random()*4000);

  exploreRAF = requestAnimationFrame(function loop(t){
    if(!exploreRunning) return;
    if(!exploreLastT) exploreLastT = t;
    const dt = Math.min(0.05, (t - exploreLastT)/1000);
    exploreLastT = t;
    updateExploreItems(dt);
    exploreRAF = requestAnimationFrame(loop);
  });
}

    id: -1, name: `${element}魔物`, element, isMonster:true, level:lv, size,

  };

function spawnExploreItem(layer){
  if(!layer || !layer.isConnected) return;
  const r = Math.random();
  let type;
  if(r < 0.40) type = 'coin';
  else if(r < 0.60) type = 'exp';
  else if(r < 0.80) type = 'food';
  else if(r < 0.88) type = 'point';
  else if(r < 0.96) type = 'monster';
  else type = 'treasure';

  const el = document.createElement('div');
  el.className = 'explore-item explore-item-' + type;
  const x = 100;
  const y = 67 + Math.random()*13;
  el.style.left = x + '%';
  el.style.top = y + '%';

  let monster = null;
  let value = 0;

  if(type === 'monster'){
    monster = makeExploreMonster();
    const scale = 0.18;
    const w = 26, h = 22;
    const isJump = Math.random() < 0.5;
    el.innerHTML = `<div class="explore-slime explore-monster ${isJump?'jumping':'walking'}"
      style="width:${w}px;height:${h}px;--ex-scale:${scale};--delay:0s;"
      data-next-toggle="0">
      ${slimeHTML(monster,{mood:'idle'})}
    </div>`;
  } else {
    const icons = {coin:'🪙', exp:'🧪', food:'🍖', point:'⭐', treasure:'💎'};
    el.innerHTML = `<span class="ei-icon">${icons[type]}</span>`;
    if(type==='coin') value = rndInt(30,80);
    else if(type==='exp') value = rndInt(20,50);
    else if(type==='food') value = 1;
    else if(type==='point') value = rndInt(1,2);
    else if(type==='treasure') value = 1;
  }

  layer.appendChild(el);
  exploreItems.push({
    el, type, x, y, speed: 8 + Math.random()*6,
    monster, value, fleeing:false, fleeVx:0, fleeVy:0, fleeAngle:0
  });
}

function rectsIntersect(a, b){
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function applyExploreReward(item, slime){
  const kind = item.type;
  const base = item.value || 0;
  if(kind === 'coin'){
    const mult = 1 + slimePower(slime)/500;
    const gain = Math.round(base * mult);
    S.coins += gain;
    S.totalEarned += gain;
  } else if(kind === 'point'){
    S.points += base;
  } else if(kind === 'food'){
    S.bag.food += base;
  } else if(kind === 'exp'){
    addExp(slime, base);
  } else if(kind === 'treasure'){
    S.bag.treasure += base;
  }
  save(); renderTop();
}

function triggerMonsterReactions(monster, slimeRects){
  if(!monster || !slimeRects || !slimeRects.length) return;
  const monPower = slimePower(monster);
  const arr = slimeRects;
  arr.forEach((sr, idx)=>{
    if(Math.random() < 0.25){
      const slimeEl = sr.el.querySelector('.slime');
      if(!slimeEl) return;
      slimeEl.dataset.mood = 'fear';
      setTimeout(()=>{ if(slimeEl.isConnected) slimeEl.dataset.mood = 'idle'; }, 1600);
      if(slimePower(sr.s) > monPower){
        let nIdx = idx + (Math.random() < 0.5 ? -1 : 1);
        if(nIdx < 0) nIdx = idx + 1;
        if(nIdx >= arr.length) nIdx = idx - 1;
        if(nIdx >= 0 && nIdx < arr.length){
          const nEl = arr[nIdx].el.querySelector('.slime');
          if(nEl){
            nEl.dataset.mood = 'deadpan';
            setTimeout(()=>{ if(nEl.isConnected) nEl.dataset.mood = 'idle'; }, 1600);
          }
        }
      }
    }
  });
}

function updateExploreItems(dt){
  const scene = document.querySelector('.explore-scene');
  if(!scene){ stopExploreItems(); return; }
  const slimeEls = scene.querySelectorAll('.explore-slime');
  const slimeRects = [];
  slimeEls.forEach(el=>{
    if(el.closest('.explore-item')) return;
    const r = el.getBoundingClientRect();
    if(r.width === 0) return;
    const sid = +el.dataset.sid;
    const s = getSlime(sid);
    if(!s) return;
    slimeRects.push({el, sid, s, rect:r});
  });

  for(let i = exploreItems.length - 1; i >= 0; i--){
    const item = exploreItems[i];
    if(!item.el.isConnected){ exploreItems.splice(i,1); continue; }

    if(item.fleeing){
      item.x += item.fleeVx * dt;
      item.y += item.fleeVy * dt;
      item.fleeAngle += 540 * dt;
      item.el.style.left = item.x + '%';
      item.el.style.top = item.y + '%';
      const inner = item.el.querySelector('.explore-slime');
      if(inner){
        inner.style.animation = 'none';
        inner.style.transformOrigin = 'center center';
        inner.style.transform = `rotate(${item.fleeAngle}deg)`;
      }
      if(item.x > 130 || item.y < -40){
        item.el.remove();
        exploreItems.splice(i,1);
      }
      continue;
    }

    item.x -= item.speed * dt;
    item.el.style.left = item.x + '%';

    const itemRect = item.el.getBoundingClientRect();
    let hit = null;
    for(const sr of slimeRects){
      if(rectsIntersect(itemRect, sr.rect)){ hit = sr; break; }
    }

    if(hit){
      if(item.type === 'monster'){
        item.fleeing = true;
        const speed = 45 + Math.random()*15;
        const angle = 20 * Math.PI / 180;
        item.fleeVx = speed * Math.cos(angle);
        item.fleeVy = -speed * Math.sin(angle);
        item.fleeAngle = 0;
        triggerMonsterReactions(item.monster, slimeRects);
      } else {
        applyExploreReward(item, hit.s);
        const slimeEl = hit.el.querySelector('.slime');
        if(slimeEl && Math.random() < 0.65){
          slimeEl.dataset.mood = 'happy';
          setTimeout(()=>{ if(slimeEl.isConnected) slimeEl.dataset.mood = 'idle'; }, 1500);
        }
        item.el.remove();
        exploreItems.splice(i,1);
        continue;
      }
    }

    if(item.x < -15){
      item.el.remove();
      exploreItems.splice(i,1);
    }
  }
}

function renderExploreScene(){
  const map = MAP_THEMES[S.exploreMapIndex] || MAP_THEMES[0];
  const dispatched = S.slimes.filter(s => isDispatched(s));
  const now = Date.now();

  function buildSlimeEl(s, i, opts){
    opts = opts || {};
    const scaleMul = opts.scaleMul || 1;
    const preferWalk = !!opts.preferWalk;
    const isJump = preferWalk ? Math.random() < 0.3 : Math.random() < 0.5;
    const nextToggle = now + 500 + Math.random() * 800;
    const sz = clamp(s.size || 1, 0.6, 1.6);
    const scale = 0.18 * sz * scaleMul;
    const w = Math.round(26 * sz * scaleMul);
    const h = Math.round(22 * sz * scaleMul);
    return `
    <div class="explore-slime ${isJump?'jumping':'walking'}"
         style="width:${w}px;height:${h}px;--ex-scale:${scale.toFixed(3)};--delay:${(i*0.2).toFixed(2)}s"
         data-sid="${s.id}"
         data-row="${opts.row || 'back'}"
         data-next-toggle="${nextToggle}">
      ${slimeHTML(s,{mood:'idle'})}
    </div>`;
  }

  let slimesHTML;
  if(!dispatched.length){
    slimesHTML = `<div class="explore-slimes" style="bottom:18%;">
      <span class="explore-empty small">暂无史莱姆在探险</span>
    </div>`;
  } else if(dispatched.length <= 5){
    slimesHTML = `<div class="explore-slimes" style="bottom:18%;">
      ${dispatched.map((s,i)=>buildSlimeEl(s,i,{row:'back'})).join('')}
    </div>`;
  } else {
    const half = Math.ceil(dispatched.length / 2);
    let rowBack = dispatched.slice(0, half);
    let rowFront = dispatched.slice(half);

    const sortedBySize = [...dispatched].sort((a,b)=>(b.size||1)-(a.size||1));
    const top3Ids = new Set(sortedBySize.slice(0,3).map(x=>x.id));
    const lastFront = rowFront[rowFront.length - 1];
    if(lastFront && top3Ids.has(lastFront.id)){
      let swapped = false;
      for(let i = rowFront.length - 2; i >= 0; i--){
        if(!top3Ids.has(rowFront[i].id)){
          const tmp = rowFront[i];
          rowFront[i] = rowFront[rowFront.length - 1];
          rowFront[rowFront.length - 1] = tmp;
          swapped = true;
          break;
        }
      }
      if(!swapped){
        for(let i = rowBack.length - 1; i >= 0; i--){
          if(!top3Ids.has(rowBack[i].id)){
            const tmp = rowBack[i];
            rowBack[i] = rowFront[rowFront.length - 1];
            rowFront[rowFront.length - 1] = tmp;
            swapped = true;
            break;
          }
        }
      }
    }

    slimesHTML = `
      <div class="explore-slimes" style="bottom:22.2%;">
        ${rowBack.map((s,i)=>buildSlimeEl(s,i,{row:'back', scaleMul:0.99})).join('')}
      </div>
      <div class="explore-slimes" style="bottom:14.4%;">
        ${rowFront.map((s,i)=>buildSlimeEl(s,i,{row:'front', scaleMul:0.8, preferWalk:true})).join('')}
      </div>`;
  }

  return `
    <div class="explore-scene" style="--sky1:${map.sky1};--sky2:${map.sky2};--grass1:${map.grass1};--grass2:${map.grass2};--soil1:${map.soil1};--soil2:${map.soil2};">
      <div class="bg-scroll">
        <div class="bg-panel">
          <div class="scene-sky"></div>
          <div class="scene-grass"></div>
          <div class="scene-soil"></div>
        </div>
        <div class="bg-panel">
          <div class="scene-sky"></div>
          <div class="scene-grass"></div>
          <div class="scene-soil"></div>
        </div>
      </div>
      <div class="explore-items-layer"></div>
      ${slimesHTML}
    </div>`;
}

function initPlayground(){
  const pg = $('#playground');
  if(!pg) return;
  plSlimes.forEach(p=>{
    if(p.timer) clearInterval(p.timer);
    if(p.bubbleTimer) clearInterval(p.bubbleTimer);
  });
  plSlimes = [];

  const isMonster = S.spaceMode === 'monster';
  const idle = isMonster ? S.monsters : S.slimes.filter(s=>!isDispatched(s));
  const sprites = isMonster ? idle.slice() : idle.concat([getSystemSlimeObj()]);
  const mainMoods = ['idle','jump','crawl','sleep','look'];
  const placed = [];
  const pgW = pg.clientWidth || 340, pgH = pg.clientHeight || 380;
  let suppressClick = false;

  const MAX_DISP_SCALE = 0.43 * 1.6;
  const NON_SYS_SCALE = 0.72; /* 非系统史莱姆缩小比例 */
  const maxSizeInSpace = sprites.length
    ? Math.max(...sprites.map(x=>clamp(x.size || 1, 0.6, 1.6)))
    : 1;

  function rectCircleHit(cx, cy, w, h, ox, oy, r){
    const left = cx - w/2, right = cx + w/2;
    const top = cy - h/2, bottom = cy + h/2;
    const px = clamp(ox, left, right);
    const py = clamp(oy, top, bottom);
    const dx = px - ox, dy = py - oy;
    return (dx*dx + dy*dy) < r*r;
  }

  function resolveAirWalls(){
    for(let iter = 0; iter < 8; iter++){
      let moved = false;
      for(let i=0;i<plSlimes.length;i++){
        for(let j=i+1;j<plSlimes.length;j++){
          const A = plSlimes[i], B = plSlimes[j];
          if(A.el.classList.contains('dragging') || B.el.classList.contains('dragging')) continue;
          const aw = 140 * A.dispScale, ah = 118 * A.dispScale;
          const bw = 140 * B.dispScale, bh = 118 * B.dispScale;
          const ax = A.x/100*pgW, ay = A.y/100*pgH;
          const bx = B.x/100*pgW, by = B.y/100*pgH;

          if(rectCircleHit(ax, ay, aw, ah, bx, by, B.airR)){
            const dx = ax - bx, dy = ay - by;
            const dist = Math.hypot(dx, dy) || 1;
            const px = clamp(bx, ax-aw/2, ax+aw/2);
            const py = clamp(by, ay-ah/2, ay+ah/2);
            const d2 = Math.hypot(px-bx, py-by);
            const push = Math.max(1, B.airR - d2 + 1);
            A.x = clamp(A.x + (dx/dist)*push/pgW*100, A.minX, A.maxX);
            A.y = clamp(A.y + (dy/dist)*push/pgH*100, A.minY, A.maxY);
            A.el.style.left = A.x + '%';
            A.el.style.top = A.y + '%';
            moved = true;
          }
          if(rectCircleHit(bx, by, bw, bh, ax, ay, A.airR)){
            const dx = bx - ax, dy = by - ay;
            const dist = Math.hypot(dx, dy) || 1;
            const px = clamp(ax, bx-bw/2, bx+bw/2);
            const py = clamp(ay, by-bh/2, by+bh/2);
            const d2 = Math.hypot(px-ax, py-ay);
            const push = Math.max(1, A.airR - d2 + 1);
            B.x = clamp(B.x + (dx/dist)*push/pgW*100, B.minX, B.maxX);
            B.y = clamp(B.y + (dy/dist)*push/pgH*100, B.minY, B.maxY);
            B.el.style.left = B.x + '%';
            B.el.style.top = B.y + '%';
            moved = true;
          }
        }
      }
      if(!moved) break;
    }
  }

  sprites.forEach((s,i)=>{
    const ratio = clamp((s.size || 1) / maxSizeInSpace, 0.2, 1);
    const baseScale = s.isSystem ? 1 : NON_SYS_SCALE;
    const dispScale = MAX_DISP_SCALE * ratio * baseScale;
    const imgW = 140 * dispScale;
    const imgH = 118 * dispScale;
    const airD = imgW * 0.65;
    const airR = airD / 2;
    const halfW = imgW / 2;
    const halfH = imgH / 2;
    const padX = halfW / pgW * 100;
    const padY = halfH / pgH * 100;
    const minX = padX + 0.5, maxX = 100 - padX - 0.5;
    const minY = padY + 0.5, maxY = 100 - padY - 0.5;

    const findFreePos = () => {
      for(let tries=0; tries<80; tries++){
        const x = rnd(minX, maxX);
        const y = rnd(minY, maxY);
        let ok = true;
        for(const p of placed){
          const dx = (x-p.x)*pgW/100, dy = (y-p.y)*pgH/100;
          const minD = airR + p.airR;
          if(Math.sqrt(dx*dx+dy*dy) < minD){ ok=false; break; }
        }
        if(ok) return {x,y};
      }
      return {x:(minX+maxX)/2, y:(minY+maxY)/2};
    };

    const pos = findFreePos();
    placed.push({x:pos.x,y:pos.y,airR});
    const el = document.createElement('div');
    el.className = 'pl-slime';
    el.dataset.id = s.id;
    el.dataset.mon = isMonster ? 1 : 0;
    el.innerHTML = slimeHTML(s,{mood:'idle'});
    const slInit = el.querySelector('.slime');
    if(slInit) slInit.style.transform = `scale(${dispScale.toFixed(3)})`;
    const airWall = document.createElement('div');
    airWall.className = 'air-wall';
    airWall.style.width = airD.toFixed(2) + 'px';
    airWall.style.height = airD.toFixed(2) + 'px';
    el.appendChild(airWall);
    el.style.left = pos.x+'%';
    el.style.top = pos.y+'%';
    pg.appendChild(el);
    const obj = {el, timer:null, bubbleTimer:null, x:pos.x, y:pos.y, sid:s.id, minX, maxX, minY, maxY, dispScale, airR};

    let bubbleEl = null;
    if(s.isSystem){
      bubbleEl = document.createElement('div');
      bubbleEl.className = 'sys-bubble';
      el.appendChild(bubbleEl);
      const showLine = ()=>{
        if(!bubbleEl.isConnected) return;
        if(el.classList.contains('dragging')) return;
        bubbleEl.textContent = pick(SYS_QUOTES);
        bubbleEl.classList.add('show');
        clearTimeout(bubbleEl._t);
        bubbleEl._t = setTimeout(()=>{ if(bubbleEl.isConnected) bubbleEl.classList.remove('show'); }, 2600);
      };
      setTimeout(showLine, 1500);
      obj.bubbleTimer = setInterval(showLine, 9000);
    }

    const move = (targetX, targetY)=>{
      const oldIdx = placed.findIndex(p=>p.x===obj.x && p.y===obj.y);
      if(oldIdx>=0) placed.splice(oldIdx,1);

      let np = {x: targetX, y: targetY};
      if(targetX === undefined) {
          np = findFreePos();
      } else {
          np.x = clamp(np.x, minX, maxX);
          np.y = clamp(np.y, minY, maxY);
      }

      obj.x = np.x; obj.y = np.y;
      placed.push({x:np.x,y:np.y,airR});
      const slimeEl = el.querySelector('.slime');
      if(slimeEl){
          slimeEl.dataset.mood = Math.random() < 0.5 ? 'jump' : 'crawl';
          setTimeout(()=>{ if(slimeEl.isConnected) slimeEl.dataset.mood = 'idle'; }, 800);
      }
      el.style.left = np.x+'%';
      el.style.top = np.y+'%';
      resolveAirWalls();
    };

    obj.timer = setInterval(()=>{
      if(activeTab !== 'space') return;
      if(el.classList.contains('dragging')) return;
      if(el.classList.contains('tracking')) return;
      if(ballGame && ballGame.running && ballGame.slime.id === s.id) return;
      const slimeEl = el.querySelector('.slime');
      if(!slimeEl) return;
      const r = Math.random();
      if(r < 0.08){
        slimeEl.dataset.mood = 'happy';
        setTimeout(()=>{
          if(slimeEl && slimeEl.dataset.mood==='happy' && activeTab==='space') slimeEl.dataset.mood = 'idle';
        }, 2000);
      } else {
        const m = pick(mainMoods);
        slimeEl.dataset.mood = m;
        if(m==='crawl' || m==='jump') move(undefined, undefined);
      }
    }, 2400 + i*300);

    let drag = null;
    el.addEventListener('pointerdown', ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      drag = { startX: ev.clientX, startY: ev.clientY, lastX: ev.clientX, lastY: ev.clientY, moved:false, velocity:0, sysBubbleShown:false };
      el.classList.add('dragging');
      const idx = placed.findIndex(p=>p.x===obj.x && p.y===obj.y);
      if(idx>=0) placed.splice(idx,1);
      try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    });
    el.addEventListener('pointermove', ev=>{
      if(!drag) return;
      const dx = ev.clientX - drag.startX;
      const dy = ev.clientY - drag.startY;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
      if(!drag.moved) return;
      /* 系统史莱姆被拖拽：显示拖拽语录 */
      if(s.isSystem && bubbleEl && !drag.sysBubbleShown){
        drag.sysBubbleShown = true;
        bubbleEl.textContent = pick(SYS_DRAG_QUOTES);
        bubbleEl.classList.add('show');
        clearTimeout(bubbleEl._t);
      }
      const pgRect = pg.getBoundingClientRect();
      let px = ((ev.clientX - pgRect.left) / pgRect.width) * 100;
      let py = ((ev.clientY - pgRect.top) / pgRect.height) * 100;
      px = clamp(px, minX, maxX);
      py = clamp(py, minY, maxY);
      obj.x = px; obj.y = py;
      el.style.left = px + '%';
      el.style.top = py + '%';
      const mdx = ev.clientX - drag.lastX;
      drag.velocity = drag.velocity * 0.6 + mdx * 0.4;
      drag.lastX = ev.clientX;
      drag.lastY = ev.clientY;
      const angle = clamp(drag.velocity * 4, -50, 50);
      const slimeEl = el.querySelector('.slime');
      if(slimeEl){
        slimeEl.dataset.mood = 'swing';
        slimeEl.style.transform = `scale(${dispScale}) rotate(${angle}deg)`;
        slimeEl.style.transition = 'transform .05s ease-out';
      }
    });
    el.addEventListener('pointerup', ()=>{
      if(!drag) return;
      const wasMoved = drag.moved;
      el.classList.remove('dragging');
      placed.push({x:obj.x, y:obj.y, airR});
      const slimeEl = el.querySelector('.slime');
      if(slimeEl){
        slimeEl.style.transform = `scale(${dispScale})`;
        slimeEl.style.transition = 'transform .2s ease-out';
        if(slimeEl.dataset.mood === 'swing') slimeEl.dataset.mood = 'idle';
      }
      if(s.isSystem && bubbleEl){
        bubbleEl.classList.remove('show');
      }
      drag = null;
      if(wasMoved){
        suppressClick = true;
        setTimeout(()=>{ suppressClick = false; }, 160);
      }
    });
    el.addEventListener('pointercancel', ()=>{
      if(!drag) return;
      el.classList.remove('dragging');
      placed.push({x:obj.x, y:obj.y, airR});
      const slimeEl = el.querySelector('.slime');
      if(slimeEl){
        slimeEl.style.transform = `scale(${dispScale})`;
        slimeEl.style.transition = 'transform .2s ease-out';
        if(slimeEl.dataset.mood === 'swing') slimeEl.dataset.mood = 'idle';
      }
      if(s.isSystem && bubbleEl){
        bubbleEl.classList.remove('show');
      }
      drag = null;
    });

    el.addEventListener('click', ()=>{
      if(suppressClick) return;
      if(!isMonster && selectedToy === 'ball'){ startBallGame(s); return; }
      const slimeEl = el.querySelector('.slime');
      if(slimeEl) slimeEl.dataset.mood = 'happy';
      setTimeout(()=>{
        if(slimeEl && slimeEl.dataset.mood==='happy') slimeEl.dataset.mood = 'idle';
      }, 2600);
      if(s.isSystem){
        if(bubbleEl){
          bubbleEl.textContent = pick(SYS_QUOTES);
          bubbleEl.classList.add('show');
          clearTimeout(bubbleEl._t);
          bubbleEl._t = setTimeout(()=>{ if(bubbleEl.isConnected) bubbleEl.classList.remove('show'); }, 2600);
        }
        return;
      }
      s.mood = clamp(s.mood + 10, 0, 100);
      showFloat(el, '心情+10');
      save();
    });

    plSlimes.push(obj);
  });

  let trackMove = false;
  let lastTrackTime = 0;

  function handleTrack(ev) {
    const now = Date.now();
    if(now - lastTrackTime < 150) return;
    lastTrackTime = now;

    const rect = pg.getBoundingClientRect();
    const clickX = ((ev.clientX - rect.left) / rect.width) * 100;
    const clickY = ((ev.clientY - rect.top) / rect.height) * 100;

    const items = [];
    plSlimes.forEach(p => {
      if(p.el.classList.contains('dragging')) return;
      const s = isMonster ? S.monsters.find(x => x.id === p.sid) : S.slimes.find(x => x.id === p.sid);
      if (s && (s.intimacy || 0) >= 5) {
        items.push({
          p,
          x: clamp(clickX + rnd(-5, 5), p.minX, p.maxX),
          y: clamp(clickY + rnd(-5, 5), p.minY, p.maxY)
        });
      }
    });

    for(let iter = 0; iter < 12; iter++){
      let moved = false;
      for(let i = 0; i < items.length; i++){
        for(let j = i + 1; j < items.length; j++){
          const A = items[i], B = items[j];
          const dxPx = (B.x - A.x) * pgW / 100;
          const dyPx = (B.y - A.y) * pgH / 100;
          const d = Math.hypot(dxPx, dyPx);
          const minD = A.p.airR + B.p.airR;
          if(d >= minD) continue;
          const ux = d > 0.001 ? dxPx / d : (Math.random() < 0.5 ? -1 : 1);
          const uy = d > 0.001 ? dyPx / d : (Math.random() < 0.5 ? -1 : 1);
          const push = (minD - d) / 2 + 0.6;
          A.x = clamp(A.x - ux * push / pgW * 100, A.p.minX, A.p.maxX);
          A.y = clamp(A.y - uy * push / pgH * 100, A.p.minY, A.p.maxY);
          B.x = clamp(B.x + ux * push / pgW * 100, B.p.minX, B.p.maxX);
          B.y = clamp(B.y + uy * push / pgH * 100, B.p.minY, B.p.maxY);
          moved = true;
        }
      }
      if(!moved) break;
    }

    items.forEach(it => {
      const x = clamp(it.x, it.p.minX, it.p.maxX);
      const y = clamp(it.y, it.p.minY, it.p.maxY);
      moveEl(it.p, x, y);
    });
    resolveAirWalls();
  }

  function moveEl(p, tx, ty) {
    const targetX = clamp(tx, p.minX, p.maxX);
    const targetY = clamp(ty, p.minY, p.maxY);
    p.x = targetX; p.y = targetY;
    p.el.classList.toggle('tracking', trackMove);
    p.el.style.left = targetX + '%';
    p.el.style.top = targetY + '%';

    const slimeEl = p.el.querySelector('.slime');
    if (slimeEl) {
      if (trackMove) {
        slimeEl.dataset.mood = 'jump';
        clearTimeout(slimeEl._moveTimer);
        slimeEl._moveTimer = null;
      } else {
        slimeEl.dataset.mood = Math.random() < 0.5 ? 'jump' : 'crawl';
        clearTimeout(slimeEl._moveTimer);
        slimeEl._moveTimer = setTimeout(() => {
          if (slimeEl.isConnected) slimeEl.dataset.mood = 'idle';
        }, 800);
      }
    }
  }

  function stopTracking(){
    trackMove = false;
    plSlimes.forEach(p=>{
      p.el.classList.remove('tracking');
      const slimeEl = p.el.querySelector('.slime');
      if(slimeEl){
        clearTimeout(slimeEl._moveTimer);
        slimeEl._moveTimer = null;
        slimeEl.dataset.mood = 'idle';
      }
    });
  }

  pg.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.pl-slime')) return;
    trackMove = true;
    handleTrack(ev);
  });

  pg.addEventListener('pointermove', (ev) => {
    if (!trackMove) return;
    handleTrack(ev);
  });

  pg.addEventListener('pointerup', stopTracking);
  pg.addEventListener('pointercancel', stopTracking);
  pg.addEventListener('pointerleave', stopTracking);
}

function showFloat(el, text, topOffset){
  const pg = $('#playground');
  if(!pg) return;
  const r = el.getBoundingClientRect();
  const p = pg.getBoundingClientRect();
  const x = r.left - p.left + r.width/2;
  const y = r.top - p.top + (topOffset||0);
  const d = document.createElement('div');
  d.className = 'float-text';
  d.textContent = text;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  pg.appendChild(d);
  setTimeout(()=>d.remove(), 1350);
}

function refillTrough(){
  if(S.feedTrough >= 99){ toast('饲料槽已满（99包）'); return; }
  if((S.bag.food||0) <= 0){ toast('背包中没有饲料，请先购买'); return; }
  const n = Math.min(S.bag.food, 99 - S.feedTrough);
  S.bag.food -= n;
  S.feedTrough += n;
  save(); renderTab();
  toast(`补充了 ${n} 包饲料\n饲料槽：${S.feedTrough}/99`, 'good');
}

function renderBag(){
  /* 经验药水不在背包显示 */
  return Object.keys(ITEMS).filter(k=>k!=='expPotion').map(k=>{
    const it = ITEMS[k];
    const priceText = k==='ticket' ? `${it.price}积分` : `${it.price}晶币`;
    const price10 = k==='ticket' ? `${it.price*10}积分` : `${it.price*10}晶币`;
    const owned = S.bag[k] || 0;
    return `<div class="panel item-row">
      <div class="item-icon">${it.icon}</div>
      <div class="item-info">
        <div class="item-name">${it.name} <span class="owned">×${owned}</span></div>
        <div class="muted small" style="margin:3px 0 0;">${it.desc}</div>
      </div>
      <div class="item-buy-col">
        <button class="btn sm" data-act="buy" data-item="${k}">${priceText}</button>
        <button class="btn sm gold" data-act="buy10" data-item="${k}">买10个 · ${price10}</button>
      </div>
    </div>`;
  }).join('') + `<div class="panel"><p class="muted small">提示：在【空间】中点击史莱姆，即可使用背包中的道具。饲料也可以在空间饲料槽中补充。词条抽取券仅可使用系统积分购买，系统积分通过完成系统任务获得。</p></div>`;
}

function getSlime(id){ return S.slimes.find(s=>s.id===id) || S.monsters.find(s=>s.id===id); }

/* 对等级最低的史莱姆自动使用经验药水（静默），无史莱姆返回 false */
function autoUseExpPotionSilent(){
  if(!S.slimes.length) return false;
  let target = S.slimes[0];
  for(const s of S.slimes){ if(s.level < target.level) target = s; }
  addExp(target, 100);
  return true;
}

function createSlime(forceMonster){
  const element = pickElement(summonBoost);
  const isMon = !!forceMonster;

  const strPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const agiPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const magPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const luck = isMon ? rndInt(3, 14) : rndInt(0, 10);
  const wit  = isMon ? rndInt(3, 14) : rndInt(0, 10);

  const baseSize = +(0.66 + Math.random() * 0.34).toFixed(2);

  const str = strPotential;
  const agi = agiPotential;
  const mag = magPotential;
  const initStaminaMax = Math.round(80 + baseSize * 40);

  const morality = rndInt(-100,100);
  const id = S.seq++;

  S.nameSeq = (S.nameSeq || 0) + 1;
  if(S.nameSeq >= 99) S.nameSeq = 1;
  const nameNo = S.nameSeq;

  const traits = [];
  if(Math.random() < 0.15){
    const count = Math.random() < 0.25 ? 2 : 1;
    const pool = [...TRAITS_POOL];
    for(let i=0;i<count && pool.length;i++){
      const idx = Math.floor(Math.random()*pool.length);
      const t = pool.splice(idx,1)[0];
      const nt = {n:t.n,d:t.d,k:t.k,v:t.v};
      refreshTraitDesc(nt);
      traits.push(nt);
    }
  }

  const s = {
    id, name:`${element}${nameNo}`, element, morality,
    personality: pick(PERSONALITIES),
    mood:70, stamina:initStaminaMax, traits,
    level:1, exp:0, size:baseSize, resting:false,
    intimacy:0,
    strPotential, agiPotential, magPotential, luck, wit,
    str, agi, mag
  };
  s.hp = hpMax(s);
  if(forceMonster){
    s.isMonster = true;
    s.monSat = rnd(18,58);
    s.monLight = rnd(14,34);
  }
  s.skill = HEAL_ELEMENTS.includes(element) ? '治疗' : '元素弹';
  return s;
}
