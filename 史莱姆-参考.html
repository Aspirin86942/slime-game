<!DOCTYPE html>

<title>最强召唤师</title>
<style>
:root{--notch-h:0.7cm;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#05060c;color:#e8e9f3;}
#app{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto;overflow:hidden;
  background:radial-gradient(circle at 50% 0%,var(--bgTop) 0%,var(--bgMid) 55%,var(--bgBot) 100%);
  --bgTop:#1e1440;--bgMid:#0a0a18;--bgBot:#05060c;
  --accent:#8b7bff;--accent2:#a78bfa;--gold:#ffd166;
  --panel:rgba(255,255,255,.055);--border:rgba(255,255,255,.11);--text:#e8e9f3;--muted:#7a8098;
  --topbar:rgba(9,10,20,.82);--tabbar:rgba(9,10,20,.94);
  --btn-text:#ffffff;--btn-gold-text:#2a1e00;--hp-outline:rgba(192,192,192,.55);}
#app::before,#app::after{content:'';position:absolute;left:0;right:0;height:var(--notch-h,0.7cm);background:#000;z-index:9999;pointer-events:none;}
#app::before{top:0;}
#app::after{bottom:0;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.hidden{display:none!important;}
#storyScreen{padding:calc(var(--notch-h,0.7cm) + 22px) 22px;justify-content:center;align-items:center;z-index:2;}
#storyScreen::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(2px 2px at 20% 15%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 70% 25%,rgba(180,200,255,.6),transparent),radial-gradient(1.5px 1.5px at 40% 40%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 85% 60%,rgba(200,180,255,.6),transparent),radial-gradient(1.5px 1.5px at 15% 70%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 55% 85%,rgba(180,220,255,.5),transparent);
  animation:twinkle 6s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
#storyStage{display:flex;justify-content:center;align-items:center;min-height:110px;margin-bottom:14px;width:100%;position:relative;z-index:5;}
#storyStage .slime{--sz:.82;transform:scale(.82);}
.story-text{background:rgba(12,14,28,.82);border:1px solid var(--border);border-radius:18px;padding:18px;font-size:15px;line-height:1.85;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.5);min-height:110px;width:100%;text-align:center;color:var(--text);}
.story-text.hl{border-color:rgba(255,209,102,.45);box-shadow:0 0 24px rgba(255,209,102,.16),0 8px 30px rgba(0,0,0,.5);}
.story-text.hl b{color:var(--gold);}
.story-action{margin-top:12px;display:flex;flex-direction:column;gap:8px;width:100%;}
.story-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.story-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.07);color:var(--text);font-size:15px;outline:none;text-align:center;font-family:inherit;}
.story-input:focus{border-color:var(--accent);}
.custom-panel{background:rgba(12,14,28,.85);border:1px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(10px);width:100%;}
.custom-panel label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.custom-panel label span{width:32px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums;}
.custom-panel input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;}
.custom-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--accent);cursor:pointer;}

#gameScreen{z-index:3;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;padding-top:calc(var(--notch-h,0.7cm) + 10px + env(safe-area-inset-top));background:var(--topbar);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);font-size:12.5px;z-index:5;flex:none;color:var(--text);}
.cur{display:flex;align-items:center;gap:4px;background:var(--panel);padding:4px 9px;border-radius:20px;border:1px solid var(--border);}
.cur b{font-variant-numeric:tabular-nums;font-weight:600;}
.cur.g{color:var(--gold);} .cur.s{color:var(--accent2);} .cur.p{color:var(--gold);}
.cur .sym{font-size:12px;}
.cur.alert{border-color:var(--gold);box-shadow:0 0 12px rgba(255,209,102,.4);animation:pulse 1.4s infinite;}
.coin-silver{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #ffffff 0%, #e8eef4 18%, #b8c4d0 55%, #8a98a8 100%);box-shadow:inset 0 0 2px rgba(255,255,255,.9),inset 0 -1px 2px rgba(60,80,100,.4),0 0 4px rgba(160,190,220,.6);position:relative;vertical-align:middle;}
.coin-silver::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);background:linear-gradient(135deg, #ffffff 0%, #d8e4f0 100%);clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);opacity:.85;}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(var(--notch-h,0.7cm) + 92px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--tabbar);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding-bottom:calc(var(--notch-h,0.7cm) + env(safe-area-inset-bottom));z-index:10;}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:9px 0 9px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:.15s;}
.tabbar button.active{color:var(--gold);transform:translateY(-2px);}
.tabbar .ico{font-size:19px;line-height:1;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px);overflow:hidden;}
.panel h2{margin:0 0 6px;font-size:17px;color:var(--accent2);}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--text);font-weight:600;letter-spacing:.5px;opacity:.9;}
.center{text-align:center;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;margin:6px 0;}
.small{font-size:11.5px;}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:var(--btn-text);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;}
.btn:active{transform:scale(.96);}
.btn:disabled{background:rgba(128,128,128,.18);color:var(--muted);border:1px solid var(--border);box-shadow:none;cursor:not-allowed;transform:none;}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--accent2));color:var(--btn-gold-text);}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:10px;}
.btn.full{width:100%;margin-top:10px;}
.btn.big{font-size:17px;padding:15px 30px;border-radius:16px;width:100%;margin-top:12px;box-shadow:0 6px 24px rgba(139,123,255,.4);}
.btn.themed{background:rgba(255,255,255,.08)!important;color:var(--accent2)!important;border:1px solid var(--border);box-shadow:none!important;}
#app[data-theme="light"] .btn.themed,#app[data-theme="peach"] .btn.themed,#app[data-theme="mint"] .btn.themed,#app[data-theme="lavender"] .btn.themed,#app[data-theme="sky"] .btn.themed{background:rgba(0,0,0,.05)!important;}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:8px;background:rgba(139,123,255,.18);color:var(--accent2);border:1px solid var(--border);}
.toast{position:absolute;left:50%;bottom:calc(var(--notch-h,0.7cm) + 110px);transform:translate(-50%,20px);opacity:0;background:rgba(20,22,40,.96);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:14px;font-size:13px;transition:.3s;z-index:200;pointer-events:none;white-space:pre-line;text-align:center;max-width:80%;box-shadow:0 8px 30px rgba(0,0,0,.6);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.good{border-color:rgba(255,209,102,.5);box-shadow:0 0 22px rgba(255,209,102,.25);}

/* 折叠区块 */
.collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:2px 0;user-select:none;-webkit-user-select:none;}
.collapse-header h3{margin:0;pointer-events:none;}
.collapse-arrow{font-size:14px;color:var(--muted);transition:transform .25s;display:inline-block;line-height:1;}
.collapse-arrow.open{transform:rotate(180deg);}

.slime{--sz:1;position:relative;z-index:5;width:140px;height:118px;flex:none;}
.slime .shadow{position:absolute;left:50%;bottom:1px;transform:translateX(-50%);width:86px;height:12px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);animation:shadowPulse 3.4s ease-in-out infinite;}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.9}50%{transform:translateX(-50%) scaleX(1.08);opacity:.7}}
.slime .anim{position:absolute;left:0;top:0;width:140px;height:104px;transform-origin:50% 100%;}
.slime .breath{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.slime .blob{position:absolute;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;}
.slime .outer{inset:0 3px;background:hsl(var(--h) var(--s) calc(var(--l) + 8%) / .4);border:1.5px solid hsl(var(--h) var(--s) calc(var(--l) + 26%) / .55);box-shadow:inset -8px -10px 18px rgba(0,0,0,.16),inset 8px 8px 16px rgba(255,255,255,.28);}
.slime .inner{inset:9px 10px 0 10px;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;background:radial-gradient(circle at 36% 22%,hsl(var(--h) var(--s) calc(var(--l) + 22%)),hsl(var(--h) var(--s) var(--l)) 58%,hsl(var(--h) var(--s) calc(var(--l) - 13%)));box-shadow:inset -6px -8px 14px rgba(0,0,0,.18),0 0 18px hsl(var(--h) var(--s) var(--l) / .28);}
.slime .inner::after{content:'';position:absolute;left:22%;top:14%;width:22px;height:14px;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(2px);transform:rotate(-20deg);}
.slime .eyes{position:absolute;left:0;right:0;top:57%;display:flex;justify-content:center;gap:24px;z-index:3;}
.slime .eye{width:14px;height:18px;border-radius:50%;position:relative;background:hsl(var(--eh) var(--es) var(--el));animation:blink 4.6s infinite;}
.slime .eye::after{content:'';position:absolute;left:3px;top:3px;width:5px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.slime .fx{position:absolute;inset:0;pointer-events:none;}
.slime .mark{position:absolute;inset:0;pointer-events:none;z-index:1;}
.slime .halo{display:none;position:absolute;right:0;top:-20px;width:58px;height:32px;pointer-events:none;}
.slime[data-mood="happy"] .halo{display:block;}
.slime .halo .fh{position:absolute;font-size:15px;line-height:1;animation:flSpin 2.2s linear infinite;transform-origin:50% 50%;}

.slime[data-mood="fear"] .fx::before{content:'〰〰';position:absolute;left:-25px;top:24%;font-size:13px;color:#7fd3ff;font-weight:700;transform:rotate(-50deg);animation:wig .22s infinite alternate;}

.slime[data-mood="swing"] .eye,.slime[data-mood="fear"] .eye{background:none;height:16px;width:18px;box-sizing:border-box;border:0;border-radius:0;animation:none;transform:translateY(2px);position:relative;}

.slime[data-mood="swing"] .eye:first-child::before,.slime[data-mood="fear"] .eye:first-child::before{left:1px;border-top:4px solid hsl(var(--eh) var(--es) var(--el));border-right:4px solid hsl(var(--eh) var(--es) var(--el));transform:translateY(-50%) rotate(45deg);}
.slime[data-mood="swing"] .eye:last-child::before,.slime[data-mood="fear"] .eye:last-child::before{right:1px;border-top:4px solid hsl(var(--eh) var(--es) var(--el));border-left:4px solid hsl(var(--eh) var(--es) var(--el));transform:translateY(-50%) rotate(-45deg);}
.slime[data-mood="swing"] .eye::after,.slime[data-mood="fear"] .eye::after{display:none;}
.slime[data-mood="happy"] .eye{background:none;height:12px;width:17px;box-sizing:border-box;border:3px solid hsl(var(--eh) var(--es) var(--el));border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent;border-radius:50%;animation:none;transform:translateY(3px);}
.slime[data-mood="happy"] .eye::after{display:none;}
.slime[data-mood="like"] .eye{background:none;height:12px;width:17px;box-sizing:border-box;border:3px solid hsl(var(--eh) var(--es) var(--el));border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent;border-radius:50%;animation:none;transform:translateY(3px);}
.slime[data-mood="like"] .eye::after{display:none;}
.slime[data-mood="like"] .fx::before{content:'💗';position:absolute;right:-4px;top:16%;font-size:14px;line-height:1;animation:heartPop 1.8s ease-out infinite;font-style:normal;}
.slime[data-mood="like"] .fx::after{content:'💗';position:absolute;right:4px;top:36%;font-size:10px;line-height:1;animation:heartPop 1.8s .6s ease-out infinite;font-style:normal;}
@keyframes heartPop{0%{opacity:0;transform:translate(0,0) scale(.5);}20%{opacity:1;transform:translate(2px,-4px) scale(1);}100%{opacity:0;transform:translate(14px,-32px) scale(1.05);}}

.slime[data-mood="charm"] .eye::after{display:none;}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.slime[data-mood="charm"] .fx::before{content:'❤️';position:absolute;left:0;top:20%;font-size:12px;animation:heartFloat1 2s ease-out infinite;}

@keyframes heartFloat1{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-10px,-40px) scale(1.2)}}
@keyframes heartFloat2{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(15px,-35px) scale(1.1)}}
.slime[data-mood="deadpan"] .fx::before{content:'';position:absolute;right:6px;top:-4px;width:2.5px;height:24px;background:#33384e;border-radius:2px;box-shadow:5px 0 0 #33384e,-5px 0 0 #33384e;}
.slime[data-mood="uncomfortable"] .eye{background:none;animation:none;position:relative;width:16px;height:16px;border-radius:0;margin-top:1px;}

.merge-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,0.7fr) minmax(0,1.25fr);gap:6px 6px;margin-top:14px;align-items:center;justify-items:center;}
.merge-slot{--slot-color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:100%;min-width:0;}
.merge-slot.sub{--slot-color:var(--accent2);}
.merge-slot-label{font-size:11px;font-weight:800;color:var(--slot-color);flex:none;text-shadow:0 0 2px rgba(255,255,255,.95),0 1px 0 rgba(255,255,255,.7),0 0 5px rgba(255,255,255,.5);}
.merge-slot-line{display:flex;align-items:center;gap:3px;max-width:100%;min-width:0;justify-content:center;}
.merge-sel-name{font-size:9.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.merge-sel-img{height:58px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.merge-sel-img .slime{transform:scale(.4);}
.merge-choose-wrap{position:relative;width:100%;height:58px;display:flex;align-items:center;justify-content:center;}
.merge-choose-wrap .slime{transform:scale(.4);opacity:.85;}
.merge-choose-text{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.85);z-index:10;white-space:nowrap;}
.merge-plus{font-size:20px;font-weight:800;color:var(--muted);line-height:1;text-align:center;justify-self:center;align-self:center;}
.merge-center-col{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;align-self:stretch;height:100%;}
.merge-btn{width:auto;min-width:56px;max-width:100%;padding:8px 14px;font-size:13px;border-radius:10px;font-family:inherit;cursor:pointer;font-weight:700;white-space:nowrap;background:linear-gradient(135deg,var(--gold),var(--accent2));color:var(--btn-gold-text);border:none;transition:.15s;}
.merge-btn:disabled{background:rgba(128,128,128,.18);color:var(--muted);border:1px solid var(--border);cursor:not-allowed;}
.merge-result-level{font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;}
.merge-cost{font-size:9px;color:var(--muted);line-height:1.3;}
.merge-result-col{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;align-self:stretch;width:100%;height:100%;}
.merge-result-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;}
.merge-init-item{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80px;width:100%;}
.merge-init-item .slime{transform:scale(.4);}
.merge-same-item,.merge-tri-item{display:flex;flex-direction:column;align-items:center;gap:1px;}
.merge-tri-row{display:flex;align-items:flex-start;justify-content:center;gap:0;}
.merge-tri-row .merge-tri-item + .merge-tri-item{margin-left:-30%;}
.merge-img-wrap{height:42px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.merge-same-item .merge-img-wrap{height:50px;}
.merge-same-item .merge-img-wrap .slime{transform:scale(.38);}
.merge-tri-top .merge-img-wrap{height:38px;}
.merge-tri-top .merge-img-wrap .slime{transform:scale(.38);}
.merge-tri-item .merge-img-wrap{height:32px;}
.merge-tri-item .merge-img-wrap .slime{transform:scale(.28);}
.merge-prob-single{font-size:9px;color:var(--muted);line-height:1.2;text-align:center;}
.merge-result-traits{position:relative;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%;}
.merge-trait{font-size:9px;padding:2px 5px;border-radius:6px;background:rgba(255,209,102,.15);color:var(--gold);border:1px solid rgba(255,209,102,.3);white-space:nowrap;cursor:pointer;}
.merge-trait.persona{background:var(--accent);color:#fff;border-color:transparent;}
.merge-trait.unknown{background:rgba(128,128,128,.12);color:var(--muted);border-color:var(--border);padding:2px 12px;min-width:22px;text-align:center;cursor:default;}
.merge-unknown .eyes{display:none!important;}
.merge-q{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#fff;z-index:5;line-height:1;text-shadow:0 0 8px rgba(255,255,255,.4);}
.merge-rule-box{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(128,128,128,.06);font-size:10.5px;line-height:1.6;color:var(--muted);}

/* 合体词条气泡：主题化、宽度固定、右对齐 */
.merge-tip-bubble{position:absolute;z-index:60;background:var(--bgTop);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:10.5px;line-height:1.5;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none;white-space:normal;word-break:break-word;overflow-wrap:break-word;}
.merge-tip-bubble::before{content:'';position:absolute;left:var(--tail-x,50%);top:-6px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid var(--border);}

.merge-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.merge-pick-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-radius:10px;background:rgba(128,128,128,.08);cursor:pointer;min-width:0;}
.merge-pick-card:active{background:rgba(139,123,255,.14);}
.merge-pick-card .scale-box{width:44px;height:36px;}
.merge-pick-card .scale-box .slime{transform:scale(.28);}
.merge-pick-name{display:flex;align-items:center;gap:2px;width:100%;font-size:9.5px;line-height:1.2;min-width:0;}
.merge-pick-elem{flex:none;font-size:10px;}
.merge-pick-name b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--accent2);}
.merge-pick-lv{flex:none;font-size:9px;color:var(--muted);}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-bottom:12px;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:4.5px 0;border-bottom:1px dashed var(--border);font-size:12px;line-height:1.4;}
.info-row span{color:var(--muted);font-size:11px;white-space:nowrap;}
.info-row b{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-section-title{font-size:11.5px;color:var(--accent2);font-weight:600;margin:12px 0 6px;}
.rename-btn{background:none;border:none;padding:0 2px;font-size:14px;line-height:1;color:var(--muted);cursor:pointer;opacity:.7;transition:.15s;flex:none;}
.rename-btn:hover,.rename-btn:active{opacity:1;color:var(--accent2);}
.edit-label{display:block;font-size:11.5px;color:var(--muted);margin-top:8px;}

.team-alert{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;color:#000;font-size:11px;font-weight:900;line-height:14px;text-align:center;z-index:5;box-shadow:0 0 6px rgba(255,255,255,.8);pointer-events:none;}

.explore-reward-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;background:rgba(128,128,128,.08);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);text-shadow:none;line-height:1.6;}
.explore-reward-row b{color:var(--accent);font-variant-numeric:tabular-nums;text-shadow:none;}

#gameOverlay{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,var(--bgTop) 0%,var(--bgMid) 55%,var(--bgBot) 100%);padding:calc(var(--notch-h,0.7cm) + 10px) 12px calc(var(--notch-h,0.7cm) + 12px);}
.game-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;row-gap:8px;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;flex:none;backdrop-filter:blur(8px);}
.game-hud .hud-title{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:1;}
.game-hud .hud-close{flex:none;order:2;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:10px;font-size:12px;font-family:inherit;cursor:pointer;}
.game-hud .hud-close:active{transform:scale(.96);}
.game-field{position:relative;flex:1;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:radial-gradient(circle at 50% 30%,rgba(139,123,255,.12),rgba(0,0,0,.3));}
.game-slime{position:absolute;transform:translate(-50%,-50%);transition:left .55s linear;z-index:5;}
.game-slime .slime{transform:scale(.45);}
.game-ball{position:absolute;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 34% 30%,#fff6c0,var(--gold) 52%,#c98f00);box-shadow:0 0 16px rgba(255,209,102,.75),inset -4px -4px 8px rgba(0,0,0,.28);z-index:10;cursor:pointer;transition:opacity .2s;}
.game-ball.hidden{opacity:0;pointer-events:none;}
.catch-line{position:absolute;left:0;right:0;top:66.67%;height:0;border-top:3px dashed #3b82f6;z-index:2;pointer-events:none;}
.catch-line::after{content:'接球线';position:absolute;right:10px;top:-18px;font-size:11px;color:#3b82f6;font-weight:800;}
.out-line{position:absolute;left:0;right:0;top:83.33%;height:0;border-top:3px dashed rgba(248,113,113,.75);z-index:2;pointer-events:none;}
.out-line::after{content:'出界线';position:absolute;right:10px;top:-18px;font-size:11px;color:#f87171;font-weight:800;}
.catch-zone{position:absolute;left:0;right:0;bottom:0;height:33.33%;background:linear-gradient(to top,rgba(74,222,128,.12),transparent);pointer-events:none;z-index:1;}

.battle-field{position:relative;flex:1;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:radial-gradient(circle at 50% 12%, rgba(120,38,55,.38), rgba(28,10,20,.9) 55%, rgba(8,3,9,.98) 100%),linear-gradient(180deg, rgba(20,6,14,.96), rgba(6,2,8,1));}
/* 敌我双方根据容器顶部定位；敌方整体上移 */
.battle-row.enemy{top:8%;height:26%;align-items:flex-end;}
.battle-row.ally{top:64%;height:26%;align-items:flex-start;}
.battle-row{position:absolute;left:0;right:0;display:flex;justify-content:space-around;padding:0 6px;z-index:2;}
.battle-unit{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:70px;}
.slime-wrap{position:relative;width:54px;height:44px;display:flex;justify-content:center;align-items:flex-end;overflow:visible;}
.slime-wrap .slime{position:absolute;left:50%;bottom:0;transform:translateX(-50%) scale(.36);transform-origin:bottom center;z-index:5;}
.battle-unit .hpbar{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);width:48px;height:5px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;z-index:25;pointer-events:none;box-shadow:0 0 0 1px var(--hp-outline);}
.battle-unit .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#fbbf24);transition:width .3s;}
.battle-unit .shieldbar{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);width:48px;height:2px;border-radius:2px;background:rgba(0,0,0,.5);overflow:hidden;z-index:26;pointer-events:none;display:none;box-shadow:0 0 0 1px var(--hp-outline);}
.battle-unit .shieldbar.show{display:block;}
.battle-unit .shieldbar i{display:block;height:100%;width:100%;background:#fff;box-shadow:0 0 4px #fff;transition:width .3s;}
.battle-unit .uname{font-size:10px;color:#ffffff;font-weight:700;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;margin-top:0;text-shadow:0 1px 2px rgba(0,0,0,.9);}
/* 战斗提示位于双方名字中间 */
.battle-log{position:absolute;left:0;right:0;top:53%;transform:translateY(-50%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:11px;color:var(--gold);text-align:center;line-height:1.5;pointer-events:none;padding:0 8px;z-index:10;}
.slime-wrap.attack-jump{animation:unitJump .65s cubic-bezier(.3,0,.5,1);}@keyframes unitJump{0%{transform:translateY(0);}25%{transform:translateY(-16px);}55%{transform:translateY(-10px);}100%{transform:translateY(0);}}
.skill-ring{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid hsl(var(--h) var(--s) var(--l));box-shadow:0 0 24px hsl(var(--h) var(--s) var(--l));animation:ringExpand .75s ease-out forwards;pointer-events:none;z-index:15;}
@keyframes ringExpand{0%{width:12px;height:12px;opacity:1;}100%{width:100px;height:100px;opacity:0;}}
.skill-orb{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;}
.heal-dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;}
@keyframes holyRingPulse{0%{transform:translate(-50%,-50%) scale(1);}100%{transform:translate(-50%,-50%) scale(1.6);}}
.capture-btn{position:absolute;top:-32px;left:50%;transform:translateX(-50%);z-index:30;font-size:10px;padding:2px 8px;background:rgba(128,128,128,.22);border:1px solid var(--border);color:var(--btn-text);border-radius:6px;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.45);}
.counter-badge{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:8px;line-height:1.3;padding:1px 5px;border-radius:6px;font-weight:800;white-space:nowrap;pointer-events:none;z-index:28;letter-spacing:.5px;}
.counter-badge.strong{background:rgba(255,110,80,.95);color:#fff;box-shadow:0 0 8px rgba(255,110,80,.6);}
.counter-badge.weak{background:rgba(255,200,90,.95);color:#3a2400;box-shadow:0 0 8px rgba(255,200,90,.5);}
.counter-badge.resist{background:rgba(130,170,210,.95);color:#fff;box-shadow:0 0 8px rgba(130,170,210,.5);}

.battle-dock{position:relative;flex:none;margin-top:8px;z-index:29;}
/* 底部技能栏：高度恒定 */
.skill-bar{position:relative;flex:none;margin-top:0;z-index:28;display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:12px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:82px;box-shadow:0 -2px 16px rgba(0,0,0,.28);}
.skill-bar.hide{display:none;}
.skill-bar.manual{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;height:175px;padding:10px 8px;}
/* 控制簇：底部对齐到技能栏上轮廓线（bottom:calc(100% - 26px)），使 .sk-mode 中心正好在技能栏上轮廓 */
.sk-ctrl{position:absolute;right:4px;bottom:calc(100% - 26px);width:84px;height:84px;z-index:31;}
.sk-speed{position:absolute;width:22px;height:22px;border-radius:50%;padding:0;font-size:9px;font-weight:800;font-family:inherit;line-height:1;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.sk-speed.on{background:linear-gradient(135deg,var(--gold),var(--accent2));color:var(--btn-gold-text);border-color:transparent;box-shadow:0 0 10px rgba(255,209,102,.7);}
.sk-speed:active{transform:scale(.92);}
.sk-mode{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;padding:0;font-size:11px;font-weight:800;font-family:inherit;line-height:1;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.18);}
.sk-mode:active{transform:scale(.94);}
.sk-avatars{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:1px;min-width:0;align-items:center;}
.sk-avatar{flex:none;width:34px;height:29px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--panel);border:1px solid var(--border);cursor:pointer;overflow:hidden;padding:0;}
.sk-avatar .slime{transform:scale(.21);pointer-events:none;}
.sk-avatar.on{border-color:var(--gold);background:rgba(255,209,102,.16);box-shadow:inset 0 0 0 1px var(--gold);}
.sk-avatar .sk-cd{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:800;line-height:1;color:var(--gold);}
.sk-avatar .sk-cd.done{color:#4ade80;}
.sk-acts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:8px;align-items:stretch;flex:1;min-height:0;}
.sk-acts .sk-hint-text{grid-column:1 / -1;text-align:center;}
.sk-hint-text{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;}
.sk-acts .sk-act.big{padding:9px 4px;font-size:14px;border-radius:12px;min-width:0;min-height:38px;font-weight:700;line-height:1.2;font-family:inherit;background:linear-gradient(135deg,var(--gold),var(--accent2));color:var(--btn-gold-text);border:none;cursor:pointer;white-space:nowrap;}
.sk-acts .sk-act.big:disabled{background:rgba(128,128,128,.14);color:var(--muted);border:1px solid var(--border);cursor:not-allowed;}
/* 技能说明：占满剩余高度，左侧对齐 */
.skill-desc-box{grid-column:1 / -1;padding:10px 12px;background:rgba(128,128,128,.12);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--muted);line-height:1.55;text-align:left;display:flex;align-items:center;justify-content:flex-start;min-height:60px;white-space:normal;word-break:break-word;overflow-wrap:break-word;}
.battle-unit.targetable{cursor:crosshair;}
.battle-unit.single-targetable .slime-wrap{animation:singleTargetPulse 1s ease-in-out infinite;}
.battle-unit.aoe-targetable .slime-wrap{animation:aoeTargetPulse 1s ease-in-out infinite;}
@keyframes singleTargetPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(255,209,102,.95));}50%{filter:drop-shadow(0 0 2px rgba(255,209,102,.3));}}
@keyframes aoeTargetPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(100,220,255,.95));}50%{filter:drop-shadow(0 0 2px rgba(100,220,255,.3));}}
.abyss-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.abyss-row label{font-size:12px;color:var(--muted);flex:none;}
.abyss-level-input{flex:0 0 68px;max-width:68px;padding:8px 8px;border-radius:10px;border:1px solid var(--border);background:rgba(128,128,128,.12);color:var(--text);font-size:13px;outline:none;font-family:inherit;text-align:center;}
#app[data-theme="light"] .abyss-level-input,#app[data-theme="peach"] .abyss-level-input,#app[data-theme="mint"] .abyss-level-input,#app[data-theme="lavender"] .abyss-level-input,#app[data-theme="sky"] .abyss-level-input{background:rgba(0,0,0,.05);}
.abyss-step{padding:6px 10px;font-size:13px;border-radius:8px;flex:none;line-height:1;}
@keyframes frozenPulse{0%{opacity:0.65;}100%{opacity:1;}}
.frozen-orb{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:56px;height:50px;background:rgba(120,220,230,0.38);border:1.5px solid rgba(180,245,255,0.9);clip-path:polygon(15% 10%, 38% 4%, 62% 8%, 88% 16%, 96% 48%, 92% 96%, 8% 96%, 4% 58%, 8% 28%);pointer-events:none;z-index:9;animation:frozenPulse 1.6s ease-in-out infinite alternate;box-shadow:0 0 14px rgba(120,220,230,.55), inset 0 0 12px rgba(200,250,255,.5);}
@keyframes flowerFall{0%{transform:translateY(-8px) rotate(0deg) scale(0.6);opacity:0;}15%{opacity:1;}100%{transform:translateY(40px) rotate(200deg) scale(1);opacity:0;}}

.explore-scene{position:relative;height:130px;border-radius:14px;overflow:hidden;margin-top:10px;--sky1:#87CEEB;--sky2:#B0E0E6;--grass1:#4CAF50;--grass2:#388E3C;--soil1:#8D6E63;--soil2:#5D4037;}
.bg-scroll{position:absolute;inset:0;display:flex;width:200%;animation:bgScroll 12s linear infinite;z-index:0;}
.bg-panel{flex:none;width:50%;height:100%;position:relative;}
.scene-sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2));}
.scene-grass{position:absolute;left:0;right:0;top:55%;bottom:0;background:linear-gradient(var(--grass1),var(--grass2));-webkit-mask-image:var(--grass-mask);mask-image:var(--grass-mask);-webkit-mask-size:50% 100%;mask-size:50% 100%;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-position:0 0;mask-position:0 0;}

@keyframes miniBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.mini-slime{position:absolute;width:30px;height:26px;pointer-events:none;z-index:30;animation:miniBob .8s ease-in-out infinite;}

.shield-orb::after{content:'';position:absolute;left:9%;top:10%;width:36%;height:27%;border-radius:50%;background:radial-gradient(ellipse at 46% 46%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.42) 45%, rgba(255,255,255,0) 76%);transform:rotate(112deg);pointer-events:none;}
.shield-orb.rock{border:1px solid rgba(200,150,50,0.85);box-shadow:inset 0 0 12px rgba(200,150,50,0.45), inset 6px 8px 14px rgba(255,255,255,0.18), 0 0 10px rgba(200,150,50,0.4);}
.shield-orb.ice{border:1px solid rgba(56,189,248,0.85);box-shadow:inset 0 0 12px rgba(56,189,248,0.45), inset 6px 8px 14px rgba(255,255,255,0.18), 0 0 10px rgba(56,189,248,0.4);}

.sys-bubble{position:absolute;left:50%;top:14px;transform:translate(-50%,-100%) scale(.9);background:rgba(255,255,255,.95);color:#1a1e33;font-size:11px;line-height:1.2;padding:4px 9px;border-radius:11px;width:max-content;max-width:min(62vw,210px);white-space:normal;text-align:center;word-break:break-word;pointer-events:none;z-index:70;opacity:0;transition:opacity .25s, transform .25s;box-shadow:0 3px 10px rgba(0,0,0,.35);}
.sys-bubble::after{content:'';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid rgba(255,255,255,.95);}
.sys-bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1);}
.sys-bubble.below{top:100%;bottom:auto;margin-top:4px;transform:translate(-50%,0) scale(.9);}

.hit-flash{animation:fxHitFlash .18s ease-out 1;}

.fx-float{position:absolute;transform:translate(-50%,0);font:800 13px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);pointer-events:none;z-index:30;white-space:nowrap;animation:fxFloatUp .85s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.85);}
.fx-float.crit{color:var(--gold);font-size:17px;}

.battle-unit .hpbar i.ghost,.battle-unit .shieldbar i.ghost{position:absolute;left:0;top:0;height:100%;width:100%;background:rgba(255,255,255,.5);box-shadow:none;transition:width .24s ease-out .24s;z-index:0;}

@keyframes fxLowPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes fxFloatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8);}18%{opacity:1;transform:translate(-50%,-4px) scale(1.08);}100%{opacity:0;transform:translate(-50%,-24px) scale(1);}}
.field-shake[data-k="light"]{animation:fxShakeLight .12s linear 1;}
.field-shake[data-k="kill"]{animation:fxShakeKill .14s linear 1;}
.field-shake[data-k="crit"]{animation:fxShakeCrit .16s linear 1;}
@keyframes fxShakeLight{0%,100%{transform:none;}25%{transform:translate(-3px,1px);}50%{transform:translate(2px,-1px);}75%{transform:translate(-1px,1px);}}
@keyframes fxShakeCrit{0%,100%{transform:none;}20%{transform:translate(-6px,2px) rotate(-.4deg);}45%{transform:translate(5px,-2px) rotate(.4deg);}70%{transform:translate(-3px,1px);}}
@keyframes fxShakeKill{0%,100%{transform:none;}15%{transform:translate(-5px,2px) rotate(-.5deg);}40%{transform:translate(5px,-2px) rotate(.5deg);}65%{transform:translate(-4px,2px);}85%{transform:translate(3px,-1px);}}
.fx-part{position:absolute;width:var(--sz,3px);height:var(--sz,3px);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:28;animation:fxPart .62s ease-out forwards;}
@keyframes fxPart{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-20px))) scale(.4);}}
.battle-field .slime{--die0:.36;}
.mini-slime.pos-right .slime{--die0:.20;}
.mini-slime.pos-left-back .slime{--die0:.18;}
.mini-slime.pos-left-front .slime{--die0:.16;}
.battle-field .slime.dying{animation:fxDie .34s ease-in forwards !important;}
@keyframes fxDie{0%{transform:translateX(-50%) scale(var(--die0,.36));opacity:1;filter:none;}45%{transform:translateX(-50%) scale(calc(var(--die0,.36) * 1.18));filter:brightness(2);}100%{transform:translateX(-50%) scale(calc(var(--die0,.36) * .72));opacity:0;filter:brightness(.6);}}

.tabbar .ui-icon{width:21px;height:21px}.btn .ui-icon{margin-right:4px}.settings-trigger{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:6px;cursor:pointer;display:flex}

.battle-unit .uname{font-size:10px;font-weight:700;line-height:1.3;color:#ffffff;max-width:100%;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.battle-row.ally .hpbar i:not(.ghost){background:linear-gradient(90deg,#3fb28c,#9ee6ac)}
.hp-value{font-size:9px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums;pointer-events:none}
.battle-statuses{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:12px;pointer-events:none}
.status-chip{display:inline-flex;align-items:center;gap:1px;padding:0;border:0;background:none;font-size:9px;color:var(--accent2);line-height:1.2;pointer-events:none}
.status-chip .ui-icon{width:10px;height:10px}
.status-chip.negative{color:#ffb3ba}.status-chip.positive{color:var(--accent2)}
.battle-unit.selected-unit .slime-wrap{filter:drop-shadow(0 0 4px rgba(116,201,255,.9))}
.battle-unit.is-acting .slime-wrap{filter:drop-shadow(0 0 4px rgba(255,225,155,.9))}
.battle-unit.is-targeted .slime-wrap{filter:drop-shadow(0 0 5px rgba(255,137,150,.95))}
.battle-unit.selected-unit .slime-wrap::before,.battle-unit.is-acting .slime-wrap::before,.battle-unit.is-targeted .slime-wrap::before{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);font-size:9px;line-height:1;white-space:nowrap;color:#8ed7ff;content:'已选';z-index:30;pointer-events:none}
.battle-unit.is-acting .slime-wrap::before{content:'行动中';color:#ffe19b}
.battle-unit.is-targeted .slime-wrap::before{content:'目标';color:#ff9aa5}
.battle-unit[data-fallen="1"]{opacity:.62}
.intent-label{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);width:100%;font-size:9px;color:var(--gold);line-height:1.3;text-align:center;white-space:normal;overflow-wrap:anywhere;pointer-events:none;}
.training-hint{position:absolute;left:12px;right:12px;top:8px;z-index:3;font-size:9.5px;line-height:1.5;color:var(--muted);text-align:center;pointer-events:none;}
.capture-btn{top:-26px;font-size:9px;padding:2px 4px}
.battle-row .shield-orb,.battle-row .frozen-orb{max-width:105%;max-height:110%}
.hit-flash:not(.crit){animation:fxSoftHit .14s ease-out 1}@keyframes fxSoftHit{0%{filter:brightness(1.25)}100%{filter:none}}

}

<body>
<div id="app" data-theme="sunset">
  <div id="storyScreen" class="screen">
    <div id="storyStage"></div>
    <div id="storyText" class="story-text"></div>
    <div id="storyAction" class="story-action"></div>
    <div class="story-hint" id="storyHint">点击屏幕继续 ▾</div>
  </div>
  <div id="gameScreen" class="screen hidden">
    <div class="topbar">
      <div class="cur g"><span class="sym coin-silver"></span><b id="cCrystal">0</b></div>
      <div class="cur p"><span class="sym">⭐</span><b id="cPoints">0</b></div>
      <div class="cur" id="lvCur"><span class="sym">👑</span><b id="cLevel">Lv.1</b></div>

      <button data-act="tab" data-tab="travel"><span class="ico"></span>探索</button>
      <button data-act="tab" data-tab="bag"><span class="ico"></span>背包</button>
      <button data-act="tab" data-tab="status"><span class="ico"></span>成长</button>
    </nav>
  </div>
  <div id="modalLayer" class="hidden"><div class="modal" id="modalBox"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndInt = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function sortStarred(list){return list.slice().sort((a,b)=>(b.starred?1:0)-(a.starred?1:0));}

const THEMES = [{id:'sunset',name:'星空紫',color:'#8b5cf6'},{id:'dark',name:'深色',color:'#8ab4f8'},{id:'light',name:'浅色',color:'#7c8bd0'},{id:'peach',name:'蜜桃',color:'#e0603a'},{id:'mint',name:'薄荷',color:'#0d9488'},{id:'lavender',name:'薰衣草',color:'#7c3aed'}];
const MAP_THEMES = [{id:'grass',name:'草原',sky1:'#87CEEB',sky2:'#B0E0E6',grass1:'#4CAF50',grass2:'#388E3C',soil1:'#8D6E63',soil2:'#5D4037'},{id:'dusk',name:'黄昏',sky1:'#FFB74D',sky2:'#FFCC80',grass1:'#8D6E63',grass2:'#5D4037',soil1:'#4E342E',soil2:'#3E2723'},{id:'snow',name:'雪原',sky1:'#E1F5FE',sky2:'#B3E5FC',grass1:'#E0F2F1',grass2:'#B2DFDB',soil1:'#CFD8DC',soil2:'#90A4AE'}];
const ELEMENTS = {'岩':{h:32,sat:.72,icon:'🪨'},'火':{h:20,sat:1.15,icon:'🔥'},'水':{h:205,sat:1.05,icon:'💧'},'风':{h:158,sat:.88,icon:'🍃'},'草':{h:105,sat:1.0,icon:'🌿'},'冰':{h:188,sat:.85,icon:'❄️'},'雷':{h:272,sat:1.2,icon:'⚡'},'光':{h:52,sat:1.18,icon:'✨'},'暗':{h:276,sat:.85,icon:'🌑'},'空间':{h:215,sat:.28,icon:'🌌'},'时间':{h:260,sat:.55,icon:'⏳'},'幻':{h:320,sat:1.1,icon:'🌀'}};
const ELEMENT_KEYS = Object.keys(ELEMENTS);

function refreshUIIcons(root){root=root||document;const nav={space:'home',summon:'spark',travel:'map',bag:'bag',status:'person'};const acts={settings:'settings',summon:'spark',mergeopen:'spark',cycleMap:'map',globalplan:'map',setupTeam:'person',abyssSetup:'sword',refill:'food',selectToy:'ball',toggleSpaceMode:'home',buy:'bag',buy10:'bag',breakthrough:'bolt',claimGoal:'gift',challengeStart:'sword',claimExplore:'bag'};root.querySelectorAll('button[data-act]').forEach(b=>{const a=b.dataset.act;if(a==='tab'){const ic=b.querySelector('.ico');if(ic)ic.innerHTML=uiIcon(nav[b.dataset.tab]);return;}let name=acts[a];if(!name||b.querySelector('.ui-icon'))return;if(a==='globalplan'&&b.dataset.type==='clear')name='back';if(a==='selectToy'&&b.dataset.toy==='stack')name='stack';if(a==='settings'){b.innerHTML=uiIcon(name);return;}for(const n of Array.from(b.childNodes)){if(n.nodeType===3)n.textContent=n.textContent.replace(/^[\s✨🗺️↩️👥⚔️🥣🎮⚽🧱⚡🎁◇]+/u,'').replace(/[✨]+$/u,'');}b.insertAdjacentHTML('afterbegin',uiIcon(name));});}

const BOND_MILESTONES=[{need:0,name:'初识',face:'happy'},{need:5,name:'熟悉',face:'like'},{need:15,name:'信赖',face:'jump'},{need:30,name:'挚友',face:'like'}];
function bondMilestone(s){return BOND_MILESTONES.slice().reverse().find(m=>(Number(s.intimacy)||0)>=m.need)||BOND_MILESTONES[0];}
function gainCompanionIntimacy(s,now){const before=bondMilestone(s);const last=Number(s.lastPetAt),hasLast=s.lastPetAt!==undefined && s.lastPetAt!==null && Number.isFinite(last);const gained=!hasLast || now<last || now-last>=30000;if(gained){s.intimacy=(Number(s.intimacy)||0)+1;s.lastPetAt=now;}return {before,bond:bondMilestone(s),gained};}

function renderExploreScene(){
  const map = MAP_THEMES[S.exploreMapIndex] || MAP_THEMES[0];
  const dispatched = S.slimes.filter(s => isDispatched(s));
  const now = Date.now();
  function buildSlimeEl(s, i, opts){opts = opts || {};const scaleMul = opts.scaleMul || 1;const preferWalk = !!opts.preferWalk;const isJump = preferWalk ? Math.random() < 0.3 : Math.random() < 0.5;const nextToggle = now + 500 + Math.random() * 800;const sz = clamp(s.size || 1, 0.6, 1.6);const scale = 0.18 * sz * scaleMul;const w = Math.round(26 * sz * scaleMul);const h = Math.round(22 * sz * scaleMul);return `<div class="explore-slime ${isJump?'jumping':'walking'}" style="width:${w}px;height:${h}px;--ex-scale:${scale.toFixed(3)};--delay:${(i*0.2).toFixed(2)}s" data-sid="${s.id}" data-row="${opts.row || 'back'}" data-next-toggle="${nextToggle}">${slimeHTML(s,{mood:'idle'})}</div>`;}
  let slimesHTML;
  if(!dispatched.length){slimesHTML = `<div class="explore-slimes" style="bottom:18%;"><span class="explore-empty-text">暂无史莱姆在探险</span></div>`;}
  else if(dispatched.length <= 5){slimesHTML = `<div class="explore-slimes" style="bottom:18%;">${dispatched.map((s,i)=>buildSlimeEl(s,i,{row:'back'})).join('')}</div>`;}
  else {const half = Math.ceil(dispatched.length / 2);let rowBack = dispatched.slice(0, half);let rowFront = dispatched.slice(half);const sortedBySize = [...dispatched].sort((a,b)=>(b.size||1)-(a.size||1));const top3Ids = new Set(sortedBySize.slice(0,3).map(x=>x.id));const lastFront = rowFront[rowFront.length - 1];if(lastFront && top3Ids.has(lastFront.id)){let swapped = false;for(let i = rowFront.length - 2; i >= 0; i--){if(!top3Ids.has(rowFront[i].id)){const tmp = rowFront[i];rowFront[i] = rowFront[rowFront.length - 1];rowFront[rowFront.length - 1] = tmp;swapped = true;break;}}if(!swapped){for(let i = rowBack.length - 1; i >= 0; i--){if(!top3Ids.has(rowBack[i].id)){const tmp = rowBack[i];rowBack[i] = rowFront[rowFront.length - 1];rowFront[rowFront.length - 1] = tmp;swapped = true;break;}}}}slimesHTML = `<div class="explore-slimes" style="bottom:22.2%;">${rowBack.map((s,i)=>buildSlimeEl(s,i,{row:'back', scaleMul:0.99})).join('')}</div><div class="explore-slimes" style="bottom:14.4%;">${rowFront.map((s,i)=>buildSlimeEl(s,i,{row:'front', scaleMul:0.8, preferWalk:true})).join('')}</div>`;}
  return `<div class="explore-scene" style="--sky1:${map.sky1};--sky2:${map.sky2};--grass1:${map.grass1};--grass2:${map.grass2};--soil1:${map.soil1};--soil2:${map.soil2};"><div class="bg-scroll"><div class="bg-panel"><div class="scene-sky"></div><div class="scene-grass"></div><div class="scene-soil"></div>${mapLandmarks(map)}</div><div class="bg-panel"><div class="scene-sky"></div><div class="scene-grass"></div><div class="scene-soil"></div>${mapLandmarks(map)}</div></div><span class="region-label">${map.id==='snow'?'极地冰原':map.id==='dusk'?'暮色遗迹':'林间小径'}</span><div class="explore-items-layer"></div>${slimesHTML}</div>`;
}

function renderSpace(){
  const isMonster = S.spaceMode === 'monster';
  const list = isMonster ? S.monsters : S.slimes;
  const idle = sortStarred(isMonster ? list : list.filter(s=>!isDispatched(s)));

function initPlayground(){

    let drag = null;

    el.addEventListener('pointermove', ev=>{if(!drag) return;const dx = ev.clientX - drag.startX;const dy = ev.clientY - drag.startY;if(Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;if(!drag.moved) return;if(s.isSystem && bubbleEl && !drag.sysBubbleShown){drag.sysBubbleShown = true;bubbleEl.textContent = pick(SYS_DRAG_QUOTES);bubbleEl.classList.add('show');clearTimeout(bubbleEl._t);}const pgRect = pg.getBoundingClientRect();let px = ((ev.clientX - pgRect.left) / pgRect.width) * 100;let py = ((ev.clientY - pgRect.top) / pgRect.height) * 100;px = clamp(px, minX, maxX);py = clamp(py, minY, maxY);obj.x = px; obj.y = py;el.style.left = px + '%';el.style.top = py + '%';const mdx = ev.clientX - drag.lastX;drag.velocity = drag.velocity * 0.6 + mdx * 0.4;drag.lastX = ev.clientX;drag.lastY = ev.clientY;const angle = clamp(drag.velocity * 4, -50, 50);const slimeEl = el.querySelector('.slime');if(slimeEl){slimeEl.dataset.mood = 'swing';slimeEl.style.transform = `scale(${dispScale}) rotate(${angle}deg)`;slimeEl.style.transition = 'transform .05s ease-out';}});

    plSlimes.push(obj);

  let trackMove = false;
  let lastTrackTime = 0;
  function handleTrack(ev) {const now = Date.now();if(now - lastTrackTime < 150) return;lastTrackTime = now;const rect = pg.getBoundingClientRect();const clickX = ((ev.clientX - rect.left) / rect.width) * 100;const clickY = ((ev.clientY - rect.top) / rect.height) * 100;const items = [];plSlimes.forEach(p => {if(p.el.classList.contains('dragging')) return;const s = isMonster ? S.monsters.find(x => x.id === p.sid) : S.slimes.find(x => x.id === p.sid);if (s && (s.intimacy || 0) >= 5) {items.push({p,x: clamp(clickX + rnd(-5, 5), p.minX, p.maxX),y: clamp(clickY + rnd(-5, 5), p.minY, p.maxY)});}});for(let iter = 0; iter < 12; iter++){let moved = false;for(let i = 0; i < items.length; i++){for(let j = i + 1; j < items.length; j++){const A = items[i], B = items[j];const dxPx = (B.x - A.x) * pgW / 100;const dyPx = (B.y - A.y) * pgH / 100;const d = Math.hypot(dxPx, dyPx);const minD = A.p.airR + B.p.airR;if(d >= minD) continue;const ux = d > 0.001 ? dxPx / d : (Math.random() < 0.5 ? -1 : 1);const uy = d > 0.001 ? dyPx / d : (Math.random() < 0.5 ? -1 : 1);const push = (minD - d) / 2 + 0.6;A.x = clamp(A.x - ux * push / pgW * 100, A.p.minX, A.p.maxX);A.y = clamp(A.y - uy * push / pgH * 100, A.p.minY, A.p.maxY);B.x = clamp(B.x + ux * push / pgW * 100, B.p.minX, B.p.maxX);B.y = clamp(B.y + uy * push / pgH * 100, B.p.minY, B.p.maxY);moved = true;}}if(!moved) break;}items.forEach(it => {const x = clamp(it.x, it.p.minX, it.p.maxX);const y = clamp(it.y, it.p.minY, it.p.maxY);moveEl(it.p, x, y);});resolveAirWalls();}

function showFloat(el, text, topOffset){const pg = $('#playground');if(!pg) return;const r = el.getBoundingClientRect();const p = pg.getBoundingClientRect();const x = r.left - p.left + r.width/2;const y = r.top - p.top + (topOffset||0);const d = document.createElement('div');d.className = 'float-text';d.textContent = text;d.style.left = x + 'px';d.style.top = y + 'px';pg.appendChild(d);setTimeout(()=>d.remove(), 1350);}

function refillTrough(){
  if(S.feedTrough >= 99){ toast('饲料槽已满（99包）'); return; }
  if((S.bag.food||0) <= 0){ toast('背包中没有饲料，请先购买'); return; }
  const n = Math.min(S.bag.food, 99 - S.feedTrough);
  S.bag.food -= n;
  S.feedTrough += n;
  save();
  const numEl = document.querySelector('.ft-right b');
  if(numEl) numEl.textContent = S.feedTrough + '/99';
  toast(`补充了 ${n} 包饲料\n饲料槽：${S.feedTrough}/99`, 'good');
}

function renderBag(){return Object.keys(ITEMS).filter(k=>k!=='expPotion').map(k=>{const it = ITEMS[k];const priceText = k==='ticket' ? `${it.price}积分` : `${it.price}晶币`;const price10 = k==='ticket' ? `${it.price*10}积分` : `${it.price*10}晶币`;const owned = S.bag[k] || 0;return `<div class="panel item-row"><div class="item-icon">${it.icon}</div><div class="item-info"><div class="item-name">${it.name} <span class="owned">×${owned}</span></div><div class="muted small" style="margin:3px 0 0;">${it.desc}</div></div><div class="item-buy-col"><button class="btn sm" data-act="buy" data-item="${k}">${priceText}</button><button class="btn sm gold" data-act="buy10" data-item="${k}">买10个 · ${price10}</button></div></div>`;}).join('') + `<div class="panel"><p class="muted small">提示：在【空间】中点击史莱姆，即可使用背包中的道具。饲料也可以在空间饲料槽中补充。词条抽取券仅可使用系统积分购买，系统积分通过完成系统任务获得。</p></div>`;}

function getSlime(id){ return S.slimes.find(s=>s.id===id) || S.monsters.find(s=>s.id===id); }
function heartColor(s){const v = Number(s.intimacy) || 0;if(v < 0){const t = clamp(-v / 100, 0, 1);const g = Math.round(154 * (1 - t));return `rgb(${g},${g},${g})`;}const t = clamp(v / 50, 0, 1);const r = Math.round(154 + (255 - 154) * t);const g = Math.round(160 + (122 - 160) * t);const b = Math.round(166 + (162 - 166) * t);return `rgb(${r},${g},${b})`;}
function heartIcon(color){return `<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" style="fill:${color};stroke:none"><path d="M20.5 5.5a5 5 0 0 0-8.5 2 5 5 0 0 0-8.5-2C-1 10 5 16 12 21c7-5 13-11 8.5-15.5Z"/></svg>`;}
function starHeartHTML(s){
  const on = !!s.starred;
  return `<span class="mc-star-wrap"><button class="mc-star-btn" data-act="toggleStar" data-id="${s.id}" aria-label="特别关注"></button><span class="mc-star ${on?'on':''}">★</span></span>

function toggleStar(id){const s = getSlime(id);if(!s) return;s.starred = !s.starred;save();if($('#modalBox .detail')) openDetail(id);else if(activeTab === 'space') renderTab();}

function autoUseExpPotionSilent(){if(!S.slimes.length) return false;let target = S.slimes[0];for(const s of S.slimes){ if(s.level < target.level) target = s; }addExp(target, 100);return true;}

function createSlime(forceMonster){
  const element = pickElement(summonBoost);
  const isMon = !!forceMonster;
  const strPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const agiPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const magPotential = isMon ? rndInt(12, 26) : rndInt(5, 20);
  const luck = isMon ? rndInt(3, 14) : rndInt(0, 10);
  const wit  = isMon ? rndInt(3, 14) : rndInt(0, 10);
  const baseSize = +(0.66 + Math.random() * 0.34).toFixed(2);
  const str = strPotential;
  const agi = agiPotential;
  const mag = magPotential;
  const initStaminaMax = Math.round(80 + baseSize * 40);
  const morality = rndInt(-100,100);
  const id = S.seq++;
  S.nameSeq = (S.nameSeq || 0) + 1;
  if(S.nameSeq >= 99) S.nameSeq = 1;
  const nameNo = S.nameSeq;
  const traits = [];
  if(Math.random() < 0.15){
    const count = Math.random() < 0.25 ? 2 : 1;
    const pool = [...TRAITS_POOL];
    for(let i=0;i<count && pool.length;i++){
      const idx = Math.floor(Math.random()*pool.length);
      const t = pool.splice(idx,1)[0];
      const nt = {n:t.n,d:t.d,k:t.k,v:t.v};
      refreshTraitDesc(nt);
      traits.push(nt);

function growthStat(potential, level){const p = Math.max(0, Number(potential)||0);return p + Math.max(0, (Number(level)||1)-1) * Math.round(p * 0.5);}
function growthStats(s, newLevel, potentials){const out = {};for(const key of ['str','agi','mag']){const potKey = key + 'Potential';const nextPot = potentials && Number.isFinite(potentials[potKey]) ? potentials[potKey] : s[potKey];out[key] = (Number(s[key])||0) + Math.max(0,growthStat(nextPot, newLevel) - growthStat(s[potKey], s.level));}return out;}
function addExp(s, amount){const rate = expRate(s);const actual = Math.max(0, Math.round((Number(amount)||0) * rate));if(!Number.isFinite(actual) || actual <= 0) return false;addSummonerExp(Math.max(1, Math.round(actual * 0.1)));s.exp = (Number(s.exp)||0) + actual;let leveled = false;while(s.exp >= slimeExpNeed(s.level)){s.exp -= slimeExpNeed(s.level);const nextLevel = s.level + 1;Object.assign(s, growthStats(s, nextLevel));s.level = nextLevel;s.size = +(s.size + 0.0016).toFixed(3);leveled = true;}if(leveled) s.hp = hpMax(s);return leveled;}
function buyItem(k, qty){qty = qty || 1;const it = ITEMS[k];const total = it.price * qty;if(k === 'ticket'){if(S.points < total){ toast(`系统积分不足（需要 ${total} 积分）`); return; }S.points -= total;S.bag.ticket = (S.bag.ticket||0) + qty;save(); renderTop(); renderTab();toast(`购买成功：${it.name} ×${qty}`, 'good');return;}if(k === 'expPotion'){if(S.coins < total){ toast('晶币不足'); return; }S.coins -= total;let used = false;for(let i=0;i<qty;i++){if(autoUseExpPotionSilent()) used = true;else S.bag.expPotion = (S.bag.expPotion||0) + 1;}save(); renderTop(); renderTab();if(used) toast(`🧪 经验药水已自动使用于等级最低的史莱姆`, 'good');else toast('没有史莱姆，经验药水已暂存');return;}if(S.coins < total){ toast('晶币不足'); return; }S.coins -= total;S.bag[k] = (S.bag[k]||0) + qty;save(); renderTop(); renderTab();toast(`购买成功：${it.name} ×${qty}`, 'good');}

function doMerge(){
  const a = mergeSel[0] ? getSlime(mergeSel[0]) : null;
  const b = mergeSel[1] ? getSlime(mergeSel[1]) : null;
  if(!a || !b) return;
  const preview = mergePreview(a,b);
  if(!preview.valid){ toast(preview.reason); return; }
  if(mergePreviewSignature && mergePreviewSignature !== mergeStateSignature(a,b)){ openMerge(); toast('宠物在预览期间获得了成长，已更新预览；请再次确认费用与继承结果'); return; }
  if(S.coins < preview.cost){ openMerge(); toast(`晶币不足，合体需要 ${preview.cost} 晶币`); return; }
  const potBonus = Math.random() < 0.25 ? rndInt(1,3) : 0;
  const pots = {};
  for(const key of ['strPotential','agiPotential','magPotential']) pots[key] = Math.max(a[key], Math.min(40, a[key] + potBonus));
  const stats = growthStats(a, preview.level, pots);
  const mergedTraits = (a.traits||[]).map(t=>({...t}));
  (b.traits||[]).forEach(bt=>{
    const mt = mergedTraits.find(t=>t.n===bt.n);
    if(mt){ mt.v = +(mt.v * 1.2).toFixed(4); refreshTraitDesc(mt); }
    else if(mergedTraits.length < 3 && Math.random() < 0.5){ const nt = {...bt}; refreshTraitDesc(nt); mergedTraits.push(nt); }
  });
  const newSize = Math.random() < 0.1 ? +(a.size + b.size * 0.008).toFixed(3) : a.size;
  let newElement = a.element;
  if(a.element !== b.element){
    const r = Math.random();
    if(r >= 0.80 && r < 0.98) newElement = b.element;
    else if(r >= 0.98) newElement = pick(['草','冰','雷','幻','光','暗','空间','时间']);
  }
  ensureProgress();
  S.coins -= preview.cost;
  Object.assign(a, pots, stats, {element:newElement, level:preview.level, traits:mergedTraits, size:newSize,luck:Math.max(a.luck||0, Math.min(20, (a.luck||0) + (potBonus?1:0))),wit:Math.max(a.wit||0, Math.min(20, (a.wit||0) + (potBonus?1:0))),mergeCount:(Math.max(0, Math.floor(Number(a.mergeCount)||0)))+1});
  a.skill = HEAL_ELEMENTS.includes(newElement) ? '治疗' : '元素弹';
  a.hp = Math.min(a.hp, hpMax(a));
  S.slimes = S.slimes.filter(s=>s!==b);
  S.monsters = S.monsters.filter(s=>s!==b);
  delete S.customPlans[b.id];
  if(Array.isArray(S.exploreTeam)) S.exploreTeam = S.exploreTeam.filter(id=>id!==b.id);
  if(Array.isArray(S.lastAbyssSel)) S.lastAbyssSel = S.lastAbyssSel.filter(id=>id!==b.id);
  ensureProgress();
  mergeSel = [];
  mergePreviewSignature = '';
  save(); renderTop(); renderTab(); closeModal();
  toast(`合体完成：${a.name} 仍是你的老朋友！\n消耗 ${preview.cost} 晶币 · Lv.${a.level} · 天赋 ${calcTalent(a)}\n${b.name} 已被消耗；主宠名字、经验与亲密度保留`, 'good');
}

/* 合体词条气泡：宽度=第2列+第3列+gap；右侧与布局右边缘对齐；三角形位于词条标签中心 */
function showMergeTip(chip){
  const wrap = chip.closest('.merge-result-traits');
  const layout = chip.closest('.merge-layout');
  if(!wrap || !layout) return;
  let bubble = wrap.querySelector('.merge-tip-bubble');
  if(!bubble){
    bubble = document.createElement('div');
    bubble.className = 'merge-tip-bubble';
    wrap.appendChild(bubble);
  }
  bubble.textContent = chip.dataset.mergeTip || '';
  // 计算列宽
  const layoutRect = layout.getBoundingClientRect();
  const cs = window.getComputedStyle(layout);
  const gap = parseFloat(cs.columnGap) || 6;
  const total = layoutRect.width - gap * 2;
  const frSum = 1.25 + 0.7 + 1.25;
  const col2W = 0.7 / frSum * total;
  const col3W = 1.25 / frSum * total;
  const bubbleW = col2W + col3W + gap;
  // 右侧与布局右边缘对齐
  const bubbleRight = layoutRect.right;
  const bubbleLeft = bubbleRight - bubbleW;
  const wrapRect = wrap.getBoundingClientRect();
  const chipRect = chip.getBoundingClientRect();
  bubble.style.left = (bubbleLeft - wrapRect.left) + 'px';
  bubble.style.top = (chipRect.bottom - wrapRect.top + 9) + 'px';
  bubble.style.width = bubbleW + 'px';
  // 三角形位于词条标签正下方（相对气泡内部）
  const tailX = (chipRect.left + chipRect.width / 2) - bubbleLeft;
  bubble.style.setProperty('--tail-x', Math.max(8, Math.min(bubbleW - 8, tailX)) + 'px');
}

function startBallGame(s){

  const slimeEl = overlay.querySelector('#gameSlime');
  const ballEl = overlay.querySelector('#gameBall');
  const G = {slime: s, catches: 0, timeLeft: 30, running: true,field, slimeEl, ballEl,slimeX: 50, ballX: 50, ballY: 75,ballState: 'ready', animId: null, timers: []};
  ballGame = G;

  function showBall(v){ ballEl.classList.toggle('hidden', !v); }
  placeBall(50, 75);
  showBall(true);
  const slimeTimer = setInterval(()=>{if(!G.running) return;if(G.ballState === 'toSlime') return;G.slimeX = clamp(G.slimeX + rnd(-18,18), 18, 82);slimeEl.style.left = G.slimeX + '%';slimeEl.dataset.mood = Math.random()<0.5 ? 'jump' : 'crawl';setTimeout(()=>{ if(slimeEl && G.running) slimeEl.dataset.mood = 'idle'; }, 900);}, 1300);
  G.timers.push(slimeTimer);
  const clock = setInterval(()=>{if(!G.running) return;G.timeLeft--;overlay.querySelector('#gTime').textContent = Math.max(0, G.timeLeft);if(G.timeLeft <= 0) endGame();}, 1000);

function startStackGame(){
  if(stackGame) return;
  const idleSlimes = S.slimes.filter(s=>!isDispatched(s));
  if(idleSlimes.length < 1){ toast('空间中没有自由活动的史莱姆，无法进行游戏'); return; }
  const overlay = document.createElement('div');
  overlay.id = 'gameOverlay';
  const recordNow = S.stackRecord || 0;
  overlay.innerHTML = `<div class="game-hud"><span>🧱 最高纪录 <b id="gRecord">${recordNow}</b></span><span style="font-size:11px;color:var(--muted);">点击屏幕让史莱姆落下</span><button class="hud-close" id="gClose">退出</button></div><div class="game-field" id="gameField" style="overflow:hidden;"><div id="gCount" style="position:absolute;left:50%;top:14.28%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;line-height:1;color:var(--text);opacity:.85;pointer-events:none;z-index:60;text-shadow:0 2px 14px rgba(0,0,0,.45);">0</div>${Array.from({length:14}).map(()=>`<div class="bg-star" style="left:${rnd(2,98)}%;top:${rnd(2,98)}%;"></div>`).join('')}</div>`;
  $('#app').appendChild(overlay);
  const field = overlay.querySelector('#gameField');
  requestAnimationFrame(()=>{
    const W = field.clientWidth;
    const H = field.clientHeight;
    if(!W || !H){ setTimeout(()=>{ overlay.remove(); stackGame=null; }, 100); return; }
    const pool = idleSlimes;
    let usedIndex = 0;
    let activeEl = null;
    let activeObj = null;
    let activeX = 15;
    let activeDir = 1;
    let state = 'moving';
    let dropY = 0;
    const dropSpeed = H * 0.9;
    const stack = [];
    let lastT = 0;
    const G = { running: true };
    stackGame = G;
    const countEl = overlay.querySelector('#gCount');
    function getSize(s){const sz = clamp(s.size || 1, 0.6, 1.6);const w = 56 * sz;const h = w * 118 / 140;return {w, h};}
    function buildSlimeEl(s){const {w, h} = getSize(s);const el = document.createElement('div');el.style.position = 'absolute';el.style.width = w + 'px';el.style.height = h + 'px';el.style.pointerEvents = 'none';const inner = document.createElement('div');inner.style.position = 'absolute';inner.style.left = '50%';inner.style.bottom = '0';inner.style.transformOrigin = '50% 100%';inner.style.transform = `translateX(-50%) scale(${w/140})`;inner.innerHTML = slimeHTML(s, {mood:'idle'});el.appendChild(inner);return {el, w, h};}
    function spawnActive(){if(!G.running) return;const s = pool[usedIndex % pool.length];const {el, w, h} = buildSlimeEl(s);const lastTop = stack.length ? stack[stack.length - 1].topY : (H * 0.2 - h/2);let topY = Math.min(H * 0.2 - h/2, lastTop - h * 1.5);topY = Math.max(-h * 1.2, topY);el.style.top = topY + 'px';activeEl = el;activeObj = {slime: s, w, h};updateActiveLeft();field.appendChild(el);}
    function updateActiveLeft(){if(!activeEl || !activeObj) return;const x = W * activeX / 100 - activeObj.w / 2;activeEl.style.left = x + 'px';}
    function trimOutOfScreen(){stack.forEach(it=>{if(it.el && it.topY + it.h < 0){it.el.remove();it.el = null;}});}
    function placeCurrent(){
      const item = {slime: activeObj.slime, w: activeObj.w, h: activeObj.h,centerX: activeX, topY: dropY, el: activeEl};
      stack.push(item);
      usedIndex++;
      countEl.textContent = stack.length;
      if(stack.length > (S.stackRecord||0)){S.stackRecord = stack.length;overlay.querySelector('#gRecord').textContent = S.stackRecord;}
      const fx = document.createElement('div');
      fx.style.position = 'absolute';fx.style.left = (activeX + '%');fx.style.top = dropY + 'px';fx.style.transform = 'translate(-50%,-100%)';fx.style.fontSize = '18px';fx.style.color = '#4ade80';fx.style.fontWeight = '800';fx.style.pointerEvents = 'none';fx.style.zIndex = 50;fx.textContent = '✓';
      field.appendChild(fx);
      setTimeout(()=>fx.remove(), 600);
      activeEl.style.zIndex = 10 + stack.length;
      activeEl = null;
      activeObj = null;
      const last = stack[stack.length - 1];
      const limitY = H * 0.55;
      if(last.topY < limitY){
        const shift = limitY - last.topY;
        stack.forEach(it=>{it.topY += shift;if(it.el){it.el.style.transition = 'top .18s ease';it.el.style.top = it.topY + 'px';setTimeout(()=>{ if(it.el) it.el.style.transition = ''; }, 200);}});
      }
      trimOutOfScreen();
      setTimeout(()=>{if(!G.running) return;spawnActive();state = 'moving';}, 280);
    }
    function loop(t){
      if(!G.running) return;
      if(!lastT) lastT = t;
      const dt = Math.min(0.05, (t - lastT)/1000);
      lastT = t;
      if(state === 'moving' && activeEl){
        activeX += activeDir * 32 * dt;
        if(activeX > 90){ activeX = 90; activeDir = -1; }
        if(activeX < 10){ activeX = 10; activeDir = 1; }
        updateActiveLeft();
      } else if(state === 'dropping' && activeEl){
        dropY += dropSpeed * dt;
        activeEl.style.top = dropY + 'px';
        const bottomY = dropY + activeObj.h;
        const prev = stack[stack.length - 1];
        if(!prev){
          if(bottomY >= H){dropY = H - activeObj.h;activeEl.style.top = dropY + 'px';placeCurrent();}
        } else {
          if(bottomY >= prev.topY){
            const dxPx = Math.abs(W * (activeX - prev.centerX) / 100);
            const limit = prev.w / 4;
            if(dxPx <= limit){
              const overlap = Math.min(4, Math.round(activeObj.h * 0.08));
              dropY = prev.topY - activeObj.h + overlap;
              activeEl.style.top = dropY + 'px';
              placeCurrent();
            } else {
              if(dropY > H){ endGame(); return; }
            }
          } else if(dropY > H){ endGame(); return; }
        }
      }
      requestAnimationFrame(loop);
    }
    field.addEventListener('click', ()=>{if(!G.running) return;if(state === 'moving' && activeEl){state = 'dropping';dropY = parseFloat(activeEl.style.top) || (H*0.2 - activeObj.h/2);}});
    function endGame(){
      if(!G.running) return;
      G.running = false;
      const n = stack.length;
      const isNewRecord = n > recordNow;
      const gains = {};
      stack.forEach(item=>{const id = item.slime.id;gains[id] = (gains[id]||0) + 1;});
      Object.keys(gains).forEach(id=>{const slime = S.slimes.find(x=>x.id === +id);if(slime){slime.mood = clamp(slime.mood + gains[id] * 5, 0, 100);slime.intimacy = (slime.intimacy||0) + gains[id];}});
      save();
      overlay.remove();
      stackGame = null;
      if(activeTab === 'space') renderTab();
      if(n > 0){
        if(isNewRecord){toast(`🧱 叠叠乐结束！\n成功叠放 ${n} 只史莱姆\n🎉 新纪录！最高 ${n} 只`, 'good');}
        else {toast(`🧱 叠叠乐结束！\n成功叠放 ${n} 只史莱姆\n历史最高 ${recordNow} 只\n史莱姆们的心情和亲密度提升了`, 'good');}
      } else {toast(`🧱 叠叠乐结束！\n没有叠放成功……\n下次加油～`);}
    }
    overlay.querySelector('#gClose').addEventListener('click', endGame);
    spawnActive();
    requestAnimationFrame(loop);
  });
}

  function doBasicParticleEffect(attacker, atkUnit, tgtUnit){
    if(!atkUnit || !tgtUnit) return;
    markBattleAction(atkUnit, tgtUnit);
    const from = getCoords(atkUnit), to = getCoords(tgtUnit);
    const angDeg = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
    const c = slimeColor(attacker);
    const h = c.h, s = Math.max(c.s,40), l = Math.max(c.l,55);
    const col = `hsl(${h} ${s.toFixed(1)}% ${l.toFixed(1)}%)`;
    const el = attacker.element;
    const offsets = [{dx: 0, dy: -7, size: 18, delay: 0},{dx: -7, dy: 5, size: 11, delay: 90},{dx: 7, dy: 5, size: 11, delay: 180}];
    offsets.forEach(o=>{
      setTimeout(()=>{
        const orb = document.createElement('div');
        orb.className = 'skill-orb';
        applyParticleStyle(orb, el, o.size, col);
        if(el === '风' || el === '空间'){
          orb.style.transform = `translate(-50%,-50%) rotate(${(angDeg + 180).toFixed(1)}deg)`;
        } else if(el === '岩' || el === '冰'){
          orb.style.width = (o.size * 1.8) + 'px';
          orb.style.height = (o.size * 0.5) + 'px';
          orb.style.transform = `translate(-50%,-50%) rotate(${angDeg.toFixed(1)}deg)`;
        }
        const sx = from.x + o.dx;
        const sy = from.y + o.dy;
        orb.style.left = sx+'px';
        orb.style.top = sy+'px';
        fieldEl.appendChild(orb);
        const t0 = performance.now(), dur = 380;
        function step(now){
          if(!orb.isConnected) return;
          const p = Math.min(1,(now-t0)/dur);
          const e = 1-Math.pow(1-p,2);
          orb.style.left = (sx+(to.x-sx)*e)+'px';
          orb.style.top = (sy+(to.y-sy)*e)+'px';
          orb.style.opacity = (1-p*0.6).toFixed(2);
          if(p<1) requestAnimationFrame(step); else orb.remove();
        }
        requestAnimationFrame(step);
      }, o.delay);
    });
  }

  function initBattleUnit(ref){

  function castStrike(attackerUnit, target, mult, opt){
    opt = opt || {};
    const ref = attackerUnit.ref;
    const atkEl = getUnitEl(attackerUnit, sideOfUnit(attackerUnit));
    const tSide = sideOfUnit(target);
    const tgtEl = getUnitEl(target, tSide);
    if(tgtEl && atkEl){
      const isBasicAtk = !opt.name || opt.name === '普攻';
      if(isBasicAtk){ doBasicParticleEffect(ref, atkEl, tgtEl); }
      else { doElementBallEffect(ref, atkEl, tgtEl, true, 1); }
    }
    const dodge = B.training || target.isMini ? 0 : dodgeRate(target.ref);
    if(Math.random()*100 < dodge){FX.float(tgtEl, 'MISS', { cls:'miss' });log(`${target.ref.name} 闪避了 ${ref.name} 的${opt.name || '攻击'}`);return 0;}
    let baseDmg = physAtk(ref) + (B.training ? 0 : rndInt(-3,3));
    baseDmg = Math.round(baseDmg * (B.atkBuff||1));
    if(attackerUnit.st.weakness > 0) baseDmg = Math.round(baseDmg * (1 - attackerUnit.st.weakness*0.05));
    let elemMult = 1;
    if(ELEMENT_CHART[ref.element] && ELEMENT_CHART[ref.element][target.ref.element]) { elemMult = ELEMENT_CHART[ref.element][target.ref.element]; }
    let dmg = Math.round(baseDmg * elemMult * (mult || 1));
    if(ref.element === '光' && target.ref.isMonster) dmg *= 2;
    const critBonus = target.st.frostbite * 5;
    const crit = !B.training && Math.random() < (critRate(ref)+critBonus)/100;
    if(crit) dmg = Math.round(dmg * 1.8);
    dmg = Math.max(1, dmg);
    if(!opt.noElement && !B.training) applyAttackerElement(attackerUnit, target);
    if(target.ref.element === '冰' && target.st.iceArmor > 0){ if(applyStatus(attackerUnit, 'frostbite', 1)) setTimeout(()=>log(`❄ ${ref.name} 被冰甲冻伤！`), 120); }
    const shield0 = shieldOf(target);
    const actual = dealDamage(target, dmg);
    if(tgtEl){
      FX.flash(tgtEl, crit);
      if(crit) FX.shake('crit');
      if(actual === 0){ FX.float(tgtEl, '护盾', { cls:'small' }); }
      else { const tag = elemMult > 1.2 ? ' 克制' : ''; FX.float(tgtEl, '-' + actual + (crit ? '!' : '') + tag,{ cls: crit ? 'crit' : (elemMult < 0.85 ? 'weak' : (elemMult > 1.2 ? 'strong' : '')) }); }
    }
    const elemMsg = elemMult > 1 ? '（克制！）' : (elemMult < 1 ? '（微弱）' : '');
    log(damageLogText(target, shield0, actual,`${ref.name} 的${opt.name || '攻击'}命中 ${target.ref.name}`, `${crit?'（暴击！）':''}${elemMsg}`));
    if(ref.element === '雷' && actual > 0) doSplash(attackerUnit, target, actual);
    if(ref.element === '草' && actual > 0){const heal = Math.round(actual * 0.5);attackerUnit.hp = Math.min(attackerUnit.maxHp, attackerUnit.hp + heal);FX.float(atkEl, '+' + heal, { cls:'good small' });if(tgtEl && atkEl){const cc = slimeColor(ref);const colGrass = `hsl(${cc.h} ${Math.max(cc.s,40).toFixed(1)}% ${Math.max(cc.l,55).toFixed(1)}%)`;later(()=>{ doDrainEffect(tgtEl, atkEl, colGrass); }, Math.round(520 / battleSpeed));}}
    if(!target.isMini && target.ref.element === '水' && target.hp > 0){const mini = spawnMiniSlime(target, tSide);if(mini) miniSlimeAttack(mini);}
    refreshBars();
    if(target.hp <= 0) handleUnitDeath(target, tSide);
    return actual;
  }
  function doSplash(attackerUnit, target, actual){if(!(actual > 0) || target.ref.element !== '水') return;const splash = Math.max(1, Math.round(actual * 0.2));let hitCount = 0;[B.allies, B.monsters].forEach(team=>{const s = team === B.allies ? 'ally' : 'enemy';team.forEach(u=>{const list = [{u, side:s}];(u.minis||[]).forEach(m=>{ if(m.hp > 0) list.push({u:m, side:s}); });list.forEach(w=>{if(w.u === target || w.u.hp <= 0) return;if(w.u.ref.element !== '水') return;dealDamage(w.u, splash);FX.float(getUnitEl(w.u, w.side), '-' + splash, { cls:'small' });hitCount++;if(w.u.hp <= 0) handleUnitDeath(w.u, w.side);});});});if(hitCount){log(`⚡ 电流顺着水流扩散，其他水史莱姆受到 ${splash} 点溅射伤害`);refreshBars();}}
  function playerBasic(attackerUnit, targetUnit){const ref = attackerUnit.ref;if(!attackerUnit || attackerUnit.hp <= 0) return false;if(attackerUnit.acted){ log(`${ref.name} 本回合已经行动过了`); renderSkillBar(); return false; }if(turnControl(attackerUnit, 'ally')){ attackerUnit.acted = true; renderSkillBar(); return false; }const enemyMain = getAllAliveMain('enemy');const target = targetUnit || pick(getAllAliveUnits('enemy'));if(!target || target.hp <= 0){ log('没有可攻击的目标'); renderSkillBar(); return false; }if(isUntargetable(target, enemyMain)){ log(`${target.ref.name} 虚化中，无法选中`); renderSkillBar(); return false; }castStrike(attackerUnit, target, 1, { name:'普攻' });attackerUnit.acted = true;renderSkillBar();return true;}
  function playerCast(attackerUnit, targetUnit){
    const ref = attackerUnit ? attackerUnit.ref : null;
    if(!ref) return false;
    const sk = skillOf(ref);
    if(!sk) return false;
    if(attackerUnit.hp <= 0) return false;
    if(attackerUnit.acted){ log(`${ref.name} 本回合已经行动过了`); renderSkillBar(); return false; }
    const cd = attackerUnit.cd[ref.element] || 0;

    if(turnControl(attackerUnit, 'ally')){ attackerUnit.acted = true; renderSkillBar(); return false; }
    const enemyMain = getAllAliveMain('enemy');
    let target = targetUnit || null;
    if(sk.target === 'enemy' && sk.kind !== 'revive'){ if(!target || target.hp <= 0){ log('没有可攻击的目标'); renderSkillBar(); return false; } if(isUntargetable(target, enemyMain)){ log(`${target.ref.name} 虚化中，无法选中`); renderSkillBar(); return false; } }

  /* 30 秒思考时间：不显示倒计时文本 */
  function waitForPlayer(unit, side, done, timeoutMs){
    B.paused = true;

      if(finished) return;

      B.paused = false;
      B._pauseResume = null;
      if(B.pauseTimer){ clearTimeout(B.pauseTimer); B.pauseTimer = null; }
      afterPlayerAction = null;
      skSel = null;
      skPick = null;
      markTargetable(false);
      lastSkillBarSig='';

      done();
    };
    B._pauseResume = () => {
      if(unit.hp > 0 && !unit.acted){
        const t = pick(getAllAliveUnits('enemy'));

    };
    B.pauseTimer = later(()=>{
      if(!B.running) return;
      if(unit.hp > 0 && !unit.acted){
        log(`⏱ ${unit.ref.name} 超时未操作，自动普攻`);
        const t = pick(getAllAliveUnits('enemy'));

      }
      finish(true);
    }, timeoutMs || 30000);
    afterPlayerAction = () => finish(false);
  }
  function enemyPhase(){
    if(!B.running) return;
    const stepDelay = Math.round(1400 / battleSpeed);
    checkRevive('enemy');
    if(!aliveMonsters().length){ log('怪物全部倒下！胜利！'); endBattle(true); return; }
    checkRevive('ally');
    if(!aliveAllies().length){ log('出战史莱姆全部倒下……'); endBattle(false); return; }
    const ms2 = aliveMonsters();
    const enemyMinis = [];
    ms2.forEach(m=>{ (m.minis||[]).forEach(x=>{ if(x.hp>0) enemyMinis.push(x); }); });
    const enemyActors = ms2.concat(enemyMinis);
    enemyActors.forEach((m, idx)=>{later(()=>{if(!B.running) return;if(m.hp <= 0) return;if(m.isMini) performMiniAction(m, 'enemy');else performAction(m, 'enemy');}, idx * stepDelay);});
    /* 敌方攻击完毕后到下一轮的等待时间减半：300 → 150 */
    later(()=>{if(!B.running) return;checkRevive('ally');checkRevive('enemy');if(!aliveAllies().length){ log('出战史莱姆全部倒下……'); endBattle(false); return; }if(!aliveMonsters().length){ log('怪物全部倒下！胜利！'); endBattle(true); return; }B.resolving = false;refreshIntentPanel();}, enemyActors.length * stepDelay + 150);
  }
  function endBattle(win){

    B.ended = true;

      if(totalExp>0) rewards.recipients.forEach(a=>{addExp(a.ref, Math.floor(totalExp/Math.max(1,rewards.recipients.length)));a.ref.mood=clamp(a.ref.mood+(win?10:3),0,100);});

    save(); renderTop(); renderTab();

    skSel = null;

    lastSkillBarSig = '';
    const loserLook = (el, mood) => {if(!el) return;const sl = el.querySelector('.slime');if(!sl) return;sl.classList.remove('dying');sl.dataset.dead = '0';sl.dataset.mood = mood;};
    if(win){const emojis = ['🌸','🌼','💮'];B.allies.forEach(b=>{const el = overlay.querySelector(`[data-ally-id="${b.ref.id}"]`);if(!el) return;loserLook(el, 'jump');const wrap = el.querySelector('.slime-wrap');if(wrap){for(let i=0;i<5;i++){const f = document.createElement('span');f.textContent = pick(emojis);f.style.position = 'absolute';f.style.left = rnd(5, 95) + '%';f.style.top = rnd(-150, -90) + '%';f.style.fontSize = rnd(7, 16) + 'px';f.style.zIndex = 40;f.style.pointerEvents = 'none';f.style.opacity = '0';f.style.animation = `flowerFall ${rnd(1.6, 2.8)}s ease-in forwards`;f.style.animationDelay = rnd(0, 1.2) + 's';wrap.appendChild(f);setTimeout(()=>f.remove(), 4500);}}});B.monsters.forEach(b=>loserLook(overlay.querySelector(`[data-mon-id="${b.ref.id}"]`), 'fear'));} else {B.allies.forEach(b=>loserLook(overlay.querySelector(`[data-ally-id="${b.ref.id}"]`), 'fear'));B.monsters.forEach(b=>loserLook(overlay.querySelector(`[data-mon-id="${b.ref.id}"]`), 'jump'));}
    const head = win ? '🎉 战斗胜利！' : '⚔️ 战斗结束……';
